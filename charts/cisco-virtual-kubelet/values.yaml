# Default values for cisco-virtual-kubelet.

# image is the shared default image for the manager, controller-worker, and VK
# pods.
# Individual overrides (controllerImage / vkImage) take precedence when set.
# tag defaults to the chart appVersion (the released image tag) when left empty.
image:
  repository: ghcr.io/cisco-open/cisco-virtual-kubelet
  tag: ""
  pullPolicy: IfNotPresent

# controllerImage overrides the image used for both the manager Deployment and
# the isolated network-controller workers it creates. Both runtimes execute
# subcommands from the same binary, so their image must remain identical.
# When not set (repository: ""), the shared `image` above is used.
controllerImage:
  repository: ""
  tag: ""
  pullPolicy: ""

# vkImage overrides the image passed to the manager via --vk-image, used only
# when it spawns per-device VK Deployments for CiscoDevice resources. It does
# not select the network-controller worker image.
# When not set (repository: ""), the shared `image` above is used.
vkImage:
  repository: ""
  tag: ""
  pullPolicy: ""

# replicaCount is fixed at 1; the controller uses leader election for HA.
replicaCount: 1

# nameOverride / fullnameOverride follow standard Helm conventions.
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Name of the controller ServiceAccount created by this chart.
  controllerName: cisco-virtual-kubelet-controller
  # Name of the VK ServiceAccount created by this chart (used by VK pods).
  vkName: cisco-virtual-kubelet

rbac:
  # profile controls how broad the per-device VK ClusterRole is.
  #
  # default preserves the historical all-capabilities role for compatibility.
  # strict removes reserved volume reads and high-risk write-class operation
  # permissions unless the matching runtime gate is enabled.
  profile: default

controller:
  # leaderElect enables leader election (recommended for multi-replica, keep
  # false for single replica).
  leaderElect: false
  # metricsBindAddress is the address the metrics endpoint binds to.
  metricsBindAddress: ":8080"
  # healthProbeBindAddress is the address the probe endpoint binds to.
  healthProbeBindAddress: ":8081"

aggregator:
  # When true, the controller manager runs an in-process per-device
  # ConfigReconciler instead of spawning one cisco-vk pod per
  # CiscoDevice. Picks the single-manager topology — one /metrics,
  # one log stream, lower per-fleet overhead. Trades that ergonomic
  # win for shared blast radius: a manager-pod restart pauses
  # reconcile for every device.
  #
  # The default (false) preserves the per-pod behaviour Phase 0/1
  # has shipped since day one.
  enabled: false

# topology enables the manager-owned CiscoDevice-to-Node identity, topology
# projection, and IOS-XE rollout-admission contract. It is deliberately off by
# default: enabling it changes Node writer ownership, creates one ServiceAccount
# per device (including an isolated legacy identity for unselected devices),
# and installs fail-closed native admission policies.
#
# The initial qualified control-plane floor is Kubernetes 1.35. Helm refuses to
# render this mode on an older cluster. The manager performs additional API
# discovery and ValidatingAdmissionPolicy type-check preflight before starting
# managed workers; a version check alone is not treated as proof of enforcement.
# Enabling an existing release requires a live Helm upgrade so lookup can
# preserve the exact shared worker bindings during their one-time retirement;
# offline GitOps pruning is not a supported migration path.
# Managed mode also requires the default serviceAccount.vkName because the
# controller combines the fixed cisco-virtual-kubelet-managed-worker role with
# a namespaced binding to cisco-virtual-kubelet-device, and rbac.profile=strict
# so disabled write-class controllers grant no latent RBAC.
topology:
  enabled: false
  policy:
    # Empty namespace/name values use the release namespace and
    # <fullname>-topology-policy. The policy and ledger must remain in the same
    # namespace so one manager can bind their immutable Kubernetes UIDs.
    namespace: ""
    name: ""

    # Only CiscoDevices matching this non-empty selector enter managed mode.
    # Label the intended CiscoDevice objects explicitly before enabling the
    # feature. Enrollment keys must live under topology.cisco.vk/* so native
    # admission protects entry to and exit from managed writer ownership.
    fleetSelector:
      matchLabels:
        topology.cisco.vk/managed: "true"
      matchExpressions: []

    # Required keys must exist on selected CiscoDevice.metadata.labels.
    # Projected keys are the bounded subset copied to the virtual Node.
    requiredTopologyKeys:
      - topology.kubernetes.io/region
      - topology.kubernetes.io/zone
    projectedTopologyKeys:
      - topology.kubernetes.io/region
      - topology.kubernetes.io/zone

    # Administrator ceilings are the cross-campaign safety authority.
    # Campaign values may tighten, never loosen, these transfer and
    # unavailability limits. Every domain key must also be required above.
    globalMaxConcurrentTransfers: 1
    globalMaxUnavailable: 1
    domainMaxConcurrentTransfers:
      topology.kubernetes.io/region: 1
    domainMaxUnavailable:
      topology.kubernetes.io/zone: 1

    healthFreshnessSeconds: 300
    maxCampaignTargets: 100
    maxActiveReservations: 256
    maxLedgerBytes: 262144

  ledger:
    # Empty uses <fullname>-topology-ledger. Helm creates an empty ledger and
    # never templates a UID; the manager initializes ledger.json and binds the
    # live ConfigMap UID into the policy's protected ledger-uid annotation.
    name: ""

nxos:
  # allowExperimentalReleases admits NX-OS release profiles backed only by
  # static upstream conformance evidence. Keep false until the release has
  # passed CVK live apply, verify, idempotence, removal, and rollback tests.
  allowExperimentalReleases: false

# telemetry is injected into the controller pod as environment variables.
# The CiscoDevice controller then propagates the same values to each
# per-device VK pod it creates, so the process that owns MDT-over-gNMI
# subscriptions also owns OTLP export configuration.
telemetry:
  otlp:
    # endpoint is the OTLP gRPC collector endpoint, for example
    # otelcol.observability:4317. When collector.enabled=true and this is
    # empty, the chart points CVK at the bundled collector Service.
    endpoint: ""
    # insecure disables TLS for the OTLP gRPC exporter. When
    # collector.enabled=true, the rendered env var is forced to true because
    # the bundled collector listens on plaintext gRPC.
    insecure: false
    # headers are serialized into OTEL_EXPORTER_OTLP_HEADERS for optional
    # collector metadata or auth headers. SECURITY: prefer headersSecret
    # below over inline headers when those headers carry auth tokens —
    # inline values land as literal EnvVar.value on every per-device pod
    # spec, where any holder of `get pod` in the device's namespace can
    # read them.
    headers: {}
    # headersSecret references a Secret whose key holds the JSON-encoded
    # OTLP headers map (same format as `headers` above). When name is set
    # the chart wires OTEL_EXPORTER_OTLP_HEADERS as a SecretKeyRef on the
    # controller pod AND the controller mirrors that SecretKeyRef onto
    # every per-device VK pod it spawns. Operators are responsible for
    # ensuring a Secret with this name exists in each namespace that has
    # a CiscoDevice CR (same model as imagePullSecrets). Leave name=""
    # to keep the literal-headers behaviour above.
    headersSecret:
      name: ""
      key: "OTEL_EXPORTER_OTLP_HEADERS"
  # yangModelsDir is the legacy in-image YANG path, propagated as
  # YANG_MODELS_DIR. Prefer the yangModels block below for k8s-native
  # delivery via a ConfigMap; this field stays for backward compatibility
  # when the operator builds its own image with YANG files baked in.
  yangModelsDir: ""
  # yangModels declares an optional ConfigMap-mounted YANG models directory.
  # When configMapName is set the chart mounts that ConfigMap (read-only,
  # optional) at mountPath on every controller and per-device pod, and
  # YANG_MODELS_DIR is set to mountPath. Operators populate the ConfigMap
  # from their own .yang sources (e.g. via `kubectl create configmap
  # cvk-yang --from-file=./yang/`). Leave configMapName empty to use the
  # legacy in-image yangModelsDir behavior.
  yangModels:
    configMapName: ""
    mountPath: /var/lib/cvk/yang
  # resourceAttributes are serialized into CVK_RESOURCE_ATTRIBUTES and merged
  # into OTel resource attributes by the per-device VK process.
  resourceAttributes: {}

gnoi:
  # insecure forces legacy, non-opt-in devices onto the insecure gnxi listener
  # even when their RESTCONF transport uses TLS. Explicit
  # spec.gnoi.transportSecurity=tls rejects this downgrade.
  insecure: false
  # port pins the device-side gNOI listener. Leave empty to let CVK infer
  # 50052 for insecure and 9339 for secure gNOI. Invalid values fail setup.
  port: ""
  # disabled sets CISCO_VK_GNOI_DISABLED and prevents CVK from constructing
  # the per-device gNOI client.
  disabled: false
  # enableSoftwareUpgrade opts per-device VK pods into the IOSXESoftwareUpgrade
  # reconciler. Disabled by default so a read-only gNOI deployment does not
  # implicitly gain OS install/activate authority.
  enableSoftwareUpgrade: false
  softwareUpgrade:
    # maxImageBytes is a hard per-image limit for URL and ConfigMap sources.
    # The default is 8 GiB, large enough for current IOS-XE images. URL
    # downloads are verified and cached in place in pod ephemeral storage under
    # /tmp; see the software-lifecycle guide before increasing this value.
    maxImageBytes: 8589934592
  # enableWriteClass opts per-device VK pods into IOSXEOperationalAction
  # destructive/write-class gNOI operations such as Reboot, FactoryReset,
  # FilePut, FileRemove, and ProvisionCertificate. The last operation can
  # replace IOS-XE's shared gNXI/gNMI identity and CA bundle. Managed topology
  # Phase 2 rejects this gate because its maintenance protocol admits only
  # campaign-owned IOSXESoftwareUpgrade leaves. Disabled by default.
  enableWriteClass: false

collector:
  # enabled deploys a small in-cluster OpenTelemetry Collector intended for
  # smoke tests and lab installs. Production installs should usually point
  # telemetry.otlp.endpoint at an externally managed collector.
  enabled: false
  image:
    repository: otel/opentelemetry-collector-contrib
    # Pinned for reproducible installs. Bump deliberately after lab smoke;
    # avoid `latest` so a routine helm upgrade can't pull a new collector
    # image with breaking config changes.
    tag: 0.121.0
    pullPolicy: IfNotPresent
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

config:
  # yangValidationMode controls the NetAsCode -> IOS-XE YANG validation
  # boundary before a config mutation is sent to the device. Valid values:
  # disabled, warn, strict. disabled preserves historical behaviour; warn logs
  # validation mismatches; strict blocks the reconcile before mutation.
  yangValidationMode: disabled

  # leaseNamespace is the shared namespace for per-(device, family)
  # arbitration leases. It covers config writers plus the platform-neutral
  # disruptive-mutation Lease shared by gNOI actions and software upgrades.
  # Set it when Lease objects from workers in different tenant namespaces must
  # be stored centrally. Device identity still includes the CiscoDevice
  # namespace. The cisco-vk ServiceAccount already has cluster-scoped lease
  # RBAC (see vk-rbac.yaml), so no additional bindings are required.
  #
  # Leave empty to store each worker's leases in its pod/device namespace.
  leaseNamespace: ""

# podSecurityContext is applied at the controller pod level. Defaults meet
# the Pod Security Standards "restricted" profile and match the distroless
# nonroot UID/GID baked into the image. If you supply a custom controller
# image with a different nonroot identity, override runAsUser, runAsGroup,
# and fsGroup together.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# containerSecurityContext is applied to the controller container. The
# controller needs no writable root filesystem (a writable /tmp is mounted
# from an emptyDir), no added capabilities, and no privilege escalation.
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Resources for the manager container only.
resources: {}
#  limits:
#    cpu: 200m
#    memory: 128Mi
#  requests:
#    cpu: 100m
#    memory: 64Mi

# Defaults for the per-device CVK Kubernetes workers created by the manager.
# These are distinct from CiscoDevice.spec.resourceLimits for hosted apps.
# CiscoDevice.spec.worker can override resources (as a complete block) and
# tmpSizeLimit independently. Empty defaults preserve existing deployments.
worker:
  resources: {}
  # Disk-backed /tmp emptyDir cap; use e.g. "10Gi" for image staging. This is
  # not a reservation: set worker.resources ephemeral-storage requests/limits and
  # leave room beyond maxImageBytes for logs, scratch files, and cached images.
  tmpSizeLimit: ""

nodeSelector: {}

tolerations: []

affinity: {}

podAnnotations: {}

podLabels: {}

# podDisruptionBudget guards the controller against voluntary
# disruptions (node drain, rolling restart). Disabled by default to
# keep the chart minimal; recommended-on for production deployments.
# See production-deployment-guide.md §8.
podDisruptionBudget:
  enabled: false
  # Pick exactly one of minAvailable / maxUnavailable. Defaults to
  # minAvailable=1 when both are unset.
  minAvailable: ""
  maxUnavailable: ""

# networkPolicy adds a default-deny ingress + explicit-allow egress policy for
# the controller pod only. It does not select dynamically created per-device VK
# pods; apply separate namespace/worker policies for those pods. Disabled by
# default because deviceCIDRs and API-server routing are environment-specific.
networkPolicy:
  enabled: false
  # CIDRs the controller is allowed to reach on the fixed management ports in
  # templates/networkpolicy.yaml. Add a separate policy for custom device or
  # gNOI ports and for per-device workers.
  deviceCIDRs: []
  #  - 10.0.10.0/24
  #  - 10.0.20.0/24
  # CIDRs allowed to scrape the controller's :8080/metrics endpoint.
  # Typically the Prometheus pod IP range.
  scraperCIDRs: []
  #  - 10.244.0.0/16

# serviceMonitor templates a Prometheus Operator ServiceMonitor
# pointing at the controller's :8080/metrics. Requires the
# Prometheus Operator CRDs (monitoring.coreos.com).
serviceMonitor:
  enabled: false
  # Scrape cadence + timeout.
  interval: 30s
  scrapeTimeout: 10s
  # Extra labels added to the ServiceMonitor (e.g. release: kube-prometheus).
  labels: {}
  # Optional Prometheus relabel configs.
  relabelings: []
  metricRelabelings: []
