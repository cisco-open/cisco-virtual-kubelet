                    format: date-time
                    type: string
                  inventoryRevision:
                    description: InventoryRevision identifies one complete, device-derived
                      workload scan.
                    format: int64
                    minimum: 1
                    type: integer
                  message:
                    maxLength: 256
                    type: string
                  observedControlRevision:
                    format: int64
                    minimum: 0
                    type: integer
                  observedPolicyEpoch:
                    format: int64
                    minimum: 1
                    type: integer
                  observedSessionToken:
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                    type: string
                  observedWorkerConfigRevision:
                    description: |-
                      A worker rotation makes the prior inventory stale; this value may advance
                      only together with a strictly newer device scan.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  observedWorkerPodUID:
                    description: |-
                      ObservedWorkerPodUID binds inventory to the app worker process, including
                      restarts that keep the same configuration. Required for split workers.
                    maxLength: 128
                    type: string
                  protocolVersion:
                    description: |-
                      ManagedDrainProtocolVersion identifies an explicitly enabled workload-drain
                      handshake. It is separate from ManagedUpgradeProtocolVersion so an older
                      rollout-v1 worker cannot accidentally interpret drain authority as mutation
                      authority.
                    enum:
                    - pdb-drain-v1
                    type: string
                  reason:
                    maxLength: 128
                    type: string
                  remainingAuthorizedPodUIDs:
                    description: |-
                      RemainingAuthorizedPodUIDs is the bounded set of selected Pod UIDs still
                      observed on the device.
                    items:
                      type: string
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: set
                    x-kubernetes-validations:
                    - message: remaining authorized Pod UIDs must contain 1-128 characters
                      rule: self.all(uid, uid.size() >= 1 && uid.size() <= 128)
                  unknownDeviceWorkloadCount:
                    format: int32
                    maximum: 2147483647
                    minimum: 0
                    type: integer
                  updatedAt:
                    format: date-time
                    type: string
                required:
                - inventoryComplete
                - inventoryObservedAt
                - inventoryRevision
                - observedControlRevision
                - observedPolicyEpoch
                - observedSessionToken
                - observedWorkerConfigRevision
                - protocolVersion
                - updatedAt
                type: object
                x-kubernetes-validations:
                - message: worker drain session identity is immutable
                  rule: self.protocolVersion == oldSelf.protocolVersion && self.observedSessionToken
                    == oldSelf.observedSessionToken && self.observedPolicyEpoch ==
                    oldSelf.observedPolicyEpoch
                - message: worker drain revisions cannot decrease
                  rule: self.observedControlRevision >= oldSelf.observedControlRevision
                    && self.inventoryRevision >= oldSelf.inventoryRevision
                - message: worker drain observation timestamps cannot regress
                  rule: self.inventoryObservedAt >= oldSelf.inventoryObservedAt &&
                    self.updatedAt >= oldSelf.updatedAt
                - message: a new inventory revision requires newer observation timestamps
                  rule: self.inventoryRevision == oldSelf.inventoryRevision || (self.inventoryRevision
                    > oldSelf.inventoryRevision && self.inventoryObservedAt > oldSelf.inventoryObservedAt
                    && self.updatedAt > oldSelf.updatedAt)
                - message: worker drain inventory evidence may change only with a
                    strictly newer inventory revision
                  rule: self.inventoryRevision > oldSelf.inventoryRevision || self
                    == oldSelf
                - message: worker configuration revision may change only with a strictly
                    newer inventory observation
                  rule: self.observedWorkerConfigRevision == oldSelf.observedWorkerConfigRevision
                    || (self.inventoryRevision > oldSelf.inventoryRevision && self.inventoryObservedAt
                    > oldSelf.inventoryObservedAt && self.updatedAt > oldSelf.updatedAt)
            type: object
            x-kubernetes-validations:
            - message: managerDrain cannot be removed once published
              rule: '!has(oldSelf.managerDrain) || has(self.managerDrain)'
            - message: workerDrain cannot be removed once published
              rule: '!has(oldSelf.workerDrain) || has(self.workerDrain)'
            - message: managerDrain Pod entries cannot be removed once published
              rule: '!has(oldSelf.managerDrain) || !has(oldSelf.managerDrain.pods)
                || (has(self.managerDrain) && has(self.managerDrain.pods) && oldSelf.managerDrain.pods.all(p,
                self.managerDrain.pods.exists(n, n.uid == p.uid)))'
            - message: managerDrain Pod entries cannot be added after publication
              rule: '!has(oldSelf.managerDrain) || !has(self.managerDrain) || !has(self.managerDrain.pods)
                || (has(oldSelf.managerDrain.pods) && self.managerDrain.pods.all(p,
                oldSelf.managerDrain.pods.exists(o, o.uid == p.uid)))'
            - message: workerDrain must bind the current manager drain session and
                may only lag its control revision
              rule: '!has(self.workerDrain) || (has(self.managerDrain) && self.workerDrain.protocolVersion
                == self.managerDrain.protocolVersion && self.workerDrain.observedSessionToken
                == self.managerDrain.sessionToken && self.workerDrain.observedPolicyEpoch
                == self.managerDrain.policyEpoch && self.workerDrain.observedControlRevision
                <= self.managerDrain.controlRevision)'
            - message: workerDrain remaining Pod UIDs must be a subset of the frozen
                manager snapshot
              rule: '!has(self.workerDrain) || !has(self.workerDrain.remainingAuthorizedPodUIDs)
                || (has(self.managerDrain) && has(self.managerDrain.pods) && self.workerDrain.remainingAuthorizedPodUIDs.all(uid,
                self.managerDrain.pods.exists(p, p.uid == uid)))'
        type: object
    served: true
    storage: true
    subresources:
      status: {}
