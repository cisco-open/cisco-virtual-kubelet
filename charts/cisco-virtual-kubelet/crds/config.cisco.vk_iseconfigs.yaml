---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: iseconfigs.config.cisco.vk
spec:
  group: config.cisco.vk
  names:
    kind: ISEConfig
    listKind: ISEConfigList
    plural: iseconfigs
    shortNames:
    - isecfg
    singular: iseconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.deviceRef.name
      name: Device
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.driftPolicy
      name: Drift
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ISEConfig is the per-device desired-configuration CR for Cisco
          ISE.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ISEConfigSpec declares the desired ISE configuration for a single CiscoDevice.
              The source payload follows the Network as Code ISE model: either a full
              `ise:` envelope or the inner configuration block can be supplied.
            properties:
              deviceRef:
                description: DeviceRef targets the CiscoDevice this configuration
                  applies to.
                properties:
                  name:
                    description: Name of the CiscoDevice the CR targets.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              driftDetectInterval:
                default: 5m
                description: |-
                  DriftDetectInterval is the cadence at which the driver re-fetches and
                  compares observed state to intent when the spec is otherwise quiescent.
                  Parsed as a Go duration; minimum 30s to avoid device hammering.
                type: string
              driftPolicy:
                default: revert
                description: DriftPolicy controls what happens when drift is found.
                enum:
                - revert
                - report
                - pause
                type: string
              managedFamilies:
                description: |-
                  ManagedFamilies is the closed list of NetAsCode ISE top-level families
                  this CR owns. Supported families are identity_management,
                  network_resources, network_access, device_administration, trust_sec, and
                  system.
                items:
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              modelSource:
                description: |-
                  ModelSource records the external Network as Code model/export that
                  produced Source. It is deliberately metadata-only: CVK reconciles the
                  canonical payload in Source.
                properties:
                  exporter:
                    description: |-
                      Exporter names the tool that produced the payload, such as
                      terraform-iosxe-nac-iosxe write_model_file or cvk-netascode-migrate.
                    type: string
                  format:
                    description: Format identifies the model dialect.
                    enum:
                    - netascode-iosxe
                    - netascode-ise
                    - netascode-fmc
                    - netascode-apic
                    type: string
                  modelVersion:
                    description: |-
                      ModelVersion is the upstream NetAsCode data-model version or module
                      version when the source pipeline can provide one.
                    type: string
                  resolved:
                    default: true
                    description: |-
                      Resolved is true when the payload has already had defaults, templates,
                      device groups, and inheritance expanded by the source NetAsCode toolchain.
                      Production migrations should import resolved payloads so CVK only owns
                      reconciliation, not Terraform's model-expansion semantics.
                    type: boolean
                  sourceRevision:
                    description: |-
                      SourceRevision identifies the customer Git commit, Terraform plan ID,
                      or other immutable source revision used for the import.
                    type: string
                required:
                - format
                - resolved
                type: object
              secretRefs:
                description: |-
                  SecretRefs lets the resolver merge sensitive configuration into the
                  resolved ISE intent from Kubernetes Secrets, so shared secrets and user
                  passwords never need to live in a ConfigMap or git-tracked YAML.
                items:
                  description: |-
                    FamilySecretRef binds a Kubernetes Secret to a family's intent
                    block. The named Secret is read from the same namespace as the
                    IOSXEConfig CR; cross-namespace references are deliberately
                    disallowed to keep RBAC trivial. Shape mirrors ConfigMapKeyRef
                    so operators have one mental model for both kinds of external
                    payload.
                  properties:
                    family:
                      description: |-
                        Family is the netascode family the snippet merges into. Must
                        be one of the names in ManagedFamilies; resolution fails if
                        it isn't, so a typo doesn't quietly produce a no-op.
                      minLength: 1
                      type: string
                    key:
                      description: |-
                        Key is the entry inside Secret.Data whose value is parsed as
                        a YAML/JSON snippet and merged into the family's intent. The
                        snippet must shape itself to fit under the family root —
                        `{"neighbors":[...]}` for bgp, `{"communities":[...]}` for
                        snmp_server — exactly as it would appear in a per-device
                        source.
                      minLength: 1
                      type: string
                    name:
                      description: Name of the Secret in the same namespace as the
                        CR.
                      minLength: 1
                      type: string
                  required:
                  - family
                  - key
                  - name
                  type: object
                type: array
              source:
                description: Source carries the per-device NetAsCode ISE configuration
                  payload.
                properties:
                  configMapRef:
                    description: |-
                      ConfigMapRef references a ConfigMap in the same namespace whose keyed
                      entry holds a netascode YAML document. Used for large configurations
                      that would otherwise bloat the CR past etcd's per-object limit.
                    properties:
                      key:
                        description: Key within the ConfigMap whose value is the netascode
                          YAML body.
                        minLength: 1
                        type: string
                      name:
                        description: Name of the ConfigMap (same namespace as the
                          CR).
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  inline:
                    description: |-
                      Inline is an inline netascode configuration. The payload is the content
                      of an iosxe.devices[].configuration block; the field is schemaless so
                      family shape evolves with the YANG release, not the CRD.
                    x-kubernetes-preserve-unknown-fields: true
                type: object
            required:
            - deviceRef
            - managedFamilies
            - source
            type: object
          status:
            description: ISEConfigStatus reports reconciliation state to users and
              GitOps agents.
            properties:
              conditions:
                description: Conditions follows the standard Kubernetes conditions
                  shape.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              drift:
                description: Drift lists the currently known divergences between intent
                  and device.
                items:
                  description: |-
                    DriftEntry records a single observed-vs-desired divergence. Paths are YANG
                    xpaths so the entry is unambiguous regardless of the family's shape.
                  properties:
                    desired:
                      description: Desired is the declared value (optional; omitted
                        for deletes).
                      type: string
                    detected:
                      description: Detected is the time the driver first observed
                        this specific entry.
                      format: date-time
                      type: string
                    family:
                      description: Family the drift belongs to.
                      type: string
                    observed:
                      description: |-
                        Observed is the value currently on the device (optional; omitted for
                        leaves absent from the device).
                      type: string
                    path:
                      description: Path is the YANG xpath of the leaf or list key
                        that differs.
                      type: string
                  required:
                  - family
                  - path
                  type: object
                maxItems: 50
                type: array
              familyStatus:
                description: FamilyStatus reports per-family state for each family
                  in ManagedFamilies.
                items:
                  description: FamilyStatus reports per-family reconciliation state.
                  properties:
                    entries:
                      description: |-
                        Entries counts the number of keyed items the driver observed for this
                        family on the device (e.g. number of VLANs). Zero for singleton families.
                      format: int32
                      type: integer
                    message:
                      description: Message is a short human-readable description.
                        Empty when state is InSync.
                      type: string
                    name:
                      description: Name of the netascode family (e.g. "vlan", "interface_ethernet").
                      type: string
                    opCount:
                      description: |-
                        OpCount is the number of writer ops produced by this tick's diff —
                        the metric verify.sh release-blocker assertions consult to confirm
                        an apply produced device-side work. Zero on InSync no-op ticks
                        after a converged reconcile; positive after a tick that wrote.
                      format: int32
                      type: integer
                    state:
                      description: |-
                        State is one of Pending, InSync, Drifted, ApplyError, Skipped,
                        Unsupported. The taxonomy is closed; unknown values are rejected.
                      enum:
                      - Pending
                      - InSync
                      - Drifted
                      - ApplyError
                      - Skipped
                      - Unsupported
                      type: string
                  required:
                  - name
                  - state
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              lastAppliedHash:
                description: LastAppliedHash is a stable SHA-256 over the canonicalised
                  resolved intent.
                type: string
              lastAppliedTime:
                description: LastAppliedTime records the most recent successful apply.
                format: date-time
                type: string
              lastDeviceCheck:
                description: LastDeviceCheck records the most recent reconcile tick
                  that reached ISE.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation the driver
                  last acted on.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is a coarse state summary: Pending, Validating, Applying, InSync,
                  Drifted, Failed, or Paused.
                enum:
                - Pending
                - Validating
                - Applying
                - InSync
                - Drifted
                - Failed
                - Paused
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
