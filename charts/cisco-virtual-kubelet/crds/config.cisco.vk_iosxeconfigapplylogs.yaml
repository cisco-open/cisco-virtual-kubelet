---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: iosxeconfigapplylogs.config.cisco.vk
spec:
  group: config.cisco.vk
  names:
    kind: IOSXEConfigApplyLog
    listKind: IOSXEConfigApplyLogList
    plural: iosxeconfigapplylogs
    shortNames:
    - iosxelog
    singular: iosxeconfigapplylog
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.deviceRef.name
      name: Device
      type: string
    - description: recent entries count
      jsonPath: .status.entries[*].time
      name: Entries
      type: integer
    - jsonPath: .status.truncatedTotal
      name: Truncated
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IOSXEConfigApplyLog is the per-device audit-log CR. Operators
          create one per device they want auditing for; the log is opt-in
          to keep the controller's blast radius narrow.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              IOSXEConfigApplyLogSpec opts a device into apply-time auditing.
              Once an operator creates a log CR for a device, the
              ConfigReconciler appends one entry per completed reconcile —
              success, drift, or failure. The Status.Entries slice is a
              circular buffer trimmed to MaxEntries oldest-first.

              The log is namespaced and named to match its device — by
              convention the log lives in the same namespace as the
              IOSXEConfig CRs that target the device. A device with no log
              CR is silently skipped; auditing is opt-in.
            properties:
              deviceRef:
                description: DeviceRef names the CiscoDevice this log belongs to.
                properties:
                  name:
                    description: Name of the CiscoDevice the CR targets.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              maxEntries:
                default: 50
                description: |-
                  MaxEntries caps Status.Entries[]. Older entries are dropped
                  in FIFO order when the cap is hit. The default keeps the CR
                  well under Kubernetes' soft 1.5 MiB per-object limit even
                  for chatty devices.
                format: int32
                maximum: 500
                minimum: 1
                type: integer
              retainBody:
                default: false
                description: |-
                  RetainBody, when true, stores the JSON-serialised resolved
                  intent (configuration tree + CLI blocks) on each ApplyLogEntry.
                  The body is what enables annotation-driven time-travel
                  replay (config.cisco.vk/replay-from-log) — without it the
                  log preserves the hash and family outcomes only.

                  Off by default because every entry can be ~10 KB; an
                  operator who wants 50 entries but only some-of-the-time
                  replay capability should keep it off and use shorter MaxEntries
                  when they need it on. Cap-aware: the entry size is still
                  bounded by Kubernetes' object size limit.

                  Interaction with IOSXEConfig.spec.secretRefs: the resolver
                  merges Secret-sourced material into the resolved intent, so
                  retainBody=true would persist that secret material into
                  status.entries[].body and undermine the SecretRefs promise.
                  The reconciler refuses to populate Body for any IOSXEConfig
                  that declares secretRefs and emits a
                  `ReplayBodyOmittedSecretRefs` Warning event so operators see
                  the silent replay-loss. To use replay with secret material
                  the operator must move the secret out of secretRefs (and
                  accept the security tradeoff).
                type: boolean
            required:
            - deviceRef
            type: object
          status:
            description: IOSXEConfigApplyLogStatus carries the audit trail.
            properties:
              conditions:
                description: Conditions follows the standard Kubernetes shape.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              entries:
                description: |-
                  Entries is the chronological list of recent applies; index 0
                  is the oldest retained, last index is the most recent. Capped
                  to spec.maxEntries.
                items:
                  description: |-
                    ApplyLogEntry is one row of the audit log. Mirrors the engine
                    Result fields the reconciler already produces, in compact form
                    so the slice stays etcd-friendly.
                  properties:
                    body:
                      description: |-
                        Body is the JSON-serialised resolved intent (configuration +
                        cliBlocks) at apply time. Populated only when the log CR
                        sets spec.retainBody=true. Used by the annotation-driven
                        replay flow on IOSXEConfig (Phase 7 time-travel) — an
                        operator restores a prior known-good shape by setting
                        `config.cisco.vk/replay-from-log: <log-name>:<entry-index>`
                        on the CR and the reconciler picks up the annotation, takes
                        the body verbatim as the resolved intent, and applies it.
                        Empty when RetainBody is false (the historical default).
                      type: string
                    families:
                      description: Families summarises per-family outcomes.
                      items:
                        description: |-
                          FamilyApplyOutcome compresses an engine.FamilyStatus down to the
                          fields auditors actually inspect.
                        properties:
                          family:
                            description: Family name (must match IOSXEConfig.spec.managedFamilies).
                            type: string
                          opCount:
                            description: OpCount is the number of transport ops the
                              writer emitted.
                            format: int32
                            type: integer
                          state:
                            description: State is the per-family terminal state.
                            type: string
                        required:
                        - family
                        - state
                        type: object
                      type: array
                    hash:
                      description: |-
                        Hash is the canonical-intent hash the apply landed on. Empty
                        when Phase != InSync (a failed apply doesn't pin a new
                        intent on the device).
                      type: string
                    message:
                      description: |-
                        Message carries the engine's top-line failure message when
                        Phase != InSync. Empty on the happy path.
                      type: string
                    phase:
                      description: |-
                        Phase is the engine's terminal phase (InSync | Drifted |
                        Failed | Paused).
                      type: string
                    sourceCR:
                      description: |-
                        SourceCR is the IOSXEConfig CR that drove this reconcile,
                        expressed as namespace/name@generation so an operator can
                        `kubectl get -n <ns> iosxeconfig <name>` and inspect the
                        current shape.
                      type: string
                    time:
                      description: |-
                        Time is the wall-clock at which the engine returned. Set by
                        the controller, not the device.
                      format: date-time
                      type: string
                  required:
                  - phase
                  - sourceCR
                  - time
                  type: object
                type: array
              oldestRetainedAt:
                description: |-
                  OldestRetainedAt records the timestamp of Entries[0]. Set
                  alongside Entries on every update so an operator can read the
                  retention window without scanning the slice.
                format: date-time
                type: string
              truncatedTotal:
                description: |-
                  TruncatedTotal counts entries dropped due to the MaxEntries
                  cap since the CR was created. Operators alert on rapid growth
                  — it indicates a chatty device or an under-sized cap.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
