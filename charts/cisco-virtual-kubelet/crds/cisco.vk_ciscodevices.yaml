                  campaignName:
                    maxLength: 253
                    minLength: 1
                    type: string
                  campaignNamespace:
                    maxLength: 63
                    minLength: 1
                    type: string
                  campaignUID:
                    maxLength: 128
                    minLength: 1
                    type: string
                  deviceGeneration:
                    format: int64
                    minimum: 1
                    type: integer
                  deviceUID:
                    maxLength: 128
                    minLength: 1
                    type: string
                  nodeUID:
                    maxLength: 128
                    minLength: 1
                    type: string
                  planHash:
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  policyEpoch:
                    description: |-
                      PolicyEpoch prevents cleanup from an older administrator-policy epoch from
                      fencing or clearing a later reservation that reuses the deterministic ID.
                    format: int64
                    minimum: 1
                    type: integer
                  projectionHash:
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  reservationID:
                    maxLength: 128
                    minLength: 1
                    type: string
                  state:
                    allOf:
                    - enum:
                      - Active
                      - Releasing
                    - enum:
                      - Active
                      - Releasing
                    description: |-
                      State is Active while a reservation may be acquired or retained and
                      Releasing before ledger cleanup begins. Releasing is itself still a full
                      topology/reclassification fence.
                    type: string
