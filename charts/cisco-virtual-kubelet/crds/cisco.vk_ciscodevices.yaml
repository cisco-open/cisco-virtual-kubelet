                - acquiredAt
                - acquisitionID
                - campaignName
                - campaignNamespace
                - campaignUID
                - deviceGeneration
                - deviceUID
                - nodeUID
                - planHash
                - policyEpoch
                - projectionHash
                - reservationID
                - state
                type: object
                x-kubernetes-validations:
                - message: topology lock transaction identity is immutable
                  rule: self.campaignNamespace == oldSelf.campaignNamespace && self.campaignName
                    == oldSelf.campaignName && self.campaignUID == oldSelf.campaignUID
                    && self.planHash == oldSelf.planHash && self.reservationID ==
                    oldSelf.reservationID && self.deviceUID == oldSelf.deviceUID &&
                    self.deviceGeneration == oldSelf.deviceGeneration && self.nodeUID
                    == oldSelf.nodeUID && self.projectionHash == oldSelf.projectionHash
