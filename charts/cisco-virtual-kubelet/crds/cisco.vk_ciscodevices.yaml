                    && self.deviceUID == oldSelf.deviceUID && self.nodeName == oldSelf.nodeName
                    && self.nodeUID == oldSelf.nodeUID && self.requestedAt == oldSelf.requestedAt)
                - message: maintenance controlRevision cannot decrease within a session
                  rule: self.sessionToken != oldSelf.sessionToken || self.controlRevision
                    >= oldSelf.controlRevision
              netAsCode:
                description: |-
                  NetAsCode records the Network as Code model stripe this device should
                  align with. It is descriptive status: the platform-specific config CRDs
                  remain the source of desired intent.
                properties:
                  format:
                    description: |-
                      Format is the platform model format string used by config CRDs, for
                      example netascode-iosxe or netascode-nxos.
                    type: string
                  sections:
                    description: Sections names the high-level NetAsCode sections
                      used for this stripe.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  stripe:
                    description: Stripe is the technology stripe, for example iosxe,
                      nxos, ise, or fmc.
                    type: string
                  type:
                    description: Type is the Network as Code model category.
                    enum:
                    - ControllerCentric
                    - DeviceCentric
                    - SolutionCentric
                    type: string
                type: object
              nodeIdentity:
                description: |-
                  NodeIdentity is the bounded manager-owned binding between this
                  namespaced CiscoDevice and its cluster-scoped virtual Node. The Node UID,
                  not the name alone, must be verified before manager patch or delete.
                properties:
                  deviceUID:
                    description: DeviceUID binds the record to this exact CiscoDevice
                      incarnation.
                    maxLength: 128
                    minLength: 1
                    type: string
                  nodeName:
                    description: NodeName is the immutable resolved Node name.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  nodeUID:
                    description: |-
                      NodeUID is the UID observed when the manager atomically reserved or
                      explicitly adopted NodeName.
                    maxLength: 128
                    minLength: 1
                    type: string
                  physicalIdentity:
                    description: |-
                      PhysicalIdentity is the lowercase canonical form of the immutable
                      administrator declaration in spec.physicalIdentity. It is the trusted
                      rollout/deduplication binding; authenticated worker inventory is only a
                      live consistency signal and must agree with it.
