                  rule: 'oldSelf.phase == ''Preparing'' ? self.phase in [''Preparing'',
                    ''LegacyWriterPending''] : (oldSelf.phase == ''LegacyWriterPending''
                    ? self.phase in [''LegacyWriterPending'', ''Complete''] : self.phase
                    == ''Complete'')'
