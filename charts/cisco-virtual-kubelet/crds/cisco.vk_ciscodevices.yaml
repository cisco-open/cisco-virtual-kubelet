                  rule: '!has(self.nodeReleasedAt) || self.nodeReleasedAt >= self.requestedAt'
                - message: legacy handoff completion cannot precede release
                  rule: '!has(self.completedAt) || (has(self.nodeReleasedAt) && self.completedAt
                    >= self.nodeReleasedAt)'
              maintenanceSession:
                description: |-
                  MaintenanceSession is the bounded durable manager-owned acknowledgement
                  for a worker mutation request. Managed workers must observe a matching
                  active token, Lease holder, operation, device, and Node incarnation before
                  dispatching a new mutation.
                properties:
                  acknowledgedAt:
                    description: |-
                      AcknowledgedAt is set only after the manager applies and verifies the
                      Node guard for this exact session.
                    format: date-time
                    type: string
                  controlRevision:
                    description: |-
                      ControlRevision is the campaign/operation control revision acknowledged
                      for this managed session. A new operation starts its own revision sequence.
                    format: int64
                    minimum: 0
                    type: integer
                  deviceUID:
                    description: DeviceUID binds the session to this CiscoDevice incarnation.
                    maxLength: 128
                    minLength: 1
                    type: string
                  lease:
                    description: |-
                      Lease is the exact current mutation Lease and holder that requested the
                      session.
                    properties:
                      holder:
                        description: Holder is the exact Lease holderIdentity that
                          submitted the request.
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: Name is the object's name.
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace is the object's namespace.
                        maxLength: 63
                        minLength: 1
                        type: string
                      uid:
                        description: UID rejects delete/recreate identity substitution.
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - holder
                    - name
                    - namespace
                    - uid
                    type: object
                  message:
                    description: Message is a bounded human-readable blocked or transition
                      explanation.
                    maxLength: 256
                    type: string
                  nodeName:
                    description: NodeName is the manager-resolved Node identity.
                    maxLength: 63
                    minLength: 1
                    type: string
                  nodeUID:
                    description: NodeUID binds the guard to the exact Node incarnation.
                    maxLength: 128
                    minLength: 1
                    type: string
                  operation:
                    description: Operation is the exact namespaced operation object
                      requesting mutation.
                    properties:
                      name:
                        description: Name is the object's name.
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace is the object's namespace.
                        maxLength: 63
                        minLength: 1
                        type: string
                      uid:
                        description: UID rejects delete/recreate identity substitution.
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    - uid
                    type: object
                  phase:
                    description: Phase is the current durable manager handoff phase.
                    enum:
                    - Acknowledged
                    - Active
                    - Settled
                    type: string
                  requestedAt:
                    description: RequestedAt is the request timestamp preserved across
                      renewal and restart.
                    format: date-time
                    type: string
                  sessionToken:
                    description: |-
                      SessionToken uniquely binds one request/acknowledgement exchange and must
                      not be reused for a later Lease holder or operation.
                    maxLength: 64
                    minLength: 16
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
                    type: string
                required:
                - controlRevision
                - deviceUID
                - lease
                - nodeName
                - nodeUID
                - operation
                - phase
                - requestedAt
                - sessionToken
                type: object
                x-kubernetes-validations:
                - message: acknowledgedAt is required after manager acknowledgement
                  rule: has(self.acknowledgedAt)
