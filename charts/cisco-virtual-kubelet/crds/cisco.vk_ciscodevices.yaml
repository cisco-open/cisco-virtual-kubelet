                  rule: 'self.phase == ''Preparing'' ? !has(self.nodeReleasedAt) &&
                    !has(self.completedAt) : (self.phase == ''LegacyWriterPending''
                    ? has(self.nodeReleasedAt) && !has(self.completedAt) : has(self.nodeReleasedAt)
                    && has(self.completedAt))'
