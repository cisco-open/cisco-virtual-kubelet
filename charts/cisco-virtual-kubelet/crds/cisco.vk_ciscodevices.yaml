                    type: array
                    x-kubernetes-list-map-keys:
                    - type
                    x-kubernetes-list-type: map
                  deviceConditionsHash:
                    description: |-
                      DeviceConditionsHash covers device phase and all current conditions,
                      including their status, reason, generation, transition time, and message.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  nodeReadyHeartbeatTime:
                    description: |-
                      NodeReadyHeartbeatTime is the bound worker's Ready heartbeat in the
                      snapshot. The rollout controller compares it with the live Node.
                    format: date-time
                    type: string
                  observedAt:
                    description: ObservedAt is manager time when this exact source
                      snapshot was verified.
                    format: date-time
                    type: string
                required:
                - deviceConditionsHash
                - nodeReadyHeartbeatTime
                - observedAt
                type: object
              legacyHandoff:
                description: |-
                  LegacyHandoff records the explicit, UID-bound reverse writer handoff from
                  managed topology to an isolated per-device legacy worker. A Complete
                  record is retained after NodeIdentity is cleared so later reconciles never
                  fall back to the release-wide shared ServiceAccount.
                properties:
                  completedAt:
                    description: CompletedAt is set only after the legacy writer readiness
                      proof passes.
                    format: date-time
                    type: string
                  deviceUID:
                    description: DeviceUID binds the handoff to this CiscoDevice incarnation.
                    maxLength: 128
                    minLength: 1
                    type: string
                  legacyWorkerUsername:
                    description: |-
                      LegacyWorkerUsername is the exact isolated ServiceAccount username that
                      must prove readiness. It can never name the chart-wide shared identity.
                    maxLength: 320
                    minLength: 1
                    type: string
                  nodeName:
                    description: NodeName and NodeUID bind the handoff to the exact
                      released Node.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  nodeReleasedAt:
                    description: |-
                      NodeReleasedAt is set immediately before the manager removes managed Node
                      ownership. The legacy readiness heartbeat must not predate it.
                    format: date-time
                    type: string
                  nodeUID:
                    maxLength: 128
                    minLength: 1
                    type: string
                  phase:
                    description: Phase is the current durable reverse handoff phase.
                    enum:
                    - Preparing
                    - LegacyWriterPending
                    - Complete
                    type: string
                  projectionHash:
                    description: ProjectionHash is the last managed projection released
                      by this handoff.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  requestedAt:
                    description: RequestedAt is manager time when the authorized request
                      was accepted.
                    format: date-time
                    type: string
