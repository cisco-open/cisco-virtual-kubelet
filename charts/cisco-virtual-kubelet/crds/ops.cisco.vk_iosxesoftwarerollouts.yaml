---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: iosxesoftwarerollouts.ops.cisco.vk
spec:
  group: ops.cisco.vk
  names:
    kind: IOSXESoftwareRollout
    listKind: IOSXESoftwareRolloutList
    plural: iosxesoftwarerollouts
    shortNames:
    - xerollout
    singular: iosxesoftwarerollout
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.plan.targetVersion
      name: Target
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.counts.planned
      name: Planned
      type: integer
    - jsonPath: .status.counts.succeeded
      name: Succeeded
      type: integer
    - jsonPath: .status.counts.failed
      name: Failed
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IOSXESoftwareRollout plans and admits a bounded IOS-XE software campaign.
          The manager owns fleet planning and never opens a device session; immutable
          IOSXESoftwareUpgrade leaves remain the only device-side executors.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              IOSXESoftwareRolloutSpec separates executable intent from authorization and
              runtime controls. Plan is immutable. Approval may be added exactly once and
              must name the manager-produced hash. Control is the only repeatably mutable
              part and carries a monotonic revision. Native admission policy must bind the
              three identity fields to request.userInfo and authorize approval separately.
            properties:
              approval:
                description: |-
                  Approval authorizes exactly status.frozenPlan.hash. Its absence means no
                  IOSXESoftwareUpgrade child may receive mutation permission.
                properties:
                  approvedAt:
                    description: ApprovedAt records when the exact plan was authorized.
                    format: date-time
                    type: string
                  approvedBy:
                    description: |-
                      ApprovedBy must be bound to request.userInfo.username by native admission
                      and authorized with the dedicated approve verb.
                    maxLength: 253
                    minLength: 1
                    type: string
                  planHash:
                    description: PlanHash must equal status.frozenPlan.hash at admission
                      time.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                required:
                - approvedAt
                - approvedBy
                - planHash
                type: object
              control:
                description: |-
                  Control carries pause/resume/cancel requests. Revision zero is the
                  required neutral value at creation.
                properties:
                  cancel:
                    description: Cancel terminally revokes future claims and requests
                      safe settlement.
                    type: boolean
                  pause:
                    description: |-
                      Pause prevents new leaf mutation claims. Already claimed work remains
                      observable and retains reservations.
                    type: boolean
                  reason:
                    description: Reason is a bounded human-readable audit explanation.
                    maxLength: 256
                    type: string
                  requestedAt:
                    description: RequestedAt records the control request time.
                    format: date-time
                    type: string
                  requestedBy:
                    description: RequestedBy must be bound to request.userInfo.username
                      on control writes.
                    maxLength: 253
                    minLength: 1
                    type: string
                  revision:
                    description: Revision is increased for every pause, resume, or
                      cancellation request.
                    format: int64
                    minimum: 0
                    type: integer
                required:
                - revision
                type: object
                x-kubernetes-validations:
                - message: control revision cannot decrease
                  rule: self.revision >= oldSelf.revision
                - message: a control change requires a larger revision
                  rule: self == oldSelf || self.revision > oldSelf.revision
                - message: cancellation is terminal
                  rule: '!has(oldSelf.cancel) || !oldSelf.cancel || (has(self.cancel)
                    && self.cancel)'
                - message: revision zero is neutral; non-zero controls require requester
                    identity and time
                  rule: 'self.revision == 0 ? ((!has(self.pause) || !self.pause) &&
                    (!has(self.cancel) || !self.cancel) && !has(self.requestedBy)
                    && !has(self.requestedAt) && !has(self.reason)) : (has(self.requestedBy)
                    && self.requestedBy.size() > 0 && has(self.requestedAt))'
              plan:
                description: |-
                  Plan is the immutable requested campaign input from which the manager
                  creates a canonical frozen target plan.
                properties:
                  budgets:
                    description: |-
                      Budgets independently limit transfer pressure and disruption risk. Until
                      a durable stage boundary exists, every active leaf consumes both kinds.
                    properties:
                      domains:
                        description: |-
                          Domains tightens transfer and/or disruption ceilings for independent
                          topology/risk dimensions. Administrator policy may only tighten further.
                        items:
                          description: |-
                            IOSXESoftwareRolloutDomainBudget tightens one full-path or independent-risk
                            label dimension.
                          properties:
                            maxConcurrentTransfers:
                              description: MaxConcurrentTransfers is the transfer
                                ceiling for each value/domain.
                              format: int32
                              maximum: 100
                              minimum: 1
                              type: integer
                            maxUnavailable:
                              description: MaxUnavailable is the unavailable-member
                                ceiling for each value/domain.
                              format: int32
                              maximum: 100
                              minimum: 1
                              type: integer
                            topologyKey:
                              description: TopologyKey is an administrator-allowlisted
                                CiscoDevice metadata label.
                              maxLength: 96
                              minLength: 1
                              pattern: ^([a-z0-9]([-a-z0-9.]*[a-z0-9])?/)?[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$
                              type: string
                          required:
                          - topologyKey
                          type: object
                          x-kubernetes-validations:
                          - message: at least one domain budget must be set
                            rule: has(self.maxConcurrentTransfers) || has(self.maxUnavailable)
                        maxItems: 16
                        type: array
                        x-kubernetes-list-map-keys:
                        - topologyKey
                        x-kubernetes-list-type: map
                      maxConcurrentTransfers:
                        default: 1
                        description: MaxConcurrentTransfers is the campaign-wide transfer
                          ceiling.
                        format: int32
                        maximum: 100
                        minimum: 1
                        type: integer
                      maxUnavailable:
                        default: 1
                        description: |-
                          MaxUnavailable is the campaign-wide intentional-disruption ceiling.
                          Existing unhealthy or maintained fleet members also consume policy
                          availability outside this campaign.
                        format: int32
                        maximum: 100
                        minimum: 1
                        type: integer
                    type: object
                  canaries:
                    description: |-
                      Canaries is an explicit, non-empty set of named hardware/capability
                      cohorts. Every distinct operations.cisco.vk/qualification-cohort value in
                      the target set must be represented, and each named device must carry the
                      matching value. Device names refer to CiscoDevices in this namespace.
                    items:
                      description: |-
                        IOSXESoftwareRolloutCanaryCohort names the exact devices qualifying one
                        protected operations.cisco.vk/qualification-cohort value before wider
                        admission.
                      properties:
                        devices:
                          description: |-
                            Devices explicitly names CiscoDevices in the campaign namespace. The
                            planner rejects names outside Targets and names repeated across cohorts.
                          items:
                            maxLength: 253
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                          maxItems: 100
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                        name:
                          description: Name is the stable, low-cardinality qualification-cohort
                            label value.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                      required:
                      - devices
                      - name
                      type: object
                    maxItems: 16
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  health:
                    description: Health defines freshness and soak gates for admission
                      and progression.
                    properties:
                      canarySoakSeconds:
                        default: 600
                        description: |-
                          CanarySoakSeconds is the required healthy interval after each canary
                          cohort settles.
                        format: int32
                        maximum: 604800
                        minimum: 0
                        type: integer
                      maxObservationAgeSeconds:
                        default: 300
                        description: |-
                          MaxObservationAgeSeconds is the maximum age accepted for device, Node,
                          and protected-domain health evidence.
                        format: int32
                        maximum: 86400
                        minimum: 30
                        type: integer
                      waveSoakSeconds:
                        default: 300
                        description: |-
                          WaveSoakSeconds is the healthy interval before admitting the next
                          non-canary wave.
                        format: int32
                        maximum: 604800
                        minimum: 0
                        type: integer
                    type: object
                  installTimeoutSeconds:
                    default: 3600
                    description: |-
                      InstallTimeoutSeconds is copied into every immutable leaf and covers
                      source resolution, transfer/install, and inventory convergence.
                    format: int32
                    maximum: 86400
                    minimum: 60
                    type: integer
                  maintenanceWindow:
                    description: |-
                      MaintenanceWindow gates each not-yet-claimed device mutation. It cannot
                      cancel an RPC already accepted by the switch.
                    properties:
                      notAfter:
                        description: |-
                          NotAfter is the latest time the reconciler may claim a new device mutation.
                          Past this, the CR transitions to a terminal phase with reason
                          MaintenanceWindowExpired unless a previously claimed mutation still needs
                          read-only observation.
                        format: date-time
                        type: string
                      notBefore:
                        description: NotBefore is the earliest time the reconciler
                          may begin lifecycle work.
                        format: date-time
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: notBefore must be earlier than or equal to notAfter
                      rule: '!has(self.notBefore) || !has(self.notAfter) || self.notBefore
                        <= self.notAfter'
                  pauseAfterCanary:
                    default: true
                    description: |-
                      PauseAfterCanary requires an explicit newer control revision to resume
                      after the complete canary set passes its health and soak gates.
                    type: boolean
                  rebootTimeoutSeconds:
                    default: 1800
                    description: |-
                      RebootTimeoutSeconds is copied into every immutable leaf and covers
                      activation, reachability, verification, and an independent rollback
                      convergence deadline.
                    format: int32
                    maximum: 86400
                    minimum: 60
                    type: integer
                  requestedAt:
                    description: RequestedAt records when the authenticated requester
                      submitted the plan.
                    format: date-time
                    type: string
                  requestedBy:
                    description: |-
                      RequestedBy is an audit assertion that native admission must bind to the
                      authenticated username on creation.
                    maxLength: 253
                    minLength: 1
                    type: string
                  rollbackOnFailure:
                    default: true
                    description: RollbackOnFailure is copied into each immutable leaf.
                      Default true.
                    type: boolean
                  source:
                    description: |-
                      Source is the one artifact source supported by the Phase 2 MVP. Mirror
                      selection and prefetch are deliberately not represented by this API.
                    properties:
                      imageFamily:
                        description: |-
                          ImageFamily is the operator-declared IOS-XE hardware image family. The
                          planner must still prove every target is compatible before approval.
                        maxLength: 64
                        minLength: 1
                        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                        type: string
                      sha256:
                        description: SHA256 pins identical content throughout the
                          campaign.
                        pattern: ^[a-f0-9]{64}$
                        type: string
                      url:
                        description: |-
                          URL is one HTTPS or SFTP image URI with no user information, query, or
                          fragment. Runtime endpoint and resolved-address policy remains mandatory.
                        maxLength: 2048
                        pattern: ^(https|sftp)://[^/?#@]+/[^?#]+$
                        type: string
                      urlSecretRef:
                        description: URLSecretRef references an endpoint-bound Secret
                          in this namespace.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                    required:
                    - imageFamily
                    - sha256
                    - url
                    type: object
                    x-kubernetes-validations:
                    - message: urlSecretRef.name must not be empty
                      rule: '!has(self.urlSecretRef) || self.urlSecretRef.name.size()
                        > 0'
                    - message: urlSecretRef.name must contain at most 253 characters
                      rule: '!has(self.urlSecretRef) || self.urlSecretRef.name.size()
                        <= 253'
                    - message: urlSecretRef is supported only for sftp sources in
                        the Phase 2 API
                      rule: '!has(self.urlSecretRef) || self.url.startsWith(''sftp://'')'
                    - message: sftp sources require an endpoint-bound urlSecretRef
                      rule: '!self.url.startsWith(''sftp://'') || has(self.urlSecretRef)'
                  strategy:
                    allOf:
                    - enum:
                      - Reload
                    - enum:
                      - Reload
                    default: Reload
                    description: |-
                      Strategy is Reload for the Phase 2 MVP. ISSU and NoReboot do not expose
                      the durable stage/activate boundary required by this campaign contract.
                    type: string
                  targetVersion:
                    description: TargetVersion is the IOS-XE version accepted by the
                      existing leaf API.
                    maxLength: 128
                    pattern: ^[0-9]+(\.[0-9]+)+([a-z])?$
                    type: string
                  targets:
                    description: Targets selects CiscoDevice objects only from the
                      rollout namespace.
                    properties:
                      allowAll:
                        default: false
                        description: AllowAll is the explicit acknowledgement required
                          for an empty selector.
                        type: boolean
                      maxTargets:
                        default: 100
                        description: |-
                          MaxTargets tightens the built-in 100-target ceiling. Administrator policy
                          may impose a smaller effective value.
                        format: int32
                        maximum: 100
                        minimum: 1
                        type: integer
                      selector:
                        description: Selector matches CiscoDevice metadata labels
                          in this rollout's namespace.
                        properties:
                          matchExpressions:
                            description: MatchExpressions is an AND of bounded set-based
                              requirements.
                            items:
                              description: |-
                                IOSXESoftwareRolloutLabelSelectorRequirement is one bounded Kubernetes
                                label selector requirement.
                              properties:
                                key:
                                  description: Key is a Kubernetes qualified label
                                    name.
                                  maxLength: 96
                                  minLength: 1
                                  type: string
                                operator:
                                  description: Operator is a Kubernetes set-based
                                    selector operator.
                                  enum:
                                  - In
                                  - NotIn
                                  - Exists
                                  - DoesNotExist
                                  type: string
                                values:
                                  description: |-
                                    Values is required and non-empty for In/NotIn and empty for
                                    Exists/DoesNotExist.
                                  items:
                                    maxLength: 63
                                    pattern: ^[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$
                                    type: string
                                  maxItems: 32
                                  type: array
                                  x-kubernetes-list-type: set
                              required:
                              - key
                              - operator
                              type: object
                              x-kubernetes-validations:
                              - message: In and NotIn require values; Exists and DoesNotExist
                                  forbid values
                                rule: 'self.operator in [''In'', ''NotIn''] ? has(self.values)
                                  && self.values.size() > 0 : !has(self.values) ||
                                  self.values.size() == 0'
                            maxItems: 32
                            type: array
                          matchLabels:
                            additionalProperties:
                              type: string
                            description: MatchLabels is an AND of equality requirements.
                            maxProperties: 32
                            type: object
                            x-kubernetes-validations:
                            - message: matchLabels keys and values are bounded
                              rule: self.all(k, v, k.size() <= 96 && v.size() <= 63)
                        type: object
                    required:
                    - selector
                    type: object
                    x-kubernetes-validations:
                    - message: set a non-empty selector, or set allowAll=true with
                        an empty selector
                      rule: 'self.allowAll ? !(has(self.selector.matchLabels) && self.selector.matchLabels.size()
                        > 0) && !(has(self.selector.matchExpressions) && self.selector.matchExpressions.size()
                        > 0) : (has(self.selector.matchLabels) && self.selector.matchLabels.size()
                        > 0) || (has(self.selector.matchExpressions) && self.selector.matchExpressions.size()
                        > 0)'
                  workloads:
                    description: Workloads defines the safe Phase 2 behavior for device-hosted
                      workloads.
                    properties:
                      policy:
                        allOf:
                        - enum:
                          - BlockIfRunning
                        - enum:
                          - BlockIfRunning
                        default: BlockIfRunning
                        description: Policy blocks admission when any workload is
                          running on the bound Node.
                        type: string
                    type: object
                required:
                - budgets
                - canaries
                - health
                - requestedAt
                - requestedBy
                - source
                - targetVersion
                - targets
                - workloads
                type: object
            required:
            - control
            - plan
            type: object
            x-kubernetes-validations:
            - message: plan is immutable; create a new rollout to change executable
                intent
              rule: self.plan == oldSelf.plan
            - message: approval is append-only and immutable once recorded
              rule: '!has(oldSelf.approval) || (has(self.approval) && self.approval
                == oldSelf.approval)'
          status:
            description: |-
              IOSXESoftwareRolloutStatus is a bounded manager-owned audit and progress
              surface. Detailed history belongs in retained immutable leaves, Events, and
              traces rather than an ever-growing campaign status.
            properties:
              approval:
                description: Approval reports manager validation of spec.approval.
                properties:
                  planHash:
                    description: PlanHash is the hash whose approval was evaluated.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  reason:
                    description: Reason is a bounded machine-readable validation reason.
                    maxLength: 128
                    minLength: 1
                    type: string
                  valid:
                    description: Valid is true only after native authorization and
                      hash equality succeed.
                    type: boolean
                  validatedAt:
                    description: ValidatedAt records the latest manager evaluation.
                    format: date-time
                    type: string
                required:
                - planHash
                - reason
                - valid
                - validatedAt
                type: object
              conditions:
                description: Conditions carries a bounded set of standard status conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              control:
                description: Control distinguishes a requested pause/cancel from the
                  effective fence.
                properties:
                  cancellationPending:
                    description: CancellationPending is true while claims/outcomes
                      are unresolved.
                    type: boolean
                  cancelled:
                    description: |-
                      Cancelled is true only after future claims are revoked and all accepted
                      work has reached a reconciled outcome.
                    type: boolean
                  effectiveRevision:
                    description: EffectiveRevision is fenced across every not-yet-claimed
                      leaf mutation.
                    format: int64
                    minimum: 0
                    type: integer
                  pausePending:
                    description: |-
                      PausePending is true while some leaf has not acknowledged the requested
                      pause revision.
                    type: boolean
                  paused:
                    description: Paused is true when the requested pause is effective
                      for future claims.
                    type: boolean
                  requestedRevision:
                    description: RequestedRevision is the latest spec.control revision
                      observed.
                    format: int64
                    minimum: 0
                    type: integer
                required:
                - effectiveRevision
                - requestedRevision
                type: object
              counts:
                description: Counts is a bounded aggregate over the frozen target
                  set.
                properties:
                  admitted:
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  blocked:
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  cancelled:
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  failed:
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  inProgress:
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  planned:
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  succeeded:
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  total:
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                type: object
              effectivePolicy:
                description: |-
                  EffectivePolicy is the durable admission epoch currently allowed to
                  create or grant unclaimed leaves. Its numeric ceilings only become more
                  restrictive over the lifetime of this rollout.
                properties:
                  epoch:
                    description: Epoch increases exactly once after every converged
                      semantic policy change.
                    format: int64
                    minimum: 1
                    type: integer
                  policy:
                    description: |-
                      Policy contains the monotonic effective ceilings and the identity of the
                      latest same-UID administrator policy observed for this epoch.
                    properties:
                      domains:
                        description: |-
                          Domains is the bounded frozen set of administrator transfer and
                          unavailable ceilings. Runtime admission applies the strictest value from
                          this snapshot, the current administrator policy, and the campaign plan.
                        items:
                          description: |-
                            IOSXESoftwareRolloutDomainBudget tightens one full-path or independent-risk
                            label dimension.
                          properties:
                            maxConcurrentTransfers:
                              description: MaxConcurrentTransfers is the transfer
                                ceiling for each value/domain.
                              format: int32
                              maximum: 100
                              minimum: 1
                              type: integer
                            maxUnavailable:
                              description: MaxUnavailable is the unavailable-member
                                ceiling for each value/domain.
                              format: int32
                              maximum: 100
                              minimum: 1
                              type: integer
                            topologyKey:
                              description: TopologyKey is an administrator-allowlisted
                                CiscoDevice metadata label.
                              maxLength: 96
                              minLength: 1
                              pattern: ^([a-z0-9]([-a-z0-9.]*[a-z0-9])?/)?[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$
                              type: string
                          required:
                          - topologyKey
                          type: object
                          x-kubernetes-validations:
                          - message: at least one domain budget must be set
                            rule: has(self.maxConcurrentTransfers) || has(self.maxUnavailable)
                        maxItems: 16
                        type: array
                        x-kubernetes-list-map-keys:
                        - topologyKey
                        x-kubernetes-list-type: map
                      healthFreshnessSeconds:
                        description: |-
                          HealthFreshnessSeconds is the maximum age of fleet-health evidence in the
                          approved administrator policy.
                        format: int32
                        maximum: 86400
                        minimum: 30
                        type: integer
                      ledgerName:
                        description: LedgerName is the name of the single authoritative
                          reservation ConfigMap.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      ledgerNamespace:
                        description: |-
                          LedgerNamespace is the namespace of the single authoritative reservation
                          ConfigMap.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
