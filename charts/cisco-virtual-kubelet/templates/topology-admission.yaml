{{- if .Values.topology.enabled }}
{{- include "cisco-virtual-kubelet.validateManagedTopology" . }}
{{- $fullname := include "cisco-virtual-kubelet.fullname" . }}
{{- $manager := include "cisco-virtual-kubelet.managerUsername" . }}
{{- $policyNamespace := include "cisco-virtual-kubelet.topologyPolicyNamespace" . }}
{{- $policyName := include "cisco-virtual-kubelet.topologyPolicyName" . }}
{{- $ledgerName := include "cisco-virtual-kubelet.topologyLedgerName" . }}
---
# A managed worker may update only status of its exact manager-bound Node. A
# topology-generated legacy worker may retain historical CRUD only for the
# exact unmarked Node embedded in its UID-derived ServiceAccount. The only
# managed-worker metadata deltas admitted on status are the two upstream
# Virtual Kubelet three-way-patch bookkeeping annotations plus the bounded
# worker-revision proof; labels, bindings, finalizers, owner references, and
# Node spec stay unchanged.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-managed-node
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["nodes", "nodes/status"]
        scope: Cluster
  matchConditions:
    - name: managed-node
      expression: >-
        (request.userInfo.username == {{ $manager | quote }} &&
         request.operation in ['CREATE', 'UPDATE']) ||
        request.userInfo.username.matches(
          '^system:serviceaccount:[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?:cisco-vk-managed-[a-z0-9]([-a-z0-9.]{0,61}[a-z0-9])?-[a-f0-9]{8}$') ||
        request.userInfo.username.matches(
          '^system:serviceaccount:[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?:cisco-vk-legacy-[a-z0-9]([-a-z0-9.]{0,61}[a-z0-9])?-[a-f0-9]{8}$') ||
        (object != null && has(object.metadata.annotations) &&
        'topology.cisco.vk/managed' in object.metadata.annotations &&
        object.metadata.annotations['topology.cisco.vk/managed'] == 'true') ||
        (oldObject != null && has(oldObject.metadata.annotations) &&
        'topology.cisco.vk/managed' in oldObject.metadata.annotations &&
        oldObject.metadata.annotations['topology.cisco.vk/managed'] == 'true')
  variables:
    - name: manager
      expression: request.userInfo.username == {{ $manager | quote }}
    - name: oldManaged
      expression: >-
        oldObject != null && has(oldObject.metadata.annotations) &&
        'topology.cisco.vk/managed' in oldObject.metadata.annotations &&
        oldObject.metadata.annotations['topology.cisco.vk/managed'] == 'true'
    - name: managerLegacyHandoff
      expression: >-
        variables.manager && request.operation == 'UPDATE' &&
        (!has(request.subResource) || request.subResource == '') &&
        variables.oldManaged && object != null &&
        object.metadata.name == oldObject.metadata.name &&
        object.metadata.uid == oldObject.metadata.uid &&
        ['topology.cisco.vk/device-namespace',
         'topology.cisco.vk/device-name',
         'topology.cisco.vk/device-uid',
         'topology.cisco.vk/node-uid',
         'topology.cisco.vk/worker-username',
         'topology.cisco.vk/worker-protocol'].all(k,
           k in oldObject.metadata.annotations &&
           oldObject.metadata.annotations[k] != '') &&
        oldObject.metadata.annotations['topology.cisco.vk/node-uid'] ==
          oldObject.metadata.uid &&
        oldObject.metadata.annotations['topology.cisco.vk/worker-protocol'] ==
          'rollout-v1' &&
        has(object.metadata.annotations) &&
        'topology.cisco.vk/legacy-handoff' in object.metadata.annotations &&
        object.metadata.annotations['topology.cisco.vk/legacy-handoff'] ==
          oldObject.metadata.annotations['topology.cisco.vk/node-uid'] &&
        ['topology.cisco.vk/managed',
         'topology.cisco.vk/device-namespace',
         'topology.cisco.vk/device-name',
         'topology.cisco.vk/device-uid',
         'topology.cisco.vk/node-uid',
         'topology.cisco.vk/worker-username',
         'topology.cisco.vk/worker-protocol',
         'topology.cisco.vk/worker-observed-revision',
         'topology.cisco.vk/projected-keys',
         'topology.cisco.vk/projection-hash',
         'topology.cisco.vk/managed-taints'].all(k,
           !(k in object.metadata.annotations))
    - name: legacyHandoffMarkerPreserved
      expression: >-
        request.operation == 'CREATE' ?
          (object != null &&
           (!has(object.metadata.annotations) ||
            !('topology.cisco.vk/legacy-handoff' in object.metadata.annotations))) :
        (request.operation == 'DELETE' ?
          (oldObject != null &&
           (!has(oldObject.metadata.annotations) ||
            !('topology.cisco.vk/legacy-handoff' in oldObject.metadata.annotations))) :
          (object != null && oldObject != null &&
           ((has(object.metadata.annotations) &&
             'topology.cisco.vk/legacy-handoff' in object.metadata.annotations) ==
            (has(oldObject.metadata.annotations) &&
             'topology.cisco.vk/legacy-handoff' in oldObject.metadata.annotations)) &&
           (!has(object.metadata.annotations) ||
            !('topology.cisco.vk/legacy-handoff' in object.metadata.annotations) ||
            object.metadata.annotations['topology.cisco.vk/legacy-handoff'] ==
              oldObject.metadata.annotations['topology.cisco.vk/legacy-handoff'])))
  validations:
    - expression: >-
        variables.manager ||
        (request.userInfo.username.matches(
           '^system:serviceaccount:[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?:cisco-vk-legacy-[a-z0-9]([-a-z0-9.]{0,61}[a-z0-9])?-[a-f0-9]{8}$') &&
        (request.operation == 'DELETE' ? oldObject != null : object != null) &&
        request.userInfo.username.split(':').size() == 4 &&
        request.userInfo.username.split(':')[3].startsWith(
          'cisco-vk-legacy-' +
          (request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name) + '-') &&
        request.userInfo.username.split(':')[3].size() ==
          ('cisco-vk-legacy-' +
           (request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name) + '-').size() + 8 &&
        (oldObject == null || !has(oldObject.metadata.annotations) ||
          !('topology.cisco.vk/managed' in oldObject.metadata.annotations) ||
          oldObject.metadata.annotations['topology.cisco.vk/managed'] != 'true') &&
        (object == null || !has(object.metadata.annotations) ||
          !('topology.cisco.vk/managed' in object.metadata.annotations) ||
          object.metadata.annotations['topology.cisco.vk/managed'] != 'true') &&
        variables.legacyHandoffMarkerPreserved) ||
        (request.operation == 'UPDATE' && has(request.subResource) && request.subResource == 'status' &&
        variables.oldManaged &&
        'topology.cisco.vk/worker-username' in oldObject.metadata.annotations &&
        request.userInfo.username == oldObject.metadata.annotations['topology.cisco.vk/worker-username'] &&
        object.metadata.name == oldObject.metadata.name &&
        object.metadata.uid == oldObject.metadata.uid &&
        has(object.metadata.labels) == has(oldObject.metadata.labels) &&
        (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels) &&
        has(object.metadata.finalizers) == has(oldObject.metadata.finalizers) &&
        (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers) &&
        has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences) &&
        object.metadata.annotations.transformMap(k, v,
          k != 'virtual-kubelet.io/last-applied-node-status' &&
          k != 'virtual-kubelet.io/last-applied-object-meta' &&
          k != 'topology.cisco.vk/worker-observed-revision', v) ==
        oldObject.metadata.annotations.transformMap(k, v,
          k != 'virtual-kubelet.io/last-applied-node-status' &&
          k != 'virtual-kubelet.io/last-applied-object-meta' &&
          k != 'topology.cisco.vk/worker-observed-revision', v) &&
        (!('topology.cisco.vk/worker-observed-revision' in object.metadata.annotations) ||
         object.metadata.annotations['topology.cisco.vk/worker-observed-revision'].matches(
           '^sha256:[a-f0-9]{64}$')) &&
        object.spec == oldObject.spec)
      message: managed Nodes are manager/bound-worker owned; a legacy worker may mutate only its exact unmarked Node and must preserve its handoff marker
    - expression: >-
        variables.managerLegacyHandoff ||
        (request.userInfo.username.matches(
          '^system:serviceaccount:[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?:cisco-vk-legacy-[a-z0-9]([-a-z0-9.]{0,61}[a-z0-9])?-[a-f0-9]{8}$') ?
        ((oldObject == null || !has(oldObject.metadata.annotations) ||
          !('topology.cisco.vk/managed' in oldObject.metadata.annotations) ||
          oldObject.metadata.annotations['topology.cisco.vk/managed'] != 'true') &&
         (object == null || !has(object.metadata.annotations) ||
          !('topology.cisco.vk/managed' in object.metadata.annotations) ||
          object.metadata.annotations['topology.cisco.vk/managed'] != 'true')) :
        (request.operation == 'DELETE' ?
        (oldObject != null && has(oldObject.metadata.annotations) &&
        'topology.cisco.vk/managed' in oldObject.metadata.annotations &&
        oldObject.metadata.annotations['topology.cisco.vk/managed'] == 'true') :
        (object != null && has(object.metadata.annotations) &&
        'topology.cisco.vk/managed' in object.metadata.annotations &&
        object.metadata.annotations['topology.cisco.vk/managed'] == 'true' &&
        'topology.cisco.vk/device-namespace' in object.metadata.annotations &&
        object.metadata.annotations['topology.cisco.vk/device-namespace'] != '' &&
        'topology.cisco.vk/device-name' in object.metadata.annotations &&
        object.metadata.annotations['topology.cisco.vk/device-name'] != '' &&
        'topology.cisco.vk/device-uid' in object.metadata.annotations &&
        object.metadata.annotations['topology.cisco.vk/device-uid'] != '' &&
        'topology.cisco.vk/worker-username' in object.metadata.annotations &&
        object.metadata.annotations['topology.cisco.vk/worker-username'].matches(
          '^system:serviceaccount:' + object.metadata.annotations['topology.cisco.vk/device-namespace'] +
          ':cisco-vk-managed-[a-z0-9]([-a-z0-9.]{0,61}[a-z0-9])?-[0-9a-f]{8}$') &&
        object.metadata.annotations['topology.cisco.vk/worker-username'].startsWith(
          'system:serviceaccount:' + object.metadata.annotations['topology.cisco.vk/device-namespace'] +
          ':cisco-vk-managed-' + object.metadata.name + '-') &&
        object.metadata.annotations['topology.cisco.vk/worker-username'].size() ==
          ('system:serviceaccount:' + object.metadata.annotations['topology.cisco.vk/device-namespace'] +
           ':cisco-vk-managed-' + object.metadata.name + '-').size() + 8 &&
        'topology.cisco.vk/worker-protocol' in object.metadata.annotations &&
        object.metadata.annotations['topology.cisco.vk/worker-protocol'] == 'rollout-v1' &&
        (request.operation == 'CREATE' ?
          !('topology.cisco.vk/node-uid' in object.metadata.annotations) :
          ('topology.cisco.vk/node-uid' in object.metadata.annotations &&
           object.metadata.annotations['topology.cisco.vk/node-uid'] == object.metadata.uid)))))
      message: managed Node bindings must be complete, or the manager must perform the exact UID-bound legacy handoff
    - expression: >-
        request.operation != 'UPDATE' ||
        variables.managerLegacyHandoff ||
        !has(oldObject.metadata.annotations) ||
        !('topology.cisco.vk/node-uid' in oldObject.metadata.annotations) ||
        (object.metadata.annotations['topology.cisco.vk/device-namespace'] == oldObject.metadata.annotations['topology.cisco.vk/device-namespace'] &&
        object.metadata.annotations['topology.cisco.vk/device-name'] == oldObject.metadata.annotations['topology.cisco.vk/device-name'] &&
        object.metadata.annotations['topology.cisco.vk/device-uid'] == oldObject.metadata.annotations['topology.cisco.vk/device-uid'] &&
        object.metadata.annotations['topology.cisco.vk/node-uid'] == oldObject.metadata.annotations['topology.cisco.vk/node-uid'] &&
        object.metadata.annotations['topology.cisco.vk/worker-username'] == oldObject.metadata.annotations['topology.cisco.vk/worker-username'] &&
        object.metadata.annotations['topology.cisco.vk/worker-protocol'] == oldObject.metadata.annotations['topology.cisco.vk/worker-protocol'])
      message: an established managed Node identity and worker binding are immutable outside the exact manager legacy handoff
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-managed-node
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-managed-node
  validationActions: [Deny]
  matchResources: {}
---
# A topology-generated managed or legacy worker may update Pod status only when
# its UID-derived ServiceAccount embeds the Pod's bound virtual Node. Kubernetes
# RBAC cannot express this dynamic object relationship; the native policy
# closes that cluster-wide status grant while leaving Pod spec and all metadata
# immutable.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-managed-pod-status
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/status"]
        scope: Namespaced
  matchConditions:
    - name: generated-worker
      expression: >-
        request.userInfo.username.matches(
          '^system:serviceaccount:[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?:cisco-vk-managed-[a-z0-9]([-a-z0-9.]{0,61}[a-z0-9])?-[0-9a-f]{8}$') ||
        request.userInfo.username.matches(
          '^system:serviceaccount:[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?:cisco-vk-legacy-[a-z0-9]([-a-z0-9.]{0,61}[a-z0-9])?-[0-9a-f]{8}$')
  variables:
    - name: usernameParts
      expression: request.userInfo.username.split(':')
    - name: workerServiceAccount
      expression: >-
        variables.usernameParts.size() == 4 ? variables.usernameParts[3] : ''
  validations:
    - expression: >-
        oldObject != null && object != null && has(oldObject.spec.nodeName) &&
        oldObject.spec.nodeName != '' && object.spec.nodeName == oldObject.spec.nodeName
      message: a managed worker may update status only for a Pod already bound to one immutable virtual Node
    - expression: >-
        variables.usernameParts.size() == 4 &&
        ((variables.workerServiceAccount.startsWith('cisco-vk-managed-' + oldObject.spec.nodeName + '-') &&
          variables.workerServiceAccount.size() == ('cisco-vk-managed-' + oldObject.spec.nodeName + '-').size() + 8) ||
         (variables.workerServiceAccount.startsWith('cisco-vk-legacy-' + oldObject.spec.nodeName + '-') &&
          variables.workerServiceAccount.size() == ('cisco-vk-legacy-' + oldObject.spec.nodeName + '-').size() + 8))
      message: the generated worker identity must encode the Pod's exact bound virtual Node
    - expression: >-
        object.metadata.name == oldObject.metadata.name &&
        object.metadata.namespace == oldObject.metadata.namespace &&
        object.metadata.uid == oldObject.metadata.uid &&
        has(object.metadata.labels) == has(oldObject.metadata.labels) &&
        (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels) &&
        has(object.metadata.annotations) == has(oldObject.metadata.annotations) &&
        (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations) &&
        has(object.metadata.finalizers) == has(oldObject.metadata.finalizers) &&
        (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers) &&
        has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences) &&
        object.spec == oldObject.spec
      message: a managed worker Pod status update may not change Pod metadata or spec
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-managed-pod-status
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-managed-pod-status
  validationActions: [Deny]
  matchResources: {}
---
# Reserved source labels control scheduler placement, rollout risk domains, and
# artifact distribution locality. Their deltas require a separately authorized
# custom `topology` verb.
# Before binding, legacy status behavior is unchanged. Once Node identity is
# present, the manager owns all status so no worker can spoof rollout health.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-managed-device
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: ["cisco.vk"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["ciscodevices", "ciscodevices/status"]
        scope: Namespaced
  variables:
    - name: manager
      expression: request.userInfo.username == {{ $manager | quote }}
    - name: newProtectedLabels
      expression: >-
        object != null && has(object.metadata.labels) ?
        object.metadata.labels.transformMap(k, v,
          k == 'topology.kubernetes.io/region' ||
          k == 'topology.kubernetes.io/zone' ||
          k.startsWith('topology.cisco.vk/') ||
          k.startsWith('operations.cisco.vk/') ||
          k.startsWith('distribution.cisco.vk/'), v) : {}
    - name: oldProtectedLabels
      expression: >-
        oldObject != null && has(oldObject.metadata.labels) ?
        oldObject.metadata.labels.transformMap(k, v,
          k == 'topology.kubernetes.io/region' ||
          k == 'topology.kubernetes.io/zone' ||
          k.startsWith('topology.cisco.vk/') ||
          k.startsWith('operations.cisco.vk/') ||
          k.startsWith('distribution.cisco.vk/'), v) : {}
    - name: newProtectedAnnotations
      expression: >-
        object != null && has(object.metadata.annotations) ?
        object.metadata.annotations.transformMap(k, v,
          k == 'topology.cisco.vk/adopt-node-uid' ||
          k == 'topology.cisco.vk/approve-reclassification-from' ||
          k == 'topology.cisco.vk/request-legacy-handoff', v) : {}
    - name: oldProtectedAnnotations
      expression: >-
        oldObject != null && has(oldObject.metadata.annotations) ?
        oldObject.metadata.annotations.transformMap(k, v,
          k == 'topology.cisco.vk/adopt-node-uid' ||
          k == 'topology.cisco.vk/approve-reclassification-from' ||
          k == 'topology.cisco.vk/request-legacy-handoff', v) : {}
  validations:
    - expression: >-
        request.operation == 'DELETE' ||
        (has(request.subResource) && request.subResource == 'status') ||
        ((oldObject == null || !has(oldObject.status) ||
          !has(oldObject.status.topologyLock) ||
          (variables.newProtectedLabels == variables.oldProtectedLabels &&
           variables.newProtectedAnnotations == variables.oldProtectedAnnotations)) &&
         ((variables.newProtectedLabels == variables.oldProtectedLabels &&
           variables.newProtectedAnnotations == variables.oldProtectedAnnotations) ||
          authorizer.group('cisco.vk').resource('ciscodevices').namespace(request.namespace).name(request.name).check('topology').allowed()))
      message: CiscoDevice topology/risk labels and adoption/reclassification/handoff annotations are frozen by an active topology lock; otherwise changes require the custom topology permission
    - expression: >-
        request.operation == 'DELETE' ||
        (has(request.subResource) && request.subResource == 'status') ||
        !has(object.metadata.annotations) ||
        !('topology.cisco.vk/request-legacy-handoff' in object.metadata.annotations) ||
        (oldObject != null && has(oldObject.metadata.annotations) &&
         'topology.cisco.vk/request-legacy-handoff' in oldObject.metadata.annotations &&
         object.metadata.annotations['topology.cisco.vk/request-legacy-handoff'] ==
           oldObject.metadata.annotations['topology.cisco.vk/request-legacy-handoff']) ||
        (request.operation == 'UPDATE' && oldObject != null &&
         has(oldObject.status) && has(oldObject.status.nodeIdentity) &&
         object.metadata.annotations['topology.cisco.vk/request-legacy-handoff'].size() > 0 &&
         object.metadata.annotations['topology.cisco.vk/request-legacy-handoff'].size() <= 128 &&
         object.metadata.annotations['topology.cisco.vk/request-legacy-handoff'] ==
           oldObject.status.nodeIdentity.nodeUID)
      message: legacy handoff requests must bind the current managed Node UID
    - expression: >-
        request.operation == 'DELETE' ||
        (has(request.subResource) && request.subResource == 'status') ||
        oldObject == null || !has(oldObject.status) ||
        !has(oldObject.status.legacyHandoff) ||
        oldObject.status.legacyHandoff.phase == 'Complete' ||
        (((has(object.metadata.annotations) &&
           'topology.cisco.vk/request-legacy-handoff' in object.metadata.annotations) ==
          (has(oldObject.metadata.annotations) &&
           'topology.cisco.vk/request-legacy-handoff' in oldObject.metadata.annotations)) &&
         (!has(object.metadata.annotations) ||
          !('topology.cisco.vk/request-legacy-handoff' in object.metadata.annotations) ||
          object.metadata.annotations['topology.cisco.vk/request-legacy-handoff'] ==
            oldObject.metadata.annotations['topology.cisco.vk/request-legacy-handoff']))
      message: an accepted legacy handoff request is immutable until the handoff is Complete
    - expression: >-
        request.operation == 'DELETE' ||
        (has(request.subResource) && request.subResource == 'status') ||
        (request.operation == 'CREATE' ?
          (!has(object.metadata.annotations) ||
           !('topology.cisco.vk/isolated-legacy-worker' in object.metadata.annotations)) :
          ((!has(oldObject.metadata.annotations) ||
            !('topology.cisco.vk/isolated-legacy-worker' in oldObject.metadata.annotations)) ?
            (!has(object.metadata.annotations) ||
             !('topology.cisco.vk/isolated-legacy-worker' in object.metadata.annotations) ||
             (variables.manager &&
              (!has(oldObject.status) || !has(oldObject.status.topologyLock)) &&
              object.metadata.annotations['topology.cisco.vk/isolated-legacy-worker'] ==
                object.metadata.uid)) :
            (has(object.metadata.annotations) &&
             'topology.cisco.vk/isolated-legacy-worker' in object.metadata.annotations &&
             oldObject.metadata.annotations['topology.cisco.vk/isolated-legacy-worker'] ==
               oldObject.metadata.uid &&
             object.metadata.annotations['topology.cisco.vk/isolated-legacy-worker'] ==
               oldObject.metadata.annotations['topology.cisco.vk/isolated-legacy-worker'])))
      message: the UID-bound isolated legacy worker marker is manager-created and immutable
    - expression: >-
        request.operation != 'UPDATE' || oldObject == null ||
        !has(oldObject.status) || !has(oldObject.status.topologyLock) ||
        object.spec == oldObject.spec
      message: CiscoDevice spec is immutable while a topology lock is active or releasing
    - expression: >-
        request.operation == 'DELETE' ||
        (has(request.subResource) && request.subResource == 'status') ||
        !has(object.metadata.labels) ||
        !('topology.cisco.vk/managed' in object.metadata.labels) ||
        object.metadata.labels['topology.cisco.vk/managed'] != 'true' ||
        (has(object.spec.maxPods) && object.spec.maxPods >= 1 &&
         object.spec.maxPods <= 110)
      message: a selected managed CiscoDevice requires spec.maxPods from 1 through 110
    - expression: >-
        request.operation != 'DELETE' ||
        (oldObject != null &&
         (!has(oldObject.status) || !has(oldObject.status.topologyLock)) &&
         (!has(oldObject.status) || !has(oldObject.status.legacyHandoff) ||
          oldObject.status.legacyHandoff.phase == 'Complete') &&
         (!has(oldObject.status) || !has(oldObject.status.maintenanceSession) ||
          (has(oldObject.status.maintenanceSession.phase) &&
           oldObject.status.maintenanceSession.phase == 'Settled')))
      message: CiscoDevice deletion requires no topology lock, no in-progress legacy handoff, and no unsettled maintenance session
    - expression: >-
        (has(request.subResource) && request.subResource != '') || request.operation != 'UPDATE' ||
        !has(oldObject.status) || !has(oldObject.status.nodeIdentity) ||
        ((has(object.spec.labels) == has(oldObject.spec.labels)) &&
         (!has(object.spec.labels) || object.spec.labels == oldObject.spec.labels) &&
         (has(object.spec.taints) == has(oldObject.spec.taints)) &&
         (!has(object.spec.taints) || object.spec.taints == oldObject.spec.taints) &&
         (has(object.spec.region) == has(oldObject.spec.region)) &&
         (!has(object.spec.region) || object.spec.region == oldObject.spec.region) &&
         (has(object.spec.zone) == has(oldObject.spec.zone)) &&
         (!has(object.spec.zone) || object.spec.zone == oldObject.spec.zone)) ||
        authorizer.group('cisco.vk').resource('ciscodevices').namespace(request.namespace).name(request.name).check('topology').allowed()
      message: changing the projection labels, taints, region, or zone of an established managed device requires the custom topology permission
    - expression: >-
        !has(request.subResource) || request.subResource != 'status' ||
        variables.manager ||
        (((has(object.status) && has(object.status.nodeIdentity)) ==
          (has(oldObject.status) && has(oldObject.status.nodeIdentity))) &&
         (!has(object.status) || !has(object.status.nodeIdentity) ||
          object.status.nodeIdentity == oldObject.status.nodeIdentity) &&
         ((has(object.status) && has(object.status.topologyProjection)) ==
          (has(oldObject.status) && has(oldObject.status.topologyProjection))) &&
         (!has(object.status) || !has(object.status.topologyProjection) ||
          object.status.topologyProjection == oldObject.status.topologyProjection) &&
         ((has(object.status) && has(object.status.healthObservation)) ==
          (has(oldObject.status) && has(oldObject.status.healthObservation))) &&
         (!has(object.status) || !has(object.status.healthObservation) ||
          object.status.healthObservation == oldObject.status.healthObservation) &&
         ((has(object.status) && has(object.status.workerRevision)) ==
          (has(oldObject.status) && has(oldObject.status.workerRevision))) &&
         (!has(object.status) || !has(object.status.workerRevision) ||
          object.status.workerRevision == oldObject.status.workerRevision) &&
         ((has(object.status) && has(object.status.legacyHandoff)) ==
          (has(oldObject.status) && has(oldObject.status.legacyHandoff))) &&
         (!has(object.status) || !has(object.status.legacyHandoff) ||
          object.status.legacyHandoff == oldObject.status.legacyHandoff) &&
         ((has(object.status) && has(object.status.topologyLock)) ==
          (has(oldObject.status) && has(oldObject.status.topologyLock))) &&
         (!has(object.status) || !has(object.status.topologyLock) ||
          object.status.topologyLock == oldObject.status.topologyLock) &&
         ((has(object.status) && has(object.status.maintenanceSession)) ==
          (has(oldObject.status) && has(oldObject.status.maintenanceSession))) &&
         (!has(object.status) || !has(object.status.maintenanceSession) ||
          object.status.maintenanceSession == oldObject.status.maintenanceSession))
      message: manager-owned CiscoDevice identity, topology, health, worker revision, handoff, lock, and maintenance status cannot be forged
    - expression: >-
        !has(request.subResource) || request.subResource != 'status' ||
        ((!has(oldObject.status) ||
          (!has(oldObject.status.nodeIdentity) && !has(oldObject.status.legacyHandoff))) &&
         (!has(object.status) ||
          (!has(object.status.nodeIdentity) && !has(object.status.legacyHandoff)))) ||
        variables.manager
      message: all CiscoDevice status is manager-owned once managed Node identity or legacy handoff state exists
    - expression: >-
        (has(request.subResource) && request.subResource != '') || variables.manager ||
        request.operation != 'UPDATE' || !has(oldObject.status) ||
        (!has(oldObject.status.nodeIdentity) && !has(oldObject.status.legacyHandoff)) ||
        (object.metadata.name == oldObject.metadata.name &&
        object.metadata.namespace == oldObject.metadata.namespace &&
        object.metadata.uid == oldObject.metadata.uid &&
        has(object.metadata.finalizers) == has(oldObject.metadata.finalizers) &&
        (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers) &&
        has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences))
      message: CiscoDevice finalizers and owner references are manager-owned after managed Node identity or legacy handoff state is established
