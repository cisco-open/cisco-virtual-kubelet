apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-shared-network-result
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-shared-network-result
  validationActions: [Deny]
  matchResources: {}
---
# Heartbeat Leases belong to app hosting, config-family Leases belong to
# network management, and either exact plane may serialize its device write on
# the shared device-mutation Lease. The existing Lease policy constrains the
# permitted state transition; this policy authenticates its Pod incarnation.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-shared-maintenance-lease
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: ["coordination.k8s.io"]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["leases"]
        scope: Namespaced
  matchConditions:
    - name: shared-functional-worker
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:') &&
        (request.userInfo.username.endsWith(':{{ $appServiceAccount }}') ||
         request.userInfo.username.endsWith(':{{ $networkServiceAccount }}'))
  variables:
    - name: podUIDs
      expression: >-
        'authentication.kubernetes.io/pod-uid' in request.userInfo.extra ?
          request.userInfo.extra['authentication.kubernetes.io/pod-uid'] : []
    - name: podNames
      expression: >-
        'authentication.kubernetes.io/pod-name' in request.userInfo.extra ?
          request.userInfo.extra['authentication.kubernetes.io/pod-name'] : []
    - name: appWorker
      expression: >-
        oldObject != null && has(oldObject.metadata.annotations) &&
        'topology.cisco.vk/app-worker-username' in oldObject.metadata.annotations &&
        oldObject.metadata.annotations['topology.cisco.vk/app-worker-username'] == request.userInfo.username
    - name: networkWorker
      expression: >-
        oldObject != null && has(oldObject.metadata.annotations) &&
        'topology.cisco.vk/network-worker-username' in oldObject.metadata.annotations &&
        oldObject.metadata.annotations['topology.cisco.vk/network-worker-username'] == request.userInfo.username
  validations:
    - expression: >-
        oldObject != null && object != null && has(oldObject.metadata.annotations) &&
        oldObject.metadata.annotations['topology.cisco.vk/managed'] == 'true' &&
        'topology.cisco.vk/lease-purpose' in oldObject.metadata.annotations &&
        ((oldObject.metadata.annotations['topology.cisco.vk/lease-purpose'] == 'node-heartbeat' && variables.appWorker) ||
         (oldObject.metadata.annotations['topology.cisco.vk/lease-purpose'] == 'config-family' && variables.networkWorker) ||
         (oldObject.metadata.annotations['topology.cisco.vk/lease-purpose'] == 'device-mutation' &&
          (variables.appWorker || variables.networkWorker)))
      message: the shared worker plane is not authorized for this managed Lease purpose
    - expression: >-
        variables.podUIDs.size() == 1 && variables.podNames.size() == 1 &&
        (variables.appWorker ?
          (['topology.cisco.vk/app-worker-pod-name',
            'topology.cisco.vk/app-worker-pod-uid'].all(k,
              k in oldObject.metadata.annotations && oldObject.metadata.annotations[k] != '') &&
           variables.podUIDs[0] == oldObject.metadata.annotations['topology.cisco.vk/app-worker-pod-uid'] &&
           variables.podNames[0] == oldObject.metadata.annotations['topology.cisco.vk/app-worker-pod-name']) :
          (variables.networkWorker &&
           ['topology.cisco.vk/network-worker-pod-name',
            'topology.cisco.vk/network-worker-pod-uid'].all(k,
              k in oldObject.metadata.annotations && oldObject.metadata.annotations[k] != '') &&
           variables.podUIDs[0] == oldObject.metadata.annotations['topology.cisco.vk/network-worker-pod-uid'] &&
           variables.podNames[0] == oldObject.metadata.annotations['topology.cisco.vk/network-worker-pod-name']))
      message: managed Lease mutation requires the exact manager-bound worker Pod name and UID
