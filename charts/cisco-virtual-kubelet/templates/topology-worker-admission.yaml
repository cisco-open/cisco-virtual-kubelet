# A caller with serviceaccounts/token can otherwise request a token bound to a
# legitimate worker Pod and inherit the exact pod-name/pod-uid claims used by
# the functional-object admission boundary. Only a kubelet may obtain the
# short-lived, Pod-bound projected token mounted into a worker container.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-shared-worker-token
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
