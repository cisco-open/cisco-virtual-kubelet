      expression: >-
        has(request.name) &&
        (request.name in
           [{{ $appServiceAccount | quote }}, {{ $networkServiceAccount | quote }}] ||
         request.name.matches({{ $generatedWorkerServiceAccountPattern | quote }}))
  validations:
    - expression: >-
        request.userInfo.username.matches('^system:node:.+$') &&
        request.userInfo.groups.exists(g, g == 'system:authenticated') &&
        request.userInfo.groups.exists(g, g == 'system:nodes') &&
