  matchConditions:
    - name: reserved-worker-token-secret
      expression: >-
        (object != null && object.type == 'kubernetes.io/service-account-token' &&
         has(object.metadata.annotations) &&
         'kubernetes.io/service-account.name' in object.metadata.annotations &&
         (object.metadata.annotations['kubernetes.io/service-account.name'] in
            [{{ $appServiceAccount | quote }}, {{ $networkServiceAccount | quote }}] ||
          object.metadata.annotations['kubernetes.io/service-account.name'].matches(
            {{ $generatedWorkerServiceAccountPattern | quote }}))) ||
        (oldObject != null && oldObject.type == 'kubernetes.io/service-account-token' &&
         has(oldObject.metadata.annotations) &&
         'kubernetes.io/service-account.name' in oldObject.metadata.annotations &&
         (oldObject.metadata.annotations['kubernetes.io/service-account.name'] in
            [{{ $appServiceAccount | quote }}, {{ $networkServiceAccount | quote }}] ||
          oldObject.metadata.annotations['kubernetes.io/service-account.name'].matches(
            {{ $generatedWorkerServiceAccountPattern | quote }})))
