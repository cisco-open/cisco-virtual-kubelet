---
# Reserve the two shared ServiceAccount objects themselves. Kubernetes RBAC
# subjects are name based, so allowing a namespace principal to delete and
# recreate one would preserve its grants under an attacker-controlled identity
# incarnation while the RoleBinding or ClusterRoleBinding still exists. The
# generated-name boundary is deliberately a separate policy below so its
# server-issued policy UID can participate in the shared-account upgrade epoch.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-shared-worker-serviceaccount
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["serviceaccounts"]
        scope: Namespaced
  matchConditions:
    - name: reserved-worker-account
      expression: >-
        (object != null && object.metadata.name in
           [{{ $appServiceAccount | quote }}, {{ $networkServiceAccount | quote }}]) ||
        (oldObject != null && oldObject.metadata.name in
           [{{ $appServiceAccount | quote }}, {{ $networkServiceAccount | quote }}]) ||
        (has(request.name) && request.name in
           [{{ $appServiceAccount | quote }}, {{ $networkServiceAccount | quote }}])
  validations:
    - expression: >-
        request.userInfo.username == {{ $manager | quote }} ||
        (request.operation == 'DELETE' && !has(request.name) &&
         request.userInfo.groups.exists(g, g == 'system:authenticated') &&
         ((request.userInfo.username ==
             'system:serviceaccount:kube-system:namespace-controller' &&
           request.userInfo.groups.exists(g, g == 'system:serviceaccounts') &&
           request.userInfo.groups.exists(g, g == 'system:serviceaccounts:kube-system')) ||
          request.userInfo.username == 'system:kube-controller-manager'))
      message: only the topology manager may create, update, or delete a reserved worker ServiceAccount
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-shared-worker-serviceaccount
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-shared-worker-serviceaccount
  validationActions: [Deny]
  matchResources: {}
---
# Reserve UID-derived phase-zero and managed ServiceAccounts under a distinct
# policy identity. On CREATE/UPDATE, the manager must also supply the complete
# CiscoDevice incarnation envelope; name reservation alone is not ownership.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-generated-worker-serviceaccount
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["serviceaccounts"]
        scope: Namespaced
  matchConditions:
    - name: generated-worker-account
      expression: >-
        (object != null &&
         object.metadata.name.matches({{ $generatedWorkerServiceAccountPattern | quote }})) ||
        (oldObject != null &&
         oldObject.metadata.name.matches({{ $generatedWorkerServiceAccountPattern | quote }})) ||
        (has(request.name) &&
         request.name.matches({{ $generatedWorkerServiceAccountPattern | quote }}))
  validations:
    - expression: >-
        request.userInfo.username == {{ $manager | quote }} ||
        (request.operation == 'DELETE' && !has(request.name) &&
         request.userInfo.groups.exists(g, g == 'system:authenticated') &&
         ((request.userInfo.username ==
             'system:serviceaccount:kube-system:namespace-controller' &&
           request.userInfo.groups.exists(g, g == 'system:serviceaccounts') &&
           request.userInfo.groups.exists(g, g == 'system:serviceaccounts:kube-system')) ||
          request.userInfo.username == 'system:kube-controller-manager'))
      message: only the topology manager may create, update, or delete a reserved worker ServiceAccount
    - expression: >-
        request.operation == 'DELETE' ||
        (object != null && has(object.metadata.annotations) &&
         object.metadata.annotations['topology.cisco.vk/device-namespace'] == request.namespace &&
         object.metadata.annotations['topology.cisco.vk/device-name'] != '' &&
         object.metadata.annotations['topology.cisco.vk/device-uid'] != '' &&
         object.metadata.annotations['topology.cisco.vk/node-name'] != '' &&
         object.metadata.annotations['topology.cisco.vk/worker-protocol'] == 'rollout-v1' &&
         ((request.name.startsWith('cisco-vk-managed-') &&
           object.metadata.annotations['topology.cisco.vk/managed'] == 'true' &&
           !('topology.cisco.vk/worker-mode' in object.metadata.annotations)) ||
          (request.name.startsWith('cisco-vk-legacy-') &&
           object.metadata.annotations['topology.cisco.vk/worker-mode'] == 'legacy' &&
           !('topology.cisco.vk/managed' in object.metadata.annotations))) &&
         has(object.metadata.ownerReferences) && object.metadata.ownerReferences.size() == 1 &&
         object.metadata.ownerReferences[0].apiVersion == 'cisco.vk/v1alpha1' &&
         object.metadata.ownerReferences[0].kind == 'CiscoDevice' &&
         object.metadata.ownerReferences[0].name ==
           object.metadata.annotations['topology.cisco.vk/device-name'] &&
         string(object.metadata.ownerReferences[0].uid) ==
           object.metadata.annotations['topology.cisco.vk/device-uid'] &&
         has(object.metadata.ownerReferences[0].controller) &&
         object.metadata.ownerReferences[0].controller &&
         has(object.metadata.ownerReferences[0].blockOwnerDeletion) &&
         object.metadata.ownerReferences[0].blockOwnerDeletion)
      message: a generated worker ServiceAccount must carry its exact CiscoDevice owner and identity envelope
