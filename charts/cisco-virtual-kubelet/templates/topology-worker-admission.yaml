{{- if .Values.topology.enabled }}
{{- include "cisco-virtual-kubelet.validateManagedTopology" . }}
{{- $fullname := include "cisco-virtual-kubelet.fullname" . }}
{{- $manager := include "cisco-virtual-kubelet.managerUsername" . }}
{{- $appServiceAccount := include "cisco-virtual-kubelet.appHostingServiceAccountName" . }}
{{- $networkServiceAccount := include "cisco-virtual-kubelet.networkManagementServiceAccountName" . }}
{{- $generatedWorkerServiceAccountPattern := "^cisco-vk-(managed|legacy)-[a-z0-9]([-a-z0-9.]{0,61}[a-z0-9])?-[a-f0-9]{8}$" }}
---
# A shared ServiceAccount username is not a device identity. Bind every
# workload status write to the authenticated worker Pod incarnation carried by
# the API server in the bound-token user-info extras and stamped by the manager
# on the target Pod. An unbound/manual token has no such claims and is denied.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-shared-pod-status
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/status"]
        scope: Namespaced
  matchConditions:
    - name: shared-app-worker
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:') &&
        request.userInfo.username.endsWith(':{{ $appServiceAccount }}')
  variables:
    - name: podUIDs
      expression: >-
        'authentication.kubernetes.io/pod-uid' in request.userInfo.extra ?
          request.userInfo.extra['authentication.kubernetes.io/pod-uid'] : []
    - name: podNames
      expression: >-
        'authentication.kubernetes.io/pod-name' in request.userInfo.extra ?
          request.userInfo.extra['authentication.kubernetes.io/pod-name'] : []
  validations:
    - expression: >-
        oldObject != null && object != null && has(oldObject.spec.nodeName) &&
        oldObject.spec.nodeName != '' && object.spec.nodeName == oldObject.spec.nodeName &&
        has(oldObject.metadata.annotations) &&
        ['topology.cisco.vk/app-worker-username',
         'topology.cisco.vk/app-worker-pod-name',
         'topology.cisco.vk/app-worker-pod-uid'].all(k,
           k in oldObject.metadata.annotations && oldObject.metadata.annotations[k] != '') &&
        oldObject.metadata.annotations['topology.cisco.vk/app-worker-username'] == request.userInfo.username &&
        variables.podUIDs.size() == 1 && variables.podNames.size() == 1 &&
        variables.podUIDs[0] == oldObject.metadata.annotations['topology.cisco.vk/app-worker-pod-uid'] &&
        variables.podNames[0] == oldObject.metadata.annotations['topology.cisco.vk/app-worker-pod-name']
      message: shared app-hosting status requires the exact manager-bound worker Pod name and UID
    - expression: >-
        object.metadata.name == oldObject.metadata.name &&
        object.metadata.namespace == oldObject.metadata.namespace &&
        object.metadata.uid == oldObject.metadata.uid &&
        has(object.metadata.labels) == has(oldObject.metadata.labels) &&
        (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels) &&
        has(object.metadata.annotations) == has(oldObject.metadata.annotations) &&
        (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations) &&
        has(object.metadata.finalizers) == has(oldObject.metadata.finalizers) &&
        (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers) &&
        has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences) &&
        object.spec == oldObject.spec
      message: a shared app-hosting worker Pod status update may not change Pod metadata or spec
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-shared-pod-status
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-shared-pod-status
  validationActions: [Deny]
  matchResources: {}
---
# Reserve workload-binding annotations to the manager. This makes the bound
# worker Pod UID an authorization fact instead of tenant-controlled metadata.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-shared-pod-binding
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/status"]
        scope: Namespaced
  matchConditions:
    - name: shared-binding
      expression: >-
        (object != null && has(object.metadata.annotations) &&
         ['topology.cisco.vk/app-worker-username',
          'topology.cisco.vk/app-worker-pod-name',
          'topology.cisco.vk/app-worker-pod-uid'].exists(k, k in object.metadata.annotations)) ||
        (oldObject != null && has(oldObject.metadata.annotations) &&
         ['topology.cisco.vk/app-worker-username',
          'topology.cisco.vk/app-worker-pod-name',
          'topology.cisco.vk/app-worker-pod-uid'].exists(k, k in oldObject.metadata.annotations))
  variables:
    - name: manager
      expression: request.userInfo.username == {{ $manager | quote }}
    - name: oldBindings
      expression: >-
        oldObject != null && has(oldObject.metadata.annotations) ?
          oldObject.metadata.annotations.transformMap(k, v,
            k in ['topology.cisco.vk/app-worker-username',
                  'topology.cisco.vk/app-worker-pod-name',
                  'topology.cisco.vk/app-worker-pod-uid'], v) : {}
    - name: newBindings
      expression: >-
        object != null && has(object.metadata.annotations) ?
          object.metadata.annotations.transformMap(k, v,
            k in ['topology.cisco.vk/app-worker-username',
                  'topology.cisco.vk/app-worker-pod-name',
                  'topology.cisco.vk/app-worker-pod-uid'], v) : {}
  validations:
    - expression: >-
        variables.manager || variables.newBindings == variables.oldBindings
      message: only the topology manager may add, rotate, or remove a workload worker binding
    - expression: >-
        variables.newBindings.size() == 0 ||
        (variables.newBindings.size() == 3 &&
         variables.newBindings['topology.cisco.vk/app-worker-username'].startsWith('system:serviceaccount:') &&
         variables.newBindings['topology.cisco.vk/app-worker-username'].endsWith(':{{ $appServiceAccount }}') &&
         variables.newBindings['topology.cisco.vk/app-worker-pod-name'].matches(
           '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$') &&
         variables.newBindings['topology.cisco.vk/app-worker-pod-uid'].matches(
           '^[A-Za-z0-9]([A-Za-z0-9._-]{0,126}[A-Za-z0-9])?$'))
      message: a workload worker binding must be absent or contain one complete shared app-worker identity
    - expression: >-
        !variables.manager || request.operation != 'UPDATE' ||
        (object.metadata.name == oldObject.metadata.name &&
         object.metadata.namespace == oldObject.metadata.namespace &&
         object.metadata.uid == oldObject.metadata.uid &&
         has(object.metadata.labels) == has(oldObject.metadata.labels) &&
         (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels) &&
         (has(object.metadata.finalizers) ? object.metadata.finalizers.filter(f,
            f != 'ops.cisco.vk/iosxe-rollout-drain') : []) ==
         (has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers.filter(f,
            f != 'ops.cisco.vk/iosxe-rollout-drain') : []) &&
         has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) &&
         (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences) &&
         object.spec == oldObject.spec && object.status == oldObject.status &&
         (has(object.metadata.annotations) ? object.metadata.annotations.transformMap(k, v,
            !(k in ['ops.cisco.vk/drain-session', 'topology.cisco.vk/worker-username',
                    'topology.cisco.vk/app-worker-username',
                    'topology.cisco.vk/app-worker-pod-name',
                    'topology.cisco.vk/app-worker-pod-uid']), v) : {}) ==
         (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations.transformMap(k, v,
            !(k in ['ops.cisco.vk/drain-session', 'topology.cisco.vk/worker-username',
                    'topology.cisco.vk/app-worker-username',
                    'topology.cisco.vk/app-worker-pod-name',
                    'topology.cisco.vk/app-worker-pod-uid']), v) : {}))
      message: the topology manager may change only exact workload worker bindings and drain protection
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-shared-pod-binding
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-shared-pod-binding
  validationActions: [Deny]
  matchResources: {}
---
# Virtual Kubelet may complete only an already-initiated, UID-preconditioned,
# zero-grace deletion for a workload bound to its exact Pod incarnation.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-shared-pod-delete
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["pods"]
        scope: Namespaced
  matchConditions:
    - name: shared-app-worker
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:') &&
        request.userInfo.username.endsWith(':{{ $appServiceAccount }}')
  variables:
    - name: podUIDs
      expression: >-
        'authentication.kubernetes.io/pod-uid' in request.userInfo.extra ?
          request.userInfo.extra['authentication.kubernetes.io/pod-uid'] : []
    - name: podNames
      expression: >-
        'authentication.kubernetes.io/pod-name' in request.userInfo.extra ?
          request.userInfo.extra['authentication.kubernetes.io/pod-name'] : []
  validations:
    - expression: >-
        oldObject != null && request.options != null &&
        has(request.options.preconditions) && has(request.options.preconditions.uid) &&
        string(request.options.preconditions.uid) == string(oldObject.metadata.uid) &&
        has(request.options.gracePeriodSeconds) && request.options.gracePeriodSeconds == 0 &&
        has(oldObject.metadata.deletionTimestamp)
      message: shared app-hosting may complete only an already-terminating Pod using its current UID and zero grace
    - expression: >-
        oldObject != null && has(oldObject.spec.nodeName) && oldObject.spec.nodeName != '' &&
        has(oldObject.metadata.annotations) &&
        ['topology.cisco.vk/app-worker-username',
         'topology.cisco.vk/app-worker-pod-name',
         'topology.cisco.vk/app-worker-pod-uid'].all(k,
           k in oldObject.metadata.annotations && oldObject.metadata.annotations[k] != '') &&
        oldObject.metadata.annotations['topology.cisco.vk/app-worker-username'] == request.userInfo.username &&
        variables.podUIDs.size() == 1 && variables.podNames.size() == 1 &&
        variables.podUIDs[0] == oldObject.metadata.annotations['topology.cisco.vk/app-worker-pod-uid'] &&
        variables.podNames[0] == oldObject.metadata.annotations['topology.cisco.vk/app-worker-pod-name']
      message: shared app-hosting deletion requires the exact manager-bound worker Pod name and UID
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-shared-pod-delete
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-shared-pod-delete
  validationActions: [Deny]
  matchResources: {}
---
# The legacy managed-node contract still constrains the shape of a status
# write. This companion policy supplies the device-incarnation proof that a
# reusable ServiceAccount username alone cannot provide.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-shared-node-status
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["nodes/status"]
        scope: Cluster
  matchConditions:
    - name: shared-app-worker
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:') &&
        request.userInfo.username.endsWith(':{{ $appServiceAccount }}')
  variables:
    - name: podUIDs
      expression: >-
        'authentication.kubernetes.io/pod-uid' in request.userInfo.extra ?
          request.userInfo.extra['authentication.kubernetes.io/pod-uid'] : []
    - name: podNames
      expression: >-
        'authentication.kubernetes.io/pod-name' in request.userInfo.extra ?
          request.userInfo.extra['authentication.kubernetes.io/pod-name'] : []
  validations:
    - expression: >-
        oldObject != null && object != null &&
        has(oldObject.metadata.annotations) &&
        oldObject.metadata.annotations['topology.cisco.vk/managed'] == 'true' &&
        ['topology.cisco.vk/app-worker-username',
         'topology.cisco.vk/app-worker-pod-name',
         'topology.cisco.vk/app-worker-pod-uid'].all(k,
           k in oldObject.metadata.annotations && oldObject.metadata.annotations[k] != '') &&
        oldObject.metadata.annotations['topology.cisco.vk/app-worker-username'] == request.userInfo.username &&
        variables.podUIDs.size() == 1 && variables.podNames.size() == 1 &&
        variables.podUIDs[0] == oldObject.metadata.annotations['topology.cisco.vk/app-worker-pod-uid'] &&
        variables.podNames[0] == oldObject.metadata.annotations['topology.cisco.vk/app-worker-pod-name']
      message: shared app-hosting Node status requires the exact manager-bound worker Pod name and UID
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-shared-node-status
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-shared-node-status
  validationActions: [Deny]
  matchResources: {}
---
# Network-management may change only a manager-bound leaf for its exact Pod
# incarnation. The original leaf policy remains responsible for status field
# ownership and cleanup-finalizer shape.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-shared-upgrade-leaf
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: ["ops.cisco.vk"]
        apiVersions: ["v1alpha1"]
        operations: ["UPDATE"]
        resources: ["iosxesoftwareupgrades", "iosxesoftwareupgrades/status"]
        scope: Namespaced
  matchConditions:
    - name: shared-network-worker
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:') &&
        (request.userInfo.username.endsWith(':{{ $networkServiceAccount }}') ||
         request.userInfo.username.endsWith(':{{ $appServiceAccount }}'))
  variables:
    - name: plane
      expression: >-
        request.userInfo.username.endsWith(':{{ $appServiceAccount }}') ? 'app' : 'network'
    - name: podUIDs
      expression: >-
        'authentication.kubernetes.io/pod-uid' in request.userInfo.extra ?
          request.userInfo.extra['authentication.kubernetes.io/pod-uid'] : []
    - name: podNames
      expression: >-
        'authentication.kubernetes.io/pod-name' in request.userInfo.extra ?
          request.userInfo.extra['authentication.kubernetes.io/pod-name'] : []
  validations:
    - expression: >-
        oldObject != null && object != null &&
        has(oldObject.metadata.annotations) &&
        oldObject.metadata.annotations['topology.cisco.vk/managed'] == 'true' &&
        ['username', 'pod-name', 'pod-uid'].all(k,
           ('topology.cisco.vk/' + variables.plane + '-worker-' + k) in oldObject.metadata.annotations &&
           oldObject.metadata.annotations['topology.cisco.vk/' + variables.plane + '-worker-' + k] != '') &&
        oldObject.metadata.annotations['topology.cisco.vk/' + variables.plane + '-worker-username'] == request.userInfo.username &&
        variables.podUIDs.size() == 1 && variables.podNames.size() == 1 &&
        variables.podUIDs[0] == oldObject.metadata.annotations['topology.cisco.vk/' + variables.plane + '-worker-pod-uid'] &&
        variables.podNames[0] == oldObject.metadata.annotations['topology.cisco.vk/' + variables.plane + '-worker-pod-name']
      message: shared functional leaf mutation requires the exact manager-bound worker Pod name and UID
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-shared-upgrade-leaf
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-shared-upgrade-leaf
  validationActions: [Deny]
  matchResources: {}
---
# All network-management CRs share one ServiceAccount per namespace. Protect
# the manager-issued device/Pod envelope, then limit a worker UPDATE to the
# status, finalizer, and diagnostic annotation fields its reconcilers own.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-shared-network-object
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: ["config.cisco.vk", "ops.cisco.vk"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources:
          - iosxeconfigs
          - iosxeconfigs/status
          - nxosconfigs
          - nxosconfigs/status
          - iosxetelemetries
          - iosxetelemetries/status
          - iosxediagnostics
          - iosxediagnostics/status
          - iosxeconfigapplylogs
          - iosxeconfigapplylogs/status
          - iosxeconfigrevisions
          - iosxeconfigrevisions/status
          - deviceoperations
          - deviceoperations/status
          - iosxeoperationalactions
          - iosxeoperationalactions/status
        scope: Namespaced
  matchConditions:
    - name: protected-network-object
      expression: >-
        request.userInfo.username == {{ $manager | quote }} ||
        request.userInfo.username ==
          'system:serviceaccount:' + request.namespace + ':{{ $networkServiceAccount }}' ||
        (object != null && has(object.metadata.annotations) &&
         ['topology.cisco.vk/managed',
          'topology.cisco.vk/device-namespace',
          'topology.cisco.vk/device-name',
          'topology.cisco.vk/device-uid',
          'topology.cisco.vk/network-worker-username',
          'topology.cisco.vk/network-worker-pod-name',
          'topology.cisco.vk/network-worker-pod-uid'].exists(k, k in object.metadata.annotations)) ||
        (oldObject != null && has(oldObject.metadata.annotations) &&
         ['topology.cisco.vk/managed',
          'topology.cisco.vk/device-namespace',
          'topology.cisco.vk/device-name',
          'topology.cisco.vk/device-uid',
          'topology.cisco.vk/network-worker-username',
          'topology.cisco.vk/network-worker-pod-name',
          'topology.cisco.vk/network-worker-pod-uid'].exists(k, k in oldObject.metadata.annotations))
  variables:
    - name: manager
      expression: request.userInfo.username == {{ $manager | quote }}
    - name: sharedWorker
      expression: >-
        request.userInfo.username ==
          'system:serviceaccount:' + request.namespace + ':{{ $networkServiceAccount }}'
    - name: nativeGarbageCollector
      expression: >-
        request.operation == 'DELETE' && oldObject != null &&
        request.options != null && has(request.options.preconditions) &&
        has(request.options.preconditions.uid) &&
        string(request.options.preconditions.uid) == string(oldObject.metadata.uid) &&
        request.userInfo.groups.exists(g, g == 'system:authenticated') &&
        ((request.userInfo.username ==
            'system:serviceaccount:kube-system:generic-garbage-collector' &&
          request.userInfo.groups.exists(g, g == 'system:serviceaccounts') &&
          request.userInfo.groups.exists(g, g == 'system:serviceaccounts:kube-system')) ||
         request.userInfo.username == 'system:kube-controller-manager') &&
        has(oldObject.metadata.ownerReferences) &&
        oldObject.metadata.ownerReferences.size() == 1 &&
        has(oldObject.metadata.ownerReferences[0].controller) &&
        oldObject.metadata.ownerReferences[0].controller &&
        has(oldObject.metadata.ownerReferences[0].blockOwnerDeletion) &&
        oldObject.metadata.ownerReferences[0].blockOwnerDeletion &&
        string(oldObject.metadata.ownerReferences[0].uid) != '' &&
        (((request.resource.group == 'config.cisco.vk' &&
           request.resource.resource == 'iosxeconfigs') &&
          ((oldObject.metadata.ownerReferences[0].apiVersion == 'cisco.vk/v1alpha1' &&
            oldObject.metadata.ownerReferences[0].kind == 'CiscoDevice') ||
           (oldObject.metadata.ownerReferences[0].apiVersion == 'config.cisco.vk/v1alpha1' &&
            oldObject.metadata.ownerReferences[0].kind == 'IOSXEConfigBundle'))) ||
         (request.resource.group == 'config.cisco.vk' &&
          request.resource.resource == 'nxosconfigs' &&
          oldObject.metadata.ownerReferences[0].apiVersion == 'cisco.vk/v1alpha1' &&
          oldObject.metadata.ownerReferences[0].kind == 'CiscoDevice'))
    - name: nativeNamespaceCleanup
      expression: >-
        request.operation == 'DELETE' && !has(request.name) &&
        request.userInfo.groups.exists(g, g == 'system:authenticated') &&
        ((request.userInfo.username ==
            'system:serviceaccount:kube-system:namespace-controller' &&
          request.userInfo.groups.exists(g, g == 'system:serviceaccounts') &&
          request.userInfo.groups.exists(g, g == 'system:serviceaccounts:kube-system')) ||
         request.userInfo.username == 'system:kube-controller-manager')
    - name: podUIDs
      expression: >-
        has(request.userInfo.extra) &&
          'authentication.kubernetes.io/pod-uid' in request.userInfo.extra ?
          request.userInfo.extra['authentication.kubernetes.io/pod-uid'] : []
    - name: podNames
      expression: >-
        has(request.userInfo.extra) &&
          'authentication.kubernetes.io/pod-name' in request.userInfo.extra ?
          request.userInfo.extra['authentication.kubernetes.io/pod-name'] : []
    - name: oldBindings
      expression: >-
        oldObject != null && has(oldObject.metadata.annotations) ?
          oldObject.metadata.annotations.transformMap(k, v,
            k in ['topology.cisco.vk/managed',
                  'topology.cisco.vk/device-namespace',
                  'topology.cisco.vk/device-name',
                  'topology.cisco.vk/device-uid',
                  'topology.cisco.vk/network-worker-username',
                  'topology.cisco.vk/network-worker-pod-name',
                  'topology.cisco.vk/network-worker-pod-uid'], v) : {}
    - name: newBindings
      expression: >-
        object != null && has(object.metadata.annotations) ?
          object.metadata.annotations.transformMap(k, v,
            k in ['topology.cisco.vk/managed',
                  'topology.cisco.vk/device-namespace',
                  'topology.cisco.vk/device-name',
                  'topology.cisco.vk/device-uid',
