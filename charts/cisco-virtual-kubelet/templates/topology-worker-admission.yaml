---
# Worker Pods are replaced through their Deployment; they are never edited in
# place. In particular, a namespace user must not inject an ephemeral
# container into a privileged shared-identity Pod, copy its bound token, or
# forge readiness consumed by the manager. Only the Pod's authenticated node
# may change status while every identity, metadata, and spec field is stable.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-shared-worker-pod-update
  annotations:
    {{- include "cisco-virtual-kubelet.topologyAdmissionResourceAnnotations" . | nindent 4 }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods", "pods/status", "pods/ephemeralcontainers", "pods/resize"]
        scope: Namespaced
  matchConditions:
    - name: reserved-worker-account
      expression: >-
        (object != null && has(object.spec.serviceAccountName) &&
          (object.spec.serviceAccountName in
             [{{ $appServiceAccount | quote }}, {{ $networkServiceAccount | quote }}] ||
           object.spec.serviceAccountName.matches(
             {{ $generatedWorkerServiceAccountPattern | quote }}))) ||
        (oldObject != null && has(oldObject.spec.serviceAccountName) &&
          (oldObject.spec.serviceAccountName in
             [{{ $appServiceAccount | quote }}, {{ $networkServiceAccount | quote }}] ||
           oldObject.spec.serviceAccountName.matches(
             {{ $generatedWorkerServiceAccountPattern | quote }})))
  variables:
    - name: manager
      expression: request.userInfo.username == {{ $manager | quote }}
    - name: nativeKubeletStatus
      expression: >-
        request.subResource == 'status' && object != null && oldObject != null &&
        has(oldObject.spec.nodeName) && oldObject.spec.nodeName != '' &&
        request.userInfo.username == 'system:node:' + oldObject.spec.nodeName &&
        request.userInfo.groups.exists(g, g == 'system:nodes') &&
        request.userInfo.groups.exists(g, g == 'system:authenticated') &&
        object.metadata.name == oldObject.metadata.name &&
        object.metadata.namespace == oldObject.metadata.namespace &&
        object.metadata.uid == oldObject.metadata.uid &&
        has(object.metadata.labels) == has(oldObject.metadata.labels) &&
        (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels) &&
        has(object.metadata.annotations) == has(oldObject.metadata.annotations) &&
        (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations) &&
        has(object.metadata.finalizers) == has(oldObject.metadata.finalizers) &&
        (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers) &&
        has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences) &&
        object.spec == oldObject.spec
  validations:
    - expression: variables.manager || variables.nativeKubeletStatus
      message: a reserved worker Pod is immutable except for status written by its exact authenticated node
---
