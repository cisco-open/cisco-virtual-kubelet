             string(oldObject.metadata.ownerReferences[0].uid) + '-' +
             oldObject.metadata.labels['cisco.vk/diagnostic-capturedAt']) ||
          (oldObject.metadata.ownerReferences[0].apiVersion == 'ops.cisco.vk/v1alpha1' &&
