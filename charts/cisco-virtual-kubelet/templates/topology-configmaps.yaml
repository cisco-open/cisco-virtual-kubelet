{{- if .Values.topology.enabled }}
{{- include "cisco-virtual-kubelet.validateManagedTopology" . }}
{{- $policyNamespace := include "cisco-virtual-kubelet.topologyPolicyNamespace" . }}
{{- $policyName := include "cisco-virtual-kubelet.topologyPolicyName" . }}
{{- $ledgerName := include "cisco-virtual-kubelet.topologyLedgerName" . }}
{{- $livePolicy := lookup "v1" "ConfigMap" $policyNamespace $policyName }}
{{- $liveLedger := lookup "v1" "ConfigMap" $policyNamespace $ledgerName }}
{{- $retainedTopologyAuthority := false }}
{{- $liveAdmissionPolicies := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicy" "" "" }}
{{- range $candidate := (get $liveAdmissionPolicies "items" | default (list)) }}
{{- $annotations := dig "metadata" "annotations" (dict) $candidate }}
{{- if and
      (eq (get $annotations "meta.helm.sh/release-name") $.Release.Name)
      (eq (get $annotations "meta.helm.sh/release-namespace") $.Release.Namespace)
      (eq (get $annotations "topology.cisco.vk/admission-contract-version") "v1") }}
{{- $retainedTopologyAuthority = true }}
{{- end }}
{{- end }}
{{- if ne (empty $livePolicy) (empty $liveLedger) }}
{{- fail (printf "managed topology requires policy %s/%s and ledger %s/%s to be either both absent for bootstrap or both present; restore the retained identity before upgrading" $policyNamespace $policyName $policyNamespace $ledgerName) }}
{{- end }}
{{- if and (empty $livePolicy) (empty $liveLedger) $retainedTopologyAuthority }}
{{- fail (printf "refusing to bootstrap new topology policy %s/%s and ledger %s/%s while this Helm release retains managed-topology admission authority; restore the original coordinates or complete audited retirement first" $policyNamespace $policyName $policyNamespace $ledgerName) }}
{{- end }}
{{- $boundLedgerUID := "" }}
{{- if not (empty $livePolicy) }}
{{- if ne (dig "metadata" "annotations" "topology.cisco.vk/managed-policy" "" $livePolicy) "true" }}
{{- fail (printf "refusing to adopt topology policy %s/%s without topology.cisco.vk/managed-policy=true" $policyNamespace $policyName) }}
{{- end }}
{{- if ne (dig "metadata" "annotations" "topology.cisco.vk/admission-policy-prefix" "" $livePolicy) (include "cisco-virtual-kubelet.fullname" .) }}
{{- fail (printf "refusing to adopt topology policy %s/%s with a different admission-policy prefix" $policyNamespace $policyName) }}
{{- end }}
{{- if ne (dig "metadata" "annotations" "topology.cisco.vk/managed-ledger" "" $liveLedger) "true" }}
{{- fail (printf "refusing to adopt topology ledger %s/%s without topology.cisco.vk/managed-ledger=true" $policyNamespace $ledgerName) }}
{{- end }}
{{- $boundLedgerUID = dig "metadata" "annotations" "topology.cisco.vk/ledger-uid" "" $livePolicy }}
{{- $liveLedgerUID := dig "metadata" "uid" "" $liveLedger }}
{{- if eq $liveLedgerUID "" }}
{{- fail (printf "topology ledger %s/%s has no Kubernetes UID" $policyNamespace $ledgerName) }}
{{- end }}
{{- if and (ne $boundLedgerUID "") (ne $boundLedgerUID $liveLedgerUID) }}
{{- fail (printf "topology policy %s/%s binds ledger UID %s, but live ledger %s/%s has UID %s" $policyNamespace $policyName $boundLedgerUID $policyNamespace $ledgerName $liveLedgerUID) }}
{{- end }}
{{- if and (ne $boundLedgerUID "") (eq (trim (dig "data" "ledger.json" "" $liveLedger)) "") }}
{{- fail (printf "topology policy %s/%s is bound to an empty ledger; recover the retained ledger through the audited break-glass procedure before upgrading" $policyNamespace $policyName) }}
{{- end }}
{{- end }}
{{- $policy := dict
      "version" "v1"
      "fleetSelector" .Values.topology.policy.fleetSelector
      "requiredTopologyKeys" .Values.topology.policy.requiredTopologyKeys
      "projectedTopologyKeys" .Values.topology.policy.projectedTopologyKeys
      "globalMaxConcurrentTransfers" .Values.topology.policy.globalMaxConcurrentTransfers
      "globalMaxUnavailable" .Values.topology.policy.globalMaxUnavailable
      "domainMaxConcurrentTransfers" .Values.topology.policy.domainMaxConcurrentTransfers
      "domainMaxUnavailable" .Values.topology.policy.domainMaxUnavailable
      "healthFreshnessSeconds" .Values.topology.policy.healthFreshnessSeconds
      "maxCampaignTargets" .Values.topology.policy.maxCampaignTargets
      "maxActiveReservations" .Values.topology.policy.maxActiveReservations
      "maxLedgerBytes" .Values.topology.policy.maxLedgerBytes
      "ledgerName" $ledgerName
}}
{{- if .Values.topology.policy.workloadDrain.enabled }}
{{- if lt (int .Values.topology.policy.workloadDrain.maxTimeoutSeconds) (add (int .Values.topology.policy.workloadDrain.maxTerminationGraceSeconds) 120) }}
{{- fail "topology.policy.workloadDrain.maxTimeoutSeconds must be at least maxTerminationGraceSeconds plus 120" }}
{{- end }}
{{- $_ := set $policy "workloadDrain" (dict
      "enabled" true
      "allowedNamespaces" .Values.topology.policy.workloadDrain.allowedNamespaces
      "maxTimeoutSeconds" .Values.topology.policy.workloadDrain.maxTimeoutSeconds
      "maxPods" .Values.topology.policy.workloadDrain.maxPods
      "maxTerminationGraceSeconds" .Values.topology.policy.workloadDrain.maxTerminationGraceSeconds
) }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $policyName }}
  namespace: {{ $policyNamespace }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
    app.kubernetes.io/component: topology-policy
  annotations:
    helm.sh/resource-policy: keep
    topology.cisco.vk/managed-policy: "true"
    topology.cisco.vk/admission-policy-prefix: {{ include "cisco-virtual-kubelet.fullname" . | quote }}
    topology.cisco.vk/admission-contract-version: "v1"
    {{- if ne $boundLedgerUID "" }}
    topology.cisco.vk/ledger-uid: {{ $boundLedgerUID | quote }}
    {{- end }}
data:
  # On bootstrap the manager binds the live ledger ConfigMap UID in the
  # protected topology.cisco.vk/ledger-uid annotation after initializing the
  # ledger. Live upgrades preserve that immutable binding through lookup;
  # Helm never renders a guessed or placeholder UID.
  policy.json: |-
    {{ $policy | toJson }}
{{- if empty $liveLedger }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $ledgerName }}
  namespace: {{ $policyNamespace }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
    app.kubernetes.io/component: topology-ledger
  annotations:
    helm.sh/resource-policy: keep
    topology.cisco.vk/managed-ledger: "true"
data:
  # Empty is the only safe first-install state. Once this object exists, Helm
  # omits it from upgrades so a stale render cannot overwrite manager-owned
  # reservations. The keep annotation preserves it when it leaves the release
  # manifest. A bound empty ledger or a recreated UID is a fail-closed error.
  ledger.json: ""
{{- end }}
{{- end }}
