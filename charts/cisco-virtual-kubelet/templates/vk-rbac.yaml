{{- $strictRBAC := eq .Values.rbac.profile "strict" }}
---
# Service account used by all Virtual Kubelet Deployments spawned by the controller.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cisco-virtual-kubelet.vkServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
---
# Cluster-scoped ClusterRole for Virtual Kubelet pods. This carries only the
# permissions a VK node genuinely needs cluster-wide: it hosts pods scheduled
# from ANY namespace (so pod/configmap/secret/service access is cluster-wide),
# registers a Node, holds node-heartbeat + config Leases, and watches
# CiscoDevice cluster-wide to resolve its device-spec. Tenant config CRDs are
# NOT here — they live in the namespaced "-device" role below so a per-device
# pod cannot read another tenant's config/intent.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cisco-virtual-kubelet.vkServiceAccountName" . }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
rules:
  # Pod operations
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Node operations
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["get", "update", "patch"]
  # ConfigMap and Secret access (for pod volumes — pods may be in any namespace)
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  # Service operations (for pod DNS/service discovery)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  # PersistentVolumeClaim/PersistentVolume operations
  {{- if not $strictRBAC }}
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  # Events (for logging pod events)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Node leases (required for node heartbeat in kube-node-lease namespace) and
  # the FamilyLeaser config leases. Leases span namespaces (kube-node-lease +
  # the device namespace), so this stays cluster-wide.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # CiscoDevice CR (cisco.vk/v1alpha1) — the cisco-vk run loop
  # watches CiscoDevice cluster-wide so the in-pod controller-runtime
  # cache can resolve the device-spec lookup.
  - apiGroups: ["cisco.vk"]
    resources: ["ciscodevices"]
    verbs: ["get", "list", "watch"]
  # IOSXEConfigDefaults is a CLUSTER-SCOPED CRD (a global default applied across
  # the cluster), so its informer does a cluster-scoped ListWatch. A namespaced
  # RoleBinding cannot grant a cluster-scoped resource, so this grant MUST live
  # in the cluster-scoped role (bound via ClusterRoleBinding). The namespaced
  # scope objects (devicegroups, interfacegroups, templates) stay in the
  # -device role below.
  - apiGroups: ["config.cisco.vk"]
    resources: ["iosxeconfigdefaults"]
    verbs: ["get", "list", "watch"]
  # ConfigMap write access — diagnostic ConfigMap sink writes capture results.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# Namespaced ClusterRole for the per-device VK pod's CONFIG management. These
# config.cisco.vk / ops.cisco.vk CRDs are device-namespace-scoped: a per-device
# pod (with reconciler namespace isolation) only ever lists/acts on CRs in its
# own namespace. The controller binds this role with a namespaced RoleBinding,
# NOT a ClusterRoleBinding, so the pod cannot read another tenant's config.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cisco-virtual-kubelet.vkServiceAccountName" . }}-device
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
rules:
  # Namespaced IOSXEConfig scope objects (device groups, interface groups,
  # templates) the per-device ConfigReconciler reads. iosxeconfigdefaults is
  # CLUSTER-scoped and lives in the cluster role above — it cannot be granted
  # via this namespaced RoleBinding.
  - apiGroups: ["config.cisco.vk"]
    resources:
      - iosxedevicegroupconfigs
      - iosxeinterfacegroupconfigs
      - iosxetemplates
    verbs: ["get", "list", "watch"]
  # IOSXEConfig itself needs patch/update in addition to read/watch:
  # after a successful Phase-7 replay, recordResult clears the
  # config.cisco.vk/replay-from-log annotation by patching the parent CR.
  - apiGroups: ["config.cisco.vk"]
    resources: ["iosxeconfigs"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["config.cisco.vk"]
    resources: ["iosxeconfigs/status"]
    verbs: ["get", "update", "patch"]
  # NXOSConfig CRD — the shared config reconciler running inside the
  # per-device VK pod needs object/status permissions for status updates,
  # drift reconciliation, and finalizer cleanup.
  - apiGroups: ["config.cisco.vk"]
    resources: ["nxosconfigs"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["config.cisco.vk"]
    resources: ["nxosconfigs/status"]
    verbs: ["get", "update", "patch"]
  # IOSXEConfigApplyLog CRD — Phase 7 audit log.
  - apiGroups: ["config.cisco.vk"]
    resources: ["iosxeconfigapplylogs"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["config.cisco.vk"]
    resources: ["iosxeconfigapplylogs/status"]
    verbs: ["get", "update", "patch"]
  # IOSXEConfigRevision CRD — durable resolved-intent history used by rollbackTo.
  - apiGroups: ["config.cisco.vk"]
    resources: ["iosxeconfigrevisions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["config.cisco.vk"]
    resources: ["iosxeconfigrevisions/status"]
    verbs: ["get", "update", "patch"]
  # IOSXETelemetry CRD — per-device MDT-over-gNMI controller.
  - apiGroups: ["config.cisco.vk"]
    resources: ["iosxetelemetries"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["config.cisco.vk"]
    resources: ["iosxetelemetries/status"]
    verbs: ["get", "update", "patch"]
  # IOSXEDiagnostic CRD — diagnostics-RFC Phase B.
  - apiGroups: ["config.cisco.vk"]
    resources: ["iosxediagnostics"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["config.cisco.vk"]
    resources: ["iosxediagnostics/status"]
    verbs: ["get", "update", "patch"]
  # DeviceOperation CRD — read-only async operations. create is required for
  # the localhost admin /v1/exec wrapper; delete for ttlSecondsAfterFinished.
  - apiGroups: ["ops.cisco.vk"]
    resources: ["deviceoperations"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["ops.cisco.vk"]
    resources: ["deviceoperations/status"]
    verbs: ["get", "update", "patch"]
  {{- if or (not $strictRBAC) .Values.gnoi.enableSoftwareUpgrade }}
  # IOSXESoftwareUpgrade CRD — multi-phase gNOI OS upgrade reconciler.
  - apiGroups: ["ops.cisco.vk"]
    resources: ["iosxesoftwareupgrades"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["ops.cisco.vk"]
    resources: ["iosxesoftwareupgrades/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["ops.cisco.vk"]
    resources: ["iosxesoftwareupgrades/finalizers"]
    verbs: ["update"]
  {{- end }}
  {{- if or (not $strictRBAC) .Values.gnoi.enableWriteClass }}
  # IOSXEOperationalAction CRD — write-class destructive gNOI ops.
  - apiGroups: ["ops.cisco.vk"]
    resources: ["iosxeoperationalactions"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["ops.cisco.vk"]
    resources: ["iosxeoperationalactions/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["ops.cisco.vk"]
    resources: ["iosxeoperationalactions/finalizers"]
    verbs: ["update"]
  {{- end }}
---
# ClusterRoleBinding for the cluster-scoped VK role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cisco-virtual-kubelet.vkServiceAccountName" . }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cisco-virtual-kubelet.vkServiceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cisco-virtual-kubelet.vkServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Namespaced RoleBinding for the config-management role in the release
# namespace. Per-device pods in other namespaces receive their own
# RoleBinding from the controller (ensureVKAccess).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cisco-virtual-kubelet.vkServiceAccountName" . }}-device
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cisco-virtual-kubelet.vkServiceAccountName" . }}-device
subjects:
  - kind: ServiceAccount
    name: {{ include "cisco-virtual-kubelet.vkServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
