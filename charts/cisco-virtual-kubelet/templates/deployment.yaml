{{- include "cisco-virtual-kubelet.validateLeaderElection" . -}}
{{- include "cisco-virtual-kubelet.validateManagedTopology" . -}}
{{- include "cisco-virtual-kubelet.validateTopologyRetirement" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cisco-virtual-kubelet.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cisco-virtual-kubelet.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cisco-virtual-kubelet.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "cisco-virtual-kubelet.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "cisco-virtual-kubelet.controllerServiceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ include "cisco-virtual-kubelet.controllerImage" . }}
          imagePullPolicy: {{ include "cisco-virtual-kubelet.controllerImagePullPolicy" . }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - cisco-vk
            - manager
            - --vk-image={{ include "cisco-virtual-kubelet.vkImage" . }}
            - --controller-worker-image={{ include "cisco-virtual-kubelet.controllerImage" . }}
            - --controller-worker-image-pull-policy={{ include "cisco-virtual-kubelet.controllerImagePullPolicy" . }}
            - --vk-service-account={{ include "cisco-virtual-kubelet.vkServiceAccountName" . }}
            - --metrics-bind-address={{ .Values.controller.metricsBindAddress }}
            - --health-probe-bind-address={{ .Values.controller.healthProbeBindAddress }}
            {{- if .Values.controller.leaderElect }}
            - --leader-elect
            {{- end }}
            {{- if .Values.aggregator.enabled }}
            - --enable-config-aggregator
            {{- end }}
            {{- if .Values.topology.enabled }}
            - --enable-managed-topology
            {{- end }}
            # Retain the policy identity while managed topology is disabled so
            # a live reverse handoff never loses its rollback coordinates.
            # These flags grant no authority by themselves.
            - --topology-policy-namespace={{ include "cisco-virtual-kubelet.topologyPolicyNamespace" . }}
            - --topology-policy-name={{ include "cisco-virtual-kubelet.topologyPolicyName" . }}
          env:
            # Kubernetes downward-API identity. The OTel SDK promotes these
            # to standard SemConv resource attributes (k8s.pod.*, k8s.node.*,
            # service.instance.id) on every emitted signal so multi-replica
            # deployments are correlatable downstream.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Helm injects telemetry values into the controller first. The
            # CiscoDevice controller reads these env vars from its own process
            # environment and propagates them verbatim to each per-device VK
            # pod, where MDT-over-gNMI subscriptions and OTel exporters run.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ include "cisco-virtual-kubelet.telemetryOtlpEndpoint" . | quote }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: {{ include "cisco-virtual-kubelet.telemetryOtlpInsecure" . | quote }}
            {{- if .Values.telemetry.otlp.headersSecret.name }}
            # SecretKeyRef-backed OTLP headers. The controller mirrors this
            # SecretKeyRef onto every per-device VK pod it spawns; operators
            # must ensure the named Secret exists in each device.Namespace
            # (same model as imagePullSecrets).
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.telemetry.otlp.headersSecret.name | quote }}
                  key: {{ .Values.telemetry.otlp.headersSecret.key | default "OTEL_EXPORTER_OTLP_HEADERS" | quote }}
            - name: CVK_OTLP_HEADERS_SECRET_NAME
              value: {{ .Values.telemetry.otlp.headersSecret.name | quote }}
            - name: CVK_OTLP_HEADERS_SECRET_KEY
              value: {{ .Values.telemetry.otlp.headersSecret.key | default "OTEL_EXPORTER_OTLP_HEADERS" | quote }}
            {{- else }}
            # Inline OTLP headers as a literal value. SECURITY: anything in
            # this map is visible to anyone with `get pod` on this and every
            # per-device pod's namespace. Switch to telemetry.otlp.headersSecret
            # if these headers carry auth tokens.
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: {{ .Values.telemetry.otlp.headers | toJson | quote }}
            {{- end }}
            - name: YANG_MODELS_DIR
              value: {{ include "cisco-virtual-kubelet.yangModelsMountPath" . | quote }}
            - name: CONFIG_YANG_VALIDATION
              value: {{ .Values.config.yangValidationMode | quote }}
            {{- if .Values.nxos.allowExperimentalReleases }}
            - name: CVK_NXOS_ALLOW_EXPERIMENTAL_RELEASES
              value: "true"
            {{- end }}
            - name: CVK_RESOURCE_ATTRIBUTES
              value: {{ .Values.telemetry.resourceAttributes | toJson | quote }}
            {{- if .Values.worker.resources }}
            - name: CVK_WORKER_RESOURCES
              value: {{ .Values.worker.resources | toJson | quote }}
            {{- end }}
            {{- if .Values.worker.tmpSizeLimit }}
            - name: CVK_WORKER_TMP_SIZE_LIMIT
              value: {{ .Values.worker.tmpSizeLimit | quote }}
            {{- end }}
            {{- if .Values.gnoi.insecure }}
            - name: CISCO_VK_GNOI_INSECURE
              value: "1"
            {{- end }}
            {{- if .Values.gnoi.port }}
            - name: CISCO_VK_GNOI_PORT
              value: {{ .Values.gnoi.port | quote }}
            {{- end }}
            {{- if .Values.gnoi.disabled }}
            - name: CISCO_VK_GNOI_DISABLED
              value: "1"
            {{- end }}
            {{- if .Values.gnoi.enableSoftwareUpgrade }}
            - name: CISCO_VK_ENABLE_IOSXE_SOFTWARE_UPGRADE
              value: "1"
            - name: CISCO_VK_UPGRADE_MAX_IMAGE_BYTES
              value: {{ .Values.gnoi.softwareUpgrade.maxImageBytes | int64 | quote }}
            {{- end }}
            {{- if .Values.gnoi.enableWriteClass }}
            - name: CISCO_VK_ENABLE_WRITE_CLASS_GNOI
              value: "1"
            {{- end }}
            {{- if .Values.config.leaseNamespace }}
            # Shared cluster namespace for per-(device,family) config and
            # disruptive-mutation arbitration leases. Every spawned cisco-vk
            # pod inherits it; device identity remains namespaced. Leave unset
            # to store leases in the worker's pod/device namespace.
            - name: CONFIG_LEASE_NAMESPACE
              value: {{ .Values.config.leaseNamespace | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # Writable /tmp for the read-only root filesystem set by the
            # default containerSecurityContext.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.telemetry.yangModels.configMapName }}
            - name: yang-models
              mountPath: {{ include "cisco-virtual-kubelet.yangModelsMountPath" . }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.telemetry.yangModels.configMapName }}
        - name: yang-models
          configMap:
            name: {{ .Values.telemetry.yangModels.configMapName }}
            optional: true
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
