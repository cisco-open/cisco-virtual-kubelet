---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: iosxeconfigs.config.cisco.vk
spec:
  group: config.cisco.vk
  names:
    kind: IOSXEConfig
    listKind: IOSXEConfigList
    plural: iosxeconfigs
    shortNames:
    - iosxecfg
    singular: iosxeconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.deviceRef.name
      name: Device
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.driftPolicy
      name: Drift
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IOSXEConfig is the per-device desired-configuration CR. A single device
          may be targeted by at most one IOSXEConfig for any given family; the
          driver arbitrates via a per-family lease and surfaces conflicts in status.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              IOSXEConfigSpec declares the desired IOS-XE configuration for a single
              device. The config driver running inside cisco-vk run merges this spec
              with any matching defaults, device groups, and referenced templates to
              produce the resolved intent that is reconciled against the device.
            properties:
              deviceGroups:
                description: |-
                  DeviceGroups names the IOSXEDeviceGroupConfig CRs whose configuration
                  is merged into the resolved intent before this CR's source.
                  Merge order follows netascode semantics: defaults → device groups →
                  interface groups → templates → per-device, rightmost wins.
                items:
                  type: string
                type: array
              deviceRef:
                description: DeviceRef targets the CiscoDevice this configuration
                  applies to.
                properties:
                  name:
                    description: Name of the CiscoDevice the CR targets.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              driftDetectInterval:
                default: 5m
                description: |-
                  DriftDetectInterval is the cadence at which the driver re-fetches and
                  compares observed state to intent when the spec is otherwise quiescent.
                  Parsed as a Go duration; minimum 30s to avoid device hammering.
                type: string
              driftPolicy:
                default: revert
                description: DriftPolicy controls what happens when drift is found.
                  See DriftPolicy.
                enum:
                - revert
                - report
                - pause
                type: string
              interfaceGroups:
                description: |-
                  InterfaceGroups names the IOSXEInterfaceGroupConfig CRs whose
                  per-interface configuration is expanded and merged into the
                  resolved intent. Each named group must be in the same namespace
                  as the CR. Matches netascode's `interface_groups[]`.
                items:
                  type: string
                type: array
              managedFamilies:
                description: |-
                  ManagedFamilies is the closed list of netascode families this CR owns.
                  A family outside this list is not written by this CR even when the
                  merged intent contains values for it, so config can be adopted family
                  by family during a cutover.
                items:
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              pruneOnRelinquish:
                default: false
                description: |-
                  PruneOnRelinquish, when true, causes families removed from
                  ManagedFamilies to be explicitly deleted from the device on the next
                  reconcile. Default is to leave previously-written configuration in
                  place, matching operator intuition during migrations.
                type: boolean
              source:
                description: Source carries the per-device netascode configuration
                  payload.
                properties:
                  configMapRef:
                    description: |-
                      ConfigMapRef references a ConfigMap in the same namespace whose keyed
                      entry holds a netascode YAML document. Used for large configurations
                      that would otherwise bloat the CR past etcd's per-object limit.
                    properties:
                      key:
                        description: Key within the ConfigMap whose value is the netascode
                          YAML body.
                        minLength: 1
                        type: string
                      name:
                        description: Name of the ConfigMap (same namespace as the
                          CR).
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  inline:
                    description: |-
                      Inline is an inline netascode configuration. The payload is the content
                      of an iosxe.devices[].configuration block; the field is schemaless so
                      family shape evolves with the YANG release, not the CRD.
                    x-kubernetes-preserve-unknown-fields: true
                type: object
              templateRefs:
                description: |-
                  TemplateRefs names IOSXETemplate CRs to expand and merge before the
                  per-device source.
                items:
                  description: |-
                    TemplateRef refers to an IOSXETemplate and supplies parameter values used
                    during expansion.
                  properties:
                    name:
                      description: Name of the IOSXETemplate (same namespace as the
                        referring CR).
                      minLength: 1
                      type: string
                    values:
                      description: |-
                        Values overrides the template's parameter defaults. Shape is validated
                        against the template's declared parameters at expansion time.
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                  - name
                  type: object
                type: array
              transactional:
                default: false
                description: |-
                  Transactional requests a candidate-datastore + commit apply when the
                  transport supports it (NETCONF). Ignored with a warning on RESTCONF,
                  which has no candidate datastore; Phase-2 lifts this limitation.
                type: boolean
              writeStartup:
                default: false
                description: |-
                  WriteStartup copies running-config to startup-config after a successful
                  apply. Off by default to keep reconciles cheap; turn on for devices
                  expected to reboot without a config-save orchestrator.
                type: boolean
            required:
            - deviceRef
            - managedFamilies
            - source
            type: object
          status:
            description: IOSXEConfigStatus reports reconciliation state to users and
              GitOps agents.
            properties:
              conditions:
                description: |-
                  Conditions follows the standard Kubernetes conditions shape. The
                  driver maintains Ready, Reconciling, and a Healthy-<family> entry
                  for each managed family.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              drift:
                description: |-
                  Drift lists the currently known divergences between intent and device.
                  Capped at 50 entries; additional drift is reflected in the
                  cisco_vk_config_drift_entries_truncated_total counter only.
                items:
                  description: |-
                    DriftEntry records a single observed-vs-desired divergence. Paths are YANG
                    xpaths so the entry is unambiguous regardless of the family's shape.
                  properties:
                    desired:
                      description: Desired is the declared value (optional; omitted
                        for deletes).
                      type: string
                    detected:
                      description: Detected is the time the driver first observed
                        this specific entry.
                      format: date-time
                      type: string
                    family:
                      description: Family the drift belongs to.
                      type: string
                    observed:
                      description: |-
                        Observed is the value currently on the device (optional; omitted for
                        leaves absent from the device).
                      type: string
                    path:
                      description: Path is the YANG xpath of the leaf or list key
                        that differs.
                      type: string
                  required:
                  - family
                  - path
                  type: object
                maxItems: 50
                type: array
              familyStatus:
                description: FamilyStatus reports per-family state for each family
                  in ManagedFamilies.
                items:
                  description: FamilyStatus reports per-family reconciliation state.
                  properties:
                    entries:
                      description: |-
                        Entries counts the number of keyed items the driver observed for this
                        family on the device (e.g. number of VLANs). Zero for singleton families.
                      format: int32
                      type: integer
                    message:
                      description: Message is a short human-readable description.
                        Empty when state is InSync.
                      type: string
                    name:
                      description: Name of the netascode family (e.g. "vlan", "interface_ethernet").
                      type: string
                    state:
                      description: |-
                        State is one of Pending, InSync, Drifted, ApplyError, Skipped,
                        Unsupported. The taxonomy is closed; unknown values are rejected.
                      enum:
                      - Pending
                      - InSync
                      - Drifted
                      - ApplyError
                      - Skipped
                      - Unsupported
                      type: string
                  required:
                  - name
                  - state
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              lastAppliedHash:
                description: |-
                  LastAppliedHash is a stable SHA-256 over the canonicalised resolved
                  intent. The driver short-circuits reconcile when this matches the
                  current intent and the device is known-fresh.
                type: string
              lastAppliedTime:
                description: LastAppliedTime records the most recent successful apply.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation the driver
                  last acted on.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is a coarse state summary: Pending, Validating, Planning,
                  Applying, Verifying, InSync, Drifted, Failed, or Paused.
                enum:
                - Pending
                - Validating
                - Planning
                - Applying
                - Verifying
                - InSync
                - Drifted
                - Failed
                - Paused
                type: string
              sourceYangVersion:
                description: |-
                  SourceYangVersion is the YANG release the driver used to translate
                  the intent on the last successful apply.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
