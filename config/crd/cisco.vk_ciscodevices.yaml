---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: ciscodevices.cisco.vk
spec:
  group: cisco.vk
  names:
    kind: CiscoDevice
    listKind: CiscoDeviceList
    plural: ciscodevices
    shortNames:
    - cvk
    singular: ciscodevice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.driver
      name: Driver
      type: string
    - jsonPath: .spec.address
      name: Address
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CiscoDevice is the Schema for the ciscodevices API.
          It represents a single Cisco device managed by the virtual kubelet operator.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DeviceSpec defines the desired state of a Cisco device.
              Shared fields are common to all drivers; driver-specific networking
              configuration lives under the corresponding driver section (XE, XR, etc.).
            properties:
              address:
                description: Address is the management IP or hostname of the device.
                type: string
              allowUnsignedApps:
                default: false
                description: |-
                  AllowUnsignedApps indicates the device permits unsigned application packages.
                  When true, the reconciler will not fail pods based on a transient
                  iox-pkg-policy-invalid value during the INSTALLING state.
                  When false (default), the reconciler treats iox-pkg-policy-invalid during
                  INSTALLING as a terminal failure only when confirmed by an install
                  notification from the device.
                type: boolean
              configPrereqs:
                description: |-
                  ConfigPrereqs declares the network configuration this device requires
                  before pods can be hosted on it, for example a VirtualPortGroup
                  interface, DHCP pool, app egress ACL, or NX-OS apphosting prerequisite
                  family. When set, the controller materializes the platform config CR
                  described by the platform descriptor: IOS-XE keeps the legacy
                  IOSXEConfig prereq family set, while NX-OS and future platforms derive
                  managed families from the source payload unless explicitly supplied.

                  The payload carries the same netascode-shaped YAML as
                  IOSXEConfig.spec.source.inline. Operator-authored IOSXEConfig CRs may
                  coexist with this controller-owned CR as long as they do not claim the
                  same families.
                properties:
                  configuration:
                    description: |-
                      Configuration is the netascode-shaped fragment. Same shape as
                      the target platform config CR's spec.source.inline.
                    x-kubernetes-preserve-unknown-fields: true
                  managedFamilies:
                    description: |-
                      ManagedFamilies optionally overrides the platform prereq family policy.
                      IOS-XE normally uses the legacy fixed apphosting prereq family set.
                      NX-OS and future platforms derive this list from Configuration's
                      top-level keys when it is omitted.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                required:
                - configuration
                type: object
              credentialSecretRef:
                description: |-
                  CredentialSecretRef references a Secret containing device credentials.
                  Used by the controller when creating VK deployments from CRDs.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              driver:
                allOf:
                - enum:
                  - XE
                  - XR
                  - NXOS
                  - OPENCONFIG
                  - FAKE
                - enum:
                  - XE
                  - XR
                  - NXOS
                  - OPENCONFIG
                  - FAKE
                type: string
              gnoi:
                description: |-
                  GNOI optionally overrides the per-device gNOI transport. When omitted,
                  the historical port and TLS inference from Port and TLS is preserved.
                  Secure gNOI authentication uses Username and the resolved device password.
                properties:
                  certificateProvisioning:
                    description: |-
                      CertificateProvisioning opts this device into gNOI Certificate Install
                      when OS.Verify reports IOS XE's not-provisioned state. The referenced
                      Secret is mounted only into this device's VK pod and must contain tls.crt,
                      tls.key, and ca.crt. Certificate material is never copied into the rendered
                      device ConfigMap.
                    properties:
                      certificateID:
                        description: |-
                          CertificateID is the IOS XE trustpoint identifier associated with the
                          certificate installed through gNOI.
                        maxLength: 64
                        minLength: 1
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
                        type: string
                      replaceTargetCABundle:
                        description: |-
                          ReplaceTargetCABundle must be true to acknowledge that gNOI
                          LoadCertificate replaces the target's complete CA bundle. IOS XE shares
                          that bundle between gNOI and gNMI, so ca.crt must preserve every peer CA
                          that those services must continue to trust.
                        type: boolean
                      secretRef:
                        description: |-
                          SecretRef names a Secret in the CiscoDevice namespace. It must contain
                          tls.crt, tls.key, and ca.crt keys. ca.crt is the complete desired target
                          CA replacement bundle, not only the leaf's issuer chain. The kubelet
                          projects those keys into the per-device worker as read-only files.
                        properties:
                          name:
                            description: Name is the DNS-subdomain name of the provisioning
                              Secret.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - certificateID
                    - replaceTargetCABundle
                    - secretRef
                    type: object
                    x-kubernetes-validations:
                    - message: replaceTargetCABundle must be true to acknowledge replacement
                        of the shared gNXI/gNMI CA bundle
                      rule: self.replaceTargetCABundle == true
                  port:
                    description: |-
                      Port is the device-side gNOI listener port. When omitted, CVK uses 9339
                      for TLS and 50052 for plaintext. Unlike the legacy inference path, a
                      present GNOI block never inherits DeviceSpec.Port.
                    maximum: 65535
                    minimum: 1
                    type: integer
                  transportSecurity:
                    default: auto
                    description: |-
                      TransportSecurity controls whether gNOI uses TLS. Empty and auto inherit
                      the decision from DeviceSpec.TLS.Enabled.
                    enum:
                    - auto
                    - tls
                    - plaintext
                    type: string
                type: object
                x-kubernetes-validations:
                - message: certificateProvisioning requires transportSecurity to be
                    tls
                  rule: '!has(self.certificateProvisioning) || (has(self.transportSecurity)
                    && self.transportSecurity == ''tls'')'
              labels:
                additionalProperties:
                  type: string
                description: Labels to apply to the virtual kubelet node.
                type: object
              logLevel:
                default: info
                description: |-
                  LogLevel sets the logging verbosity for the VK instance.
                  Valid values are: debug, info, warn, error.
                enum:
                - debug
                - info
                - warn
                - error
                type: string
              maxPods:
                default: 16
                description: MaxPods is the maximum number of pods the device can
                  host.
                format: int32
                type: integer
              nxos:
                description: NXOS holds NX-OS specific networking configuration.
                properties:
                  networking:
                    description: Networking configures the guest interface passed
                      to NX-OS app-hosting.
                    properties:
                      interface:
                        description: Interface is the app-hosting attachment declaration.
                        properties:
                          management:
                            description: Management holds management-network app-hosting
                              settings.
                            properties:
                              guestInterface:
                                default: 0
                                description: GuestInterface is the guest interface
                                  index used by app-hosting.
                                maximum: 7
                                minimum: 0
                                type: integer
                            type: object
                          type:
                            allOf:
                            - enum:
                              - Management
                            - enum:
                              - Management
                            default: Management
                            description: Type selects the interface family. Management
                              is the initial supported mode.
                            type: string
                        type: object
                    type: object
                type: object
              opsPolicy:
                description: |-
                  OpsPolicy declares per-device DeviceOperation gates the controller
                  templates into the per-device VK pod's environment. The CiscoDevice
                  reconciler is the authoritative source — imperative `kubectl set env`
                  edits are reverted on the next reconcile.
                properties:
                  configDiffAllowedNamespaces:
                    description: |-
                      ConfigDiffAllowedNamespaces, when non-empty, restricts the namespaces
                      from which DeviceOperation/ConfigDiff requests targeting this device
                      will run. Requests from other namespaces fail at admission with
                      reason=NamespaceNotAuthorized. The controller renders this list as
                      CVK_OPS_CONFIGDIFF_ALLOWED_NAMESPACES (comma-separated) on the
                      per-device VK pod. An empty/nil list preserves the unrestricted
                      default for backward compatibility.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                type: object
              otel:
                description: |-
                  OTEL holds OpenTelemetry topology export configuration.
                  When enabled, the VK emits OTLP traces representing the device's
                  network topology (neighbors, links) to the configured collector endpoint.
                properties:
                  enabled:
                    description: Enabled toggles OTEL topology trace emission.
                    type: boolean
                  endpoint:
                    description: Endpoint is the OTLP gRPC collector endpoint (e.g.
                      "otel-collector:4317").
                    type: string
                  insecure:
                    default: true
                    description: Insecure disables TLS for the gRPC connection to
                      the OTLP endpoint.
                    type: boolean
                  intervalSecs:
                    default: 60
                    description: IntervalSecs is the interval in seconds between topology
                      trace emissions.
                    minimum: 10
                    type: integer
                  maxLinkSpans:
                    default: 256
                    description: |-
                      MaxLinkSpans caps link spans emitted per topology cycle. Extra links are
                      counted on the root span as topology.dropped_link_count so large devices
                      cannot create unbounded Tempo write bursts.
                    minimum: 1
                    type: integer
                  serviceName:
                    default: cisco-network
                    description: |-
                      ServiceName is the base service name used in OTEL resource attributes.
                      The device hostname is appended: "<serviceName>.<hostname>".
                    type: string
                required:
                - enabled
                type: object
              password:
                description: |-
                  Password for device authentication.
                  In CRD mode the controller should source this from a Secret reference.
                type: string
              podCIDR:
                description: PodCIDR is the CIDR to use for pod network interfaces
                  when using static IP allocation.
                type: string
              port:
                description: 'Port for device communication (default: 443 for TLS,
                  80 otherwise).'
                maximum: 65535
                minimum: 1
                type: integer
              region:
                description: Region for node topology.
                type: string
              resourceLimits:
                description: ResourceLimits defines default and maximum resource allocations.
                properties:
                  defaultCPU:
                    type: string
                  defaultMemory:
                    type: string
                  defaultStorage:
                    type: string
                  maxCPU:
                    type: string
                  maxMemory:
                    type: string
                  maxStorage:
                    type: string
                  others:
                    additionalProperties:
                      type: string
                    type: object
                type: object
              taints:
                description: Taints to apply to the virtual kubelet node.
                items:
                  description: |-
                    The node this Taint is attached to has the "effect" on
                    any pod that does not tolerate the Taint.
                  properties:
                    effect:
                      description: |-
                        Required. The effect of the taint on pods
                        that do not tolerate the taint.
                        Valid effects are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: Required. The taint key to be applied to a node.
                      type: string
                    timeAdded:
                      description: TimeAdded represents the time at which the taint
                        was added.
                      format: date-time
                      type: string
                    value:
                      description: The taint value corresponding to the taint key.
                      type: string
                  required:
                  - effect
                  - key
                  type: object
                type: array
              tls:
                description: TLS configuration for device communication.
                properties:
                  caFile:
                    description: CAFile is the path to the CA certificate file.
                    type: string
                  certFile:
                    description: CertFile is the path to the client certificate file.
                    type: string
                  enabled:
                    description: Enabled toggles TLS for device communication.
                    type: boolean
                  insecureSkipVerify:
                    description: InsecureSkipVerify disables TLS certificate verification.
                    type: boolean
                  keyFile:
                    description: KeyFile is the path to the client key file.
                    type: string
                required:
                - enabled
                type: object
              transport:
                default: restconf
                description: |-
                  Transport selects the device channel used by declarative config
                  drivers. IOS-XE defaults to RESTCONF and also supports NETCONF/gNMI.
                  NX-OS declarative config uses NX-API REST/DME, selected with "rest";
                  because this field has a historical global RESTCONF default, NX-OS treats
                  an omitted/defaulted "restconf" value as REST/DME too. The legacy "nxapi"
                  value remains accepted as an alias for existing manifests. Apphosting
                  operations always use the platform apphosting transport regardless of
                  this field.
                enum:
                - rest
                - restconf
                - netconf
                - gnmi
                - nxapi
                type: string
              username:
                description: Username for device authentication.
                type: string
              xe:
                description: |-
                  XE holds IOS-XE specific networking configuration.
                  Required when driver=XE.
                properties:
                  networking:
                    description: Networking holds the IOS-XE networking configuration.
                    properties:
                      interface:
                        description: Interface holds the interface-level configuration.
                        properties:
                          appGigabitEthernet:
                            description: AppGigabitEthernet configuration (when type=AppGigabitEthernet).
                            properties:
                              dhcp:
                                description: Dhcp enables DHCP when in access mode
                                  without a VLAN interface.
                                type: boolean
                              guestInterface:
                                description: GuestInterface number inside the container
                                  (optional, defaults to 0).
                                maximum: 3
                                type: integer
                              mode:
                                allOf:
                                - enum:
                                  - access
                                  - trunk
                                - enum:
                                  - access
                                  - trunk
                                description: Mode specifies access or trunk mode.
                                type: string
                              vlanIf:
                                description: VlanIf holds VLAN-specific configuration.
                                properties:
                                  dhcp:
                                    description: Dhcp enables DHCP for the VLAN interface.
                                    type: boolean
                                  guestInterface:
                                    description: GuestInterface number inside the
                                      container (optional, defaults to 0).
                                    maximum: 3
                                    type: integer
                                  macForwardingEnabled:
                                    description: MacForwardingEnabled enables MAC
                                      address forwarding.
                                    type: boolean
                                  mirrorEnabled:
                                    description: MirrorEnabled enables port mirroring.
                                    type: boolean
                                  multicastEnabled:
                                    description: MulticastEnabled enables multicast
                                      traffic.
                                    type: boolean
                                  vlan:
                                    description: Vlan ID for the interface.
                                    maximum: 4094
                                    minimum: 0
                                    type: integer
                                required:
                                - dhcp
                                type: object
                            required:
                            - mode
                            type: object
                          management:
                            description: Management configuration (when type=Management).
                            properties:
                              dhcp:
                                description: Dhcp enables DHCP for the Management
                                  interface.
                                type: boolean
                              guestInterface:
                                description: GuestInterface number inside the container
                                  (optional, defaults to 0).
                                maximum: 3
                                type: integer
                            required:
                            - dhcp
                            type: object
                          type:
                            description: Type specifies which interface type is configured.
                            enum:
                            - VirtualPortGroup
                            - AppGigabitEthernet
                            - Management
                            type: string
                          virtualPortGroup:
                            description: VirtualPortGroup configuration (when type=VirtualPortGroup).
                            properties:
                              dhcp:
                                description: Dhcp enables DHCP for the VirtualPortGroup
                                  interface.
                                type: boolean
                              guestInterface:
                                description: GuestInterface number inside the container
                                  (optional, defaults to 0).
                                maximum: 3
                                type: integer
                              interface:
                                description: Interface number (0-3 for VirtualPortGroup0-3).
                                type: string
                            required:
                            - dhcp
                            type: object
                        required:
                        - type
                        type: object
                    type: object
                required:
                - networking
                type: object
              zone:
                description: Zone for node topology.
                type: string
            required:
            - address
            - driver
            - username
            type: object
          status:
            description: DeviceStatus defines the observed state of a CiscoDevice.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the device's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              netAsCode:
                description: |-
                  NetAsCode records the Network as Code model stripe this device should
                  align with. It is descriptive status: the platform-specific config CRDs
                  remain the source of desired intent.
                properties:
                  format:
                    description: |-
                      Format is the platform model format string used by config CRDs, for
                      example netascode-iosxe or netascode-nxos.
                    type: string
                  sections:
                    description: Sections names the high-level NetAsCode sections
                      used for this stripe.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  stripe:
                    description: Stripe is the technology stripe, for example iosxe,
                      nxos, ise, or fmc.
                    type: string
                  type:
                    description: Type is the Network as Code model category.
                    enum:
                    - ControllerCentric
                    - DeviceCentric
                    - SolutionCentric
                    type: string
                type: object
              phase:
                description: Phase represents the current lifecycle phase of the device.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Error
                - Deleting
                type: string
              workerCapabilities:
                description: |-
                  WorkerCapabilities is a bounded summary of the runtimes the current
                  topology exposes for this device. It gives later topology-aware
                  orchestrators a stable read surface without moving execution out of
                  per-device workers.
                items:
                  description: |-
                    WorkerCapabilityStatus reports whether a device capability is active in
                    the current execution topology.
                  properties:
                    enabled:
                      description: Enabled is true when the current topology exposes
                        this capability.
                      type: boolean
                    message:
                      description: |-
                        Message is a short human-readable explanation for disabled or shifted
                        capabilities.
                      type: string
                    name:
                      description: Name is the stable capability key.
                      enum:
                      - apphosting
                      - config
                      - telemetry
                      - diagnostics
                      - operations
                      - lifecycle
                      type: string
                    runtime:
                      description: Runtime names the process topology that owns the
                        capability.
                      enum:
                      - per-device-worker
                      - manager-aggregator
                      type: string
                  required:
                  - enabled
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              workerTopology:
                description: |-
                  WorkerTopology records where device-local work is currently executed.
                  The production default is PerDevice: one horizontally scheduled CVK
                  worker owns apphosting, config, telemetry, diagnostics, and lifecycle
                  actions for this device. Aggregated is reserved for opt-in manager-side
                  config aggregation and must not be assumed by future orchestrators.
                enum:
                - PerDevice
                - Aggregated
                - None
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
