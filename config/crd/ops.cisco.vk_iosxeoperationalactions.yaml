---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: iosxeoperationalactions.ops.cisco.vk
spec:
  group: ops.cisco.vk
  names:
    kind: IOSXEOperationalAction
    listKind: IOSXEOperationalActionList
    plural: iosxeoperationalactions
    shortNames:
    - xeop
    singular: iosxeoperationalaction
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.deviceRef.name
      name: Device
      type: string
    - jsonPath: .spec.action.kind
      name: Kind
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IOSXEOperationalAction is a one-shot write-class operation against
          one IOS-XE device. The reconciler dispatches at most once: it does
          not retry on transient failure, because every kind is destructive
          or near-destructive (Reboot / FactoryReset / FileRemove / etc.).
          Failures are terminal; operators inspect device state before deciding
          whether a new CR is safe.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: IOSXEOperationalActionSpec declares a write-class operation.
            properties:
              action:
                description: Action is the requested action plus typed inputs.
                properties:
                  cancelReboot:
                    description: CancelReboot is the input for ActionKindCancelReboot.
                    properties:
                      message:
                        type: string
                    type: object
                  factoryReset:
                    description: FactoryReset is the input for ActionKindFactoryReset.
                    properties:
                      factoryOS:
                        type: boolean
                      retainCerts:
                        default: true
                        type: boolean
                      zeroFill:
                        type: boolean
                    type: object
                  filePut:
                    description: FilePut is the input for ActionKindFilePut.
                    properties:
                      configMapName:
                        description: |-
                          ConfigMapName names a ConfigMap in the same namespace whose
                          binaryData["content"] holds the bytes.
                        minLength: 1
                        type: string
                      path:
                        pattern: '^(flash|bootflash|harddisk|usbflash0|usbflash1):'
                        type: string
                      permissions:
                        description: Permissions is the UNIX octal mode (default 0o644).
                        format: int32
                        maximum: 511
                        type: integer
                    required:
                    - configMapName
                    - path
                    type: object
                  fileRemove:
                    description: FileRemove is the input for ActionKindFileRemove.
                    properties:
                      path:
                        pattern: '^(flash|bootflash|harddisk|usbflash0|usbflash1):'
                        type: string
                    required:
                    - path
                    type: object
                  killProcess:
                    description: KillProcess is the input for ActionKindKillProcess.
                    properties:
                      name:
                        type: string
                      pid:
                        format: int32
                        type: integer
                      restart:
                        type: boolean
                      signal:
                        default: TERM
                        enum:
                        - TERM
                        - KILL
                        - HUP
                        - ABRT
                        type: string
                    type: object
                  kind:
                    description: Kind names the action variant.
                    enum:
                    - Reboot
                    - CancelReboot
                    - KillProcess
                    - FilePut
                    - FileRemove
                    - FactoryReset
                    - ProvisionCertificate
                    type: string
                  reboot:
                    description: Reboot is the input for ActionKindReboot.
                    properties:
                      delaySeconds:
                        description: DelaySeconds before the reboot fires. Zero means
                          immediate.
                        format: int64
                        maximum: 604800
                        minimum: 0
                        type: integer
                      force:
                        type: boolean
                      message:
                        type: string
                      method:
                        default: COLD
                        enum:
                        - COLD
                        - NSF
                        - POWERDOWN
                        - HALT
                        - WARM
                        type: string
                    type: object
                required:
                - kind
                type: object
                x-kubernetes-validations:
                - message: kind Reboot requires only the reboot args block
                  rule: (self.kind == 'Reboot') == has(self.reboot)
                - message: kind CancelReboot requires only the cancelReboot args block
                  rule: (self.kind == 'CancelReboot') == has(self.cancelReboot)
                - message: kind KillProcess requires only the killProcess args block
                  rule: (self.kind == 'KillProcess') == has(self.killProcess)
                - message: kind FilePut requires only the filePut args block
                  rule: (self.kind == 'FilePut') == has(self.filePut)
                - message: kind FileRemove requires only the fileRemove args block
                  rule: (self.kind == 'FileRemove') == has(self.fileRemove)
                - message: kind FactoryReset requires only the factoryReset args block
                  rule: (self.kind == 'FactoryReset') == has(self.factoryReset)
              confirm:
                description: |-
                  Confirm must equal the target device's metadata.name. This is a
                  safety guard against operators applying an action against the
                  wrong device by typo (mirrors `kubectl drain --force` style).
                minLength: 1
                type: string
              deviceRef:
                description: DeviceRef targets the CiscoDevice the action runs against.
                properties:
                  name:
                    description: Name of the CiscoDevice the CR targets.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - action
            - confirm
            - deviceRef
            type: object
            x-kubernetes-validations:
            - message: IOSXEOperationalAction spec is immutable after creation
              rule: self == oldSelf
          status:
            description: IOSXEOperationalActionStatus carries observed state.
            properties:
              completionTime:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              failureReason:
                type: string
              invocationID:
                description: |-
                  InvocationID is set before the device-side RPC is dispatched. If the
                  controller crashes while phase=Running, the next reconcile treats the
                  action as already invoked and will not dispatch a second destructive RPC.
                type: string
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: ActionPhase reports the lifecycle state of an action.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                - Rejected
                type: string
              result:
                description: |-
                  Result holds structured device-side output where applicable
                  (e.g. RebootStatus snapshot post-CancelReboot). JSON-encoded.
                type: string
              startTime:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
