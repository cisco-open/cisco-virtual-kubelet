---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: networkcontrollers.cisco.vk
spec:
  group: cisco.vk
  names:
    kind: NetworkController
    listKind: NetworkControllerList
    plural: networkcontrollers
    shortNames:
    - netctrl
    singular: networkcontroller
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.endpoint
      name: Endpoint
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.controllerVersion
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NetworkController declares a controller endpoint and its connection
          policy.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NetworkControllerSpec declares one external network-controller endpoint.
              Controller type and endpoint are immutable because redirecting either in
              place would make existing status, task IDs, and ownership claims ambiguous.
            properties:
              connection:
                default: {}
                description: Connection configures neutral request and health-check
                  bounds.
                properties:
                  healthCheckInterval:
                    default: 1m
                    description: |-
                      HealthCheckInterval is the cadence for controller reachability checks and
                      must be in [30s, 24h].
                    type: string
                    x-kubernetes-validations:
                    - message: healthCheckInterval must be at least 30s and at most
                        24h
                      rule: duration(self) >= duration('30s') && duration(self) <=
                        duration('24h')
                  maxConcurrentRequests:
                    default: 4
                    description: MaxConcurrentRequests bounds in-flight calls for
                      this endpoint.
                    format: int32
                    maximum: 64
                    minimum: 1
                    type: integer
                  rateLimit:
                    description: RateLimit optionally overrides the adapter's endpoint
                      rate policy.
                    properties:
                      burst:
                        description: Burst is the maximum instantaneous request burst.
                        format: int32
                        maximum: 10000
                        minimum: 1
                        type: integer
                      requestsPerSecond:
                        description: RequestsPerSecond is the sustained request rate.
                        format: int32
                        maximum: 10000
                        minimum: 1
                        type: integer
                    required:
                    - burst
                    - requestsPerSecond
                    type: object
                  requestTimeout:
                    default: 30s
                    description: RequestTimeout bounds one controller API request
                      to (0s, 24h].
                    type: string
                    x-kubernetes-validations:
                    - message: requestTimeout must be greater than 0s and at most
                        24h
                      rule: duration(self) > duration('0s') && duration(self) <= duration('24h')
                type: object
              credentialSecretRef:
                description: |-
                  CredentialSecretRef names the controller credential Secret in this
                  NetworkController's namespace.
                properties:
                  name:
                    description: Name of the Secret.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              deviceAdoption:
                description: |-
                  DeviceAdoption opts the controller into turning its inventory into
                  standalone CiscoDevice objects. Omitted or disabled means inventory is
                  reported only.
                properties:
                  defaults:
                    description: Defaults apply to every adopted device that has no
                      scope override.
                    properties:
                      credentialSecretRef:
                        description: |-
                          CredentialSecretRef names the Secret copied to
                          CiscoDevice.spec.credentialSecretRef.
                        properties:
                          name:
                            description: Name of the Secret.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - name
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        description: |-
                          Labels are added to every adopted CiscoDevice, both in metadata.labels
                          (for kubectl selectors) and in spec.labels (projected onto the Node), for
                          example to group devices into upgrade waves. The adapter's own
                          nd.cisco.vk/ labels, the cisco.vk/ and kubernetes.io/ namespaces and
                          scheduling-topology keys are reserved. A label removed here is removed
                          from the devices the adapter manages.
                        maxProperties: 16
                        type: object
                      tls:
                        description: |-
                          TLS is copied to CiscoDevice.spec.tls. Omit to keep the CiscoDevice
                          default.
                        properties:
                          caFile:
                            description: CAFile is the path to the CA certificate
                              file.
                            type: string
                          caSecretRef:
                            description: |-
                              CASecretRef projects only ca.crt from a same-namespace Secret into both
                              per-device workers. It does not expose client or signer private keys.
                              Local-file and aggregator deployments must use CAFile instead.
                            properties:
                              name:
                                description: Name is the Secret in the CiscoDevice's
                                  namespace; ca.crt is required.
                                maxLength: 253
                                minLength: 1
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                type: string
                            required:
                            - name
                            type: object
                          certFile:
                            description: CertFile is the path to the client certificate
                              file.
                            type: string
                          enabled:
                            description: Enabled toggles TLS for device communication.
                            type: boolean
                          insecureSkipVerify:
                            description: InsecureSkipVerify disables TLS certificate
                              verification.
                            type: boolean
                          keyFile:
                            description: KeyFile is the path to the client key file.
                            type: string
                        required:
                        - enabled
                        type: object
                        x-kubernetes-validations:
                        - message: caSecretRef requires verified TLS and is mutually
                            exclusive with caFile
                          rule: '!has(self.caSecretRef) || (self.enabled && (!has(self.insecureSkipVerify)
                            || !self.insecureSkipVerify) && !has(self.caFile))'
                      username:
                        description: Username is the device login copied to CiscoDevice.spec.username.
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - credentialSecretRef
                    - username
                    type: object
                  enabled:
                    default: false
                    description: Enabled turns adoption on.
                    type: boolean
                  removal:
                    description: Removal controls devices whose switch has left the
                      inventory.
                    properties:
                      gracePeriod:
                        description: |-
                          GracePeriod is how long a device must stay missing, across refreshes,
                          before Prune deletes it. Defaults to 24h; between 10m and 720h.
                        type: string
                      maxPrunePercent:
                        description: |-
                          MaxPrunePercent is the guard against mass deletion: when more than this
                          percentage of the adopted devices are due for pruning at once (at least
                          one device is always allowed), nothing is deleted. Defaults to 25.
                        format: int32
                        maximum: 100
                        minimum: 1
                        type: integer
                      policy:
                        default: Retain
                        description: Policy is Retain (default) or Prune.
                        enum:
                        - Retain
                        - Prune
                        type: string
                    type: object
                  scopeOverrides:
                    description: ScopeOverrides replace default access fields per
                      scope.
                    items:
                      description: |-
                        NetworkControllerDeviceScopeOverride replaces selected access fields for the
                        devices in one controller-defined scope (a Nexus Dashboard fabric, for
                        example). Omitted fields inherit from spec.deviceAdoption.defaults.
                      properties:
                        credentialSecretRef:
                          description: CredentialSecretRef overrides the default credential
                            Secret.
                          properties:
                            name:
                              description: Name of the Secret.
                              maxLength: 253
                              minLength: 1
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                              type: string
                          required:
                          - name
                          type: object
                        labels:
                          additionalProperties:
                            type: string
                          description: |-
                            Labels are merged key by key over the default labels; a key set here
                            replaces the default value for devices in this scope.
                          maxProperties: 16
                          type: object
                        scope:
                          description: Scope is the controller-defined grouping name,
                            matched exactly.
                          maxLength: 64
                          minLength: 1
                          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
                          type: string
                        tls:
                          description: TLS overrides the default device TLS settings.
                          properties:
                            caFile:
                              description: CAFile is the path to the CA certificate
                                file.
                              type: string
                            caSecretRef:
                              description: |-
                                CASecretRef projects only ca.crt from a same-namespace Secret into both
                                per-device workers. It does not expose client or signer private keys.
                                Local-file and aggregator deployments must use CAFile instead.
                              properties:
                                name:
                                  description: Name is the Secret in the CiscoDevice's
                                    namespace; ca.crt is required.
                                  maxLength: 253
                                  minLength: 1
                                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                  type: string
                              required:
                              - name
                              type: object
                            certFile:
                              description: CertFile is the path to the client certificate
                                file.
                              type: string
                            enabled:
                              description: Enabled toggles TLS for device communication.
                              type: boolean
                            insecureSkipVerify:
                              description: InsecureSkipVerify disables TLS certificate
                                verification.
                              type: boolean
                            keyFile:
                              description: KeyFile is the path to the client key file.
                              type: string
                          required:
                          - enabled
                          type: object
                          x-kubernetes-validations:
                          - message: caSecretRef requires verified TLS and is mutually
                              exclusive with caFile
                            rule: '!has(self.caSecretRef) || (self.enabled && (!has(self.insecureSkipVerify)
                              || !self.insecureSkipVerify) && !has(self.caFile))'
                        username:
                          description: Username overrides the default device login.
                          maxLength: 128
                          minLength: 1
                          type: string
                      required:
                      - scope
                      type: object
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - scope
                    x-kubernetes-list-type: map
                type: object
                x-kubernetes-validations:
                - message: defaults is required when enabled is true
                  rule: '!self.enabled || has(self.defaults)'
              endpoint:
                description: |-
                  Endpoint is the immutable HTTPS base URL for one logical controller.
                  Credentials in URL userinfo are rejected by runtime validation. Create a
                  new NetworkController instead of redirecting task and ownership state to a
                  different endpoint.
                maxLength: 2048
                pattern: ^https://[^[:space:]]+$
                type: string
                x-kubernetes-validations:
                - message: endpoint must not contain URL userinfo, query, or fragment
                    components
                  rule: '!self.contains(''@'') && !self.contains(''?'') && !self.contains(''#'')'
              intentSecretSources:
                description: |-
                  IntentSecretSources is the controller-owned authorization allow-list for
                  sensitive values injected into Network as Code intent. Config resources
                  can reference these entries only by Alias; Secret names and keys remain
                  centralized on this endpoint object for review and worker-volume wiring.
                items:
                  description: |-
                    NetworkControllerIntentSecretSource authorizes one Secret key for use by
                    controller-centric Network as Code intent. NetworkControllerConfig objects
                    refer to Alias only; they can never broaden the worker's Secret access by
                    naming an arbitrary Secret or key themselves.

                    All references are implicitly in the NetworkController's namespace.
                  properties:
                    alias:
                      description: |-
                        Alias is the stable, non-sensitive name used by
                        NetworkControllerConfig.spec.secretRefs[].source.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z]([a-z0-9-]*[a-z0-9])?$
                      type: string
                    key:
                      description: Key selects one entry from Secret.data.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[-._a-zA-Z0-9]+$
                      type: string
                    name:
                      description: Name is the Secret in the same namespace as the
                        NetworkController.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                  required:
                  - alias
                  - key
                  - name
                  type: object
                maxItems: 128
                type: array
                x-kubernetes-list-map-keys:
                - alias
                x-kubernetes-list-type: map
              paused:
                default: false
                description: Paused stops external reconciliation while retaining
                  observed status.
                type: boolean
              preferredAPIVersion:
                description: |-
                  PreferredAPIVersion optionally pins an adapter-supported API version.
                  Empty requests adapter discovery and negotiation.
                maxLength: 128
                type: string
              tls:
                description: TLS controls controller server trust.
                properties:
                  caConfigMapRef:
                    description: |-
                      CAConfigMapRef selects a PEM CA bundle. When omitted, the system trust
                      store is used.
                    properties:
                      key:
                        description: Key containing the PEM-encoded CA bundle.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[-._a-zA-Z0-9]+$
                        type: string
                      name:
                        description: Name of the ConfigMap.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  insecureSkipVerify:
                    default: false
                    description: |-
                      InsecureSkipVerify disables server certificate verification. It exists
                      only for controlled lab migrations and defaults to false.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: insecureSkipVerify cannot be combined with caConfigMapRef
                  rule: '!has(self.caConfigMapRef) || !self.insecureSkipVerify'
              type:
                description: |-
                  Type selects a registered controller adapter, for example
                  catalyst-center or nso.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z]([a-z0-9-]*[a-z0-9])?$
                type: string
            required:
            - credentialSecretRef
            - endpoint
            - type
            type: object
            x-kubernetes-validations:
            - message: type is immutable
              rule: self.type == oldSelf.type
            - message: endpoint is immutable; create a new NetworkController for a
                different endpoint
              rule: self.endpoint == oldSelf.endpoint
          status:
            description: |-
              NetworkControllerStatus is the bounded observed state of a controller
              endpoint. It never contains credentials, tokens, or raw API responses.
            properties:
              apiVersion:
                description: APIVersion is the negotiated controller API version.
                maxLength: 128
                type: string
              capabilities:
                description: Capabilities is the adapter capability summary for this
                  endpoint.
                items:
                  description: NetworkControllerCapabilityStatus reports one optional
                    adapter capability.
                  properties:
                    message:
                      description: Message is a bounded, sanitized explanation.
                      maxLength: 512
                      type: string
                    name:
                      description: Name is a stable, low-cardinality capability key.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z]([a-z0-9-]*[a-z0-9])?$
                      type: string
                    supported:
                      description: Supported reports whether this endpoint exposes
                        the capability.
                      type: boolean
                  required:
                  - name
                  - supported
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              conditions:
                description: Conditions follows the standard Kubernetes conditions
                  shape.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configuration:
                description: |-
                  Configuration holds durable configuration ownership and the outstanding
                  controller mutation. Adapters which only observe inventory leave it nil.
                properties:
                  actionApplications:
                    description: |-
                      ActionApplications retain verified imperative executions after releasing
                      the operation slot. They prevent an unchanged intent from being replayed.
                    items:
                      description: |-
                        NetworkControllerConfigurationActionApplication records one verified action
                        using the same immutable source/target binding as its write-ahead operation.
                      properties:
                        effectReceipts:
                          description: |-
                            EffectReceipts are bounded adapter-defined proofs for related objects
                            changed by this same native operation. They never represent extra native
                            operations. Adapters must bind the complete set in the producer/result
                            contract and refuse settlement if that set is missing or altered.
                            Only public identities and keyed comparison evidence belong here, never
                            native payloads or credential values. Legacy receipts leave this nil.
                          items:
                            maxLength: 512
                            minLength: 1
                            type: string
                          maxItems: 256
                          type: array
                          x-kubernetes-list-type: set
                        operation:
                          description: |-
                            NetworkControllerConfigurationOperation is a write-ahead record. Submitting
                            is durable BEFORE the HTTP call; seeing it after a restart is not permission
                            to retry. Accepted is not success: authoritative read-back must verify it.
                          properties:
                            action:
                              enum:
                              - Create
                              - Update
                              - Delete
                              type: string
                            cancellationRequestedAt:
                              description: |-
                                CancellationRequestedAt fences a Prepared group against submission before
                                member cleanup. It never proves lease release or manager settlement.
                              format: date-time
                              type: string
                            configGeneration:
                              format: int64
                              minimum: 1
                              type: integer
                            configName:
                              maxLength: 253
                              minLength: 1
                              type: string
                            configUID:
                              maxLength: 128
                              minLength: 1
                              type: string
                            controllerGeneration:
                              description: |-
                                ControllerGeneration binds connection and credential policy, not just
                                the immutable endpoint. Changed policy cannot resume submission.
                              format: int64
                              minimum: 1
                              type: integer
                            createdResourceID:
                              description: |-
                                CreatedResourceID is the nonsecret UUID returned by a synchronous create.
                                It is response evidence, not a task ID or physical reservation identity.
                              maxLength: 128
                              type: string
                            credentialVersions:
                              description: |-
                                CredentialVersions binds explicit model write-only version counters to
                                the authorized source references submitted by this operation. These are
                                not secret values or hashes and do not themselves prove application.
                              items:
                                description: |-
                                  NetworkControllerConfigurationCredentialVersion identifies a requested
                                  write-only credential rotation without persisting credential material.
                                properties:
                                  key:
                                    description: |-
                                      Key is an optional non-secret semantic identity within the resource.
                                      It binds list credentials to stable model keys rather than array indices.
                                    maxLength: 128
                                    type: string
                                  path:
                                    description: Path is relative to the operation's
                                      managed section.
                                    maxLength: 1024
                                    minLength: 1
                                    pattern: ^/.*
                                    type: string
                                  secretKey:
                                    maxLength: 253
                                    minLength: 1
                                    type: string
                                  secretName:
                                    description: |-
                                      SecretName and SecretKey pin the administrator's alias mapping. The
                                      referenced Secret is in the NetworkController's namespace.
                                    maxLength: 253
                                    minLength: 1
                                    type: string
                                  sourceAlias:
                                    maxLength: 63
                                    minLength: 1
                                    type: string
                                  version:
                                    description: |-
                                      Version is the explicit positive NetAsCode write-only version counter.
                                      It is never inferred from credential bytes or filesystem metadata.
                                    format: int64
                                    minimum: 1
                                    type: integer
                                required:
                                - path
                                - secretKey
                                - secretName
                                - sourceAlias
                                - version
                                type: object
                              maxItems: 128
                              type: array
                              x-kubernetes-list-map-keys:
                              - path
                              x-kubernetes-list-type: map
                            dependencyVersions:
                              description: |-
                                DependencyVersions retains nonsecret native version bindings. Admission
                                is validated independently for supported physical operation kinds.
                              properties:
                                entries:
                                  items:
                                    description: |-
                                      NetworkControllerConfigurationDependencyVersion identifies one committed
                                      native object and version. Display names and template values are excluded.
                                    properties:
                                      id:
                                        maxLength: 128
                                        minLength: 1
                                        pattern: ^[A-Za-z0-9_-]+$
                                        type: string
                                      version:
                                        format: int64
                                        minimum: 1
                                        type: integer
                                      versionID:
                                        maxLength: 128
                                        minLength: 1
                                        pattern: ^[A-Za-z0-9_-]+$
                                        type: string
                                    required:
                                    - id
                                    - version
                                    - versionID
                                    type: object
                                  maxItems: 1001
                                  minItems: 2
                                  type: array
                                  x-kubernetes-list-type: atomic
                                kind:
                                  enum:
                                  - template-graph-v1
                                  type: string
                              required:
                              - entries
                              - kind
                              type: object
                            id:
                              maxLength: 32
                              pattern: ^[a-f0-9]{32}$
                              type: string
                            parentID:
                              description: ParentID pins the resolved parent of a
                                hierarchical resource.
                              maxLength: 128
                              type: string
                            phase:
                              enum:
                              - Prepared
                              - Submitting
                              - Accepted
                              - Verifying
                              - Verified
                              - Unknown
                              - Cancelling
                              type: string
                            physicalGroup:
                              description: |-
                                PhysicalGroup binds fabric-wide physical scope separately from TargetID,
                                which remains the native logical resource ID. Existing v1 physical paths
                                must reject this field; the group protocol is not yet runtime-enabled.
                              properties:
                                digest:
                                  description: Digest binds the operation's immutable
                                    fields and complete target set.
                                  pattern: ^[a-f0-9]{64}$
                                  type: string
                                targets:
                                  items:
                                    properties:
                                      device:
                                        properties:
                                          name:
                                            maxLength: 253
                                            minLength: 1
                                            type: string
                                          uid:
                                            maxLength: 128
                                            minLength: 1
                                            type: string
                                        required:
                                        - name
                                        - uid
                                        type: object
                                      inventoryID:
                                        maxLength: 128
                                        minLength: 1
                                        type: string
                                      node:
                                        properties:
                                          name:
                                            maxLength: 253
                                            minLength: 1
                                            type: string
                                          uid:
                                            maxLength: 128
                                            minLength: 1
                                            type: string
                                        required:
                                        - name
                                        - uid
                                        type: object
                                      physicalIdentity:
                                        maxLength: 128
                                        minLength: 1
                                        type: string
                                    required:
                                    - device
                                    - inventoryID
                                    - node
                                    - physicalIdentity
                                    type: object
                                  maxItems: 1000
                                  minItems: 1
                                  type: array
                                  x-kubernetes-list-map-keys:
                                  - physicalIdentity
                                  x-kubernetes-list-type: map
