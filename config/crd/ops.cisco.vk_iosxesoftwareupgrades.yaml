---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: iosxesoftwareupgrades.ops.cisco.vk
spec:
  group: ops.cisco.vk
  names:
    kind: IOSXESoftwareUpgrade
    listKind: IOSXESoftwareUpgradeList
    plural: iosxesoftwareupgrades
    shortNames:
    - xeupgrade
    singular: iosxesoftwareupgrade
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.deviceRef.name
      name: Device
      type: string
    - jsonPath: .spec.targetVersion
      name: Target
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.runningVersion
      name: Running
      type: string
    - jsonPath: .status.transferProgress.percent
      name: Progress
      priority: 1
      type: integer
    - jsonPath: .status.message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IOSXESoftwareUpgrade drives a multi-phase IOS-XE image upgrade via
          gNOI OS.Install / Activate / Verify. One CR represents one explicitly
          authorized upgrade operation against the referenced CiscoDevice.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: IOSXESoftwareUpgradeSpec declares an upgrade request.
            properties:
              deviceRef:
                description: DeviceRef targets the CiscoDevice the upgrade runs against.
                properties:
                  name:
                    description: Name of the CiscoDevice the CR targets.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              imageSource:
                description: |-
                  ImageSource selects how the target image enters the device install
                  lifecycle: transfer external bytes, use a preinstalled version, or
                  register a device-resident file.
                properties:
                  configMapRef:
                    description: |-
                      ConfigMapRef names a ConfigMap whose binaryData["image"] holds
                      the bytes. Capped at ~900 KiB by Kubernetes — testing only.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  deviceFile:
                    description: |-
                      DeviceFile identifies an image file already resident on the device.
                      The platform driver verifies its digest, registers it in the native
                      install inventory, and then hands the resulting exact version to the
                      generic gNOI activation lifecycle. This intent is supported only by
                      drivers that implement device-file registration.
                    properties:
                      path:
                        description: Path is an absolute platform filesystem path
                          to the image artifact.
                        maxLength: 128
                        pattern: ^(flash|bootflash|harddisk):.+$
                        type: string
                      sha256:
                        description: |-
                          SHA256 is the lowercase hex SHA-256 digest that must match the
                          device-resident file before any platform install operation is invoked.
                        pattern: ^[a-f0-9]{64}$
                        type: string
                    required:
                    - path
                    - sha256
                    type: object
                  localPath:
                    description: |-
                      LocalPath is the deprecated compatibility form for a preinstalled
                      image. It may be used only when TargetVersion is already registered in
                      the device install inventory. The path is never registered or passed to
                      a platform install command; use DeviceFile for that workflow. Path must
                      be an absolute IOS-XE filesystem path.
                      Deprecated: use Preinstalled to activate an installed version, or
                      DeviceFile to register a file resident on the device.
                    maxLength: 128
                    pattern: '^(flash|bootflash|harddisk):'
                    type: string
                  localPathSHA256:
                    description: |-
                      LocalPathSHA256 optionally verifies the legacy LocalPath file before
                      activation by reading it through gNOI File.Get. It does not cause the
                      file to be registered in the install inventory.
                      Deprecated: use DeviceFile.sha256 for device-file registration.
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  preinstalled:
                    description: |-
                      Preinstalled declares that TargetVersion is already registered in the
                      device install inventory and should only be activated. The reconciler
                      fails closed when it cannot confirm one exact activatable inventory
                      entry; this intent never transfers or registers an image.
                    type: object
                  sha256:
                    description: |-
                      SHA256 is the lowercase hex SHA-256 digest the reconciler asserts
                      after fetching the URL. Required when URL is set.
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  url:
                    description: |-
                      URL is a remote image URI the reconciler fetches before streaming
                      the bytes to the device with gNOI OS.Install. Supported schemes are
                      http, https, tftp, ftp, scp, and sftp. Required SHA256 verification
                      — declared via SHA256 below.
                    pattern: ^(https?|tftp|ftp|scp|sftp)://
                    type: string
                  urlSecretRef:
                    description: |-
                      URLSecretRef optionally names a Secret in the same namespace with
                      transfer credentials. To prevent credentials from being forwarded to an
                      endpoint chosen only by the upgrade author, the Secret must carry label
                      cisco.vk/purpose=software-image-source and data keys allowedScheme,
                      allowedHost, and allowedPort matching the URL's canonical endpoint. FTP
                      may use username/password; SCP and SFTP may use username/password or
                      username/privateKey/passphrase. SCP and SFTP host-key verification uses
                      knownHosts or known_hosts from this Secret unless the explicitly gated
                      insecureSkipHostKey option is enabled. URLs containing user information
                      are rejected; credentials must be supplied by an endpoint-bound Secret.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
                x-kubernetes-validations:
                - message: exactly one of url, configMapRef, preinstalled, deviceFile,
                    or localPath must be set
                  rule: '(has(self.url) ? 1 : 0) + (has(self.configMapRef) ? 1 : 0)
                    + (has(self.preinstalled) ? 1 : 0) + (has(self.deviceFile) ? 1
                    : 0) + (has(self.localPath) ? 1 : 0) == 1'
                - message: sha256 must be set if and only if url is set
                  rule: has(self.url) == has(self.sha256)
                - message: urlSecretRef may be set only when url is set
                  rule: '!has(self.urlSecretRef) || has(self.url)'
                - message: urlSecretRef.name must not be empty
                  rule: '!has(self.urlSecretRef) || self.urlSecretRef.name.size()
                    > 0'
                - message: urlSecretRef is supported only for ftp, scp, or sftp URLs
                  rule: '!has(self.urlSecretRef) || self.url.matches(''^(ftp|scp|sftp)://'')'
                - message: url must not contain user information; use an endpoint-bound
                    urlSecretRef
                  rule: '!has(self.url) || !self.url.matches(''^(https?|tftp|ftp|scp|sftp)://[^/?#]*@'')'
                - message: configMapRef.name must not be empty
                  rule: '!has(self.configMapRef) || self.configMapRef.name.size()
                    > 0'
                - message: localPathSHA256 may be set only when localPath is set
                  rule: '!has(self.localPathSHA256) || has(self.localPath)'
              installTimeoutSeconds:
                default: 3600
                description: |-
                  InstallTimeoutSeconds bounds two consecutive stages: first pre-install
                  gNOI readiness, source resolution, and device-file hash verification;
                  then, from the first OS.Install or native-registration claim, one shared
                  deadline for every per-supervisor install or registration and inventory
                  convergence. Default 3600.
                format: int32
                maximum: 86400
                minimum: 60
                type: integer
              maintenanceWindow:
                description: |-
                  MaintenanceWindow gates the start of lifecycle work and every device
                  mutation that has not yet been claimed. It cannot stop a mutation already
                  submitted or in flight.
                properties:
                  notAfter:
                    description: |-
                      NotAfter is the latest time the reconciler may claim a new device mutation.
                      Past this, the CR transitions to a terminal phase with reason
                      MaintenanceWindowExpired unless a previously claimed mutation still needs
                      read-only observation.
                    format: date-time
                    type: string
                  notBefore:
                    description: NotBefore is the earliest time the reconciler may
                      begin lifecycle work.
                    format: date-time
                    type: string
                type: object
                x-kubernetes-validations:
                - message: notBefore must be earlier than or equal to notAfter
                  rule: '!has(self.notBefore) || !has(self.notAfter) || self.notBefore
                    <= self.notAfter'
              maxRetries:
                default: 3
                description: |-
                  MaxRetries is retained for wire compatibility with earlier manifests.
                  The current at-most-once reconciler never retries a device mutation based
                  on this value.
                  Deprecated: retained for storage compatibility; ignored by the reconciler.
                format: int32
                maximum: 10
                minimum: 0
                type: integer
              rebootTimeoutSeconds:
                default: 1800
                description: |-
                  RebootTimeoutSeconds starts at the first activation claim and bounds the
                  complete activation, reachability, and final-verification sequence. A
                  rollback uses the same duration as an independent convergence deadline.
                  Default 1800.
                format: int32
                maximum: 86400
                minimum: 60
                type: integer
              resumePolicy:
                default: Retry
                description: |-
                  ResumePolicy is retained for wire compatibility with earlier manifests.
                  The current at-most-once reconciler never retries a device mutation based
                  on this value.
                  Deprecated: retained for storage compatibility; ignored by the reconciler.
                enum:
                - Retry
                - Abort
                type: string
              rollbackOnFailure:
                default: true
                description: |-
                  RollbackOnFailure, when true, attempts to reactivate the version
                  that was running before this upgrade began when post-Verify reports
                  a different version than TargetVersion. Default true.
                type: boolean
              strategy:
                default: Reload
                description: |-
                  Strategy controls whether Activate performs the reload itself
                  (default Reload), requests the currently unsupported ISSU strategy, or stages without
                  rebooting (NoReboot).
                enum:
                - Reload
                - ISSU
                - NoReboot
                type: string
              targetVersion:
                description: |-
                  TargetVersion is the version string the device's gNOI OS server
                  uses to identify the staged image. The reconciler:
                    - asserts the Validated message names this version
                    - passes it to gNOI OS.Activate as the version parameter
                    - cross-checks via OS.Verify in the Verifying phase

                  IOS-XE reports image versions in several shapes depending on the
                  release and CLI surface. Examples that this field accepts:
                    - "17.15.01a" (release-format)
                    - "26.01.01"  (build-number trimmed)
                    - "26.01.01.0.340" (full "show install summary" form)
                    - "17.18.02.0.4112.1766116039" (oper-data form)

                  The reconciler matches the device-reported version with a prefix-
                  aware comparison (Verify result == TargetVersion, or starts with
                  TargetVersion + "."), so operators may specify the shortest form
                  that's still unambiguous within the device's installed images.
                maxLength: 128
                pattern: ^[0-9]+(\.[0-9]+)+([a-z])?$
                type: string
            required:
            - deviceRef
            - imageSource
            - targetVersion
            type: object
            x-kubernetes-validations:
            - message: IOSXESoftwareUpgrade spec is immutable after creation
              rule: self == oldSelf
          status:
            description: IOSXESoftwareUpgradeStatus carries observed state.
            properties:
              activationControlStartTime:
                description: |-
                  ActivationControlStartTime bounds initial activation-client recovery by
                  RebootTimeoutSeconds without consuming the subsequent reboot deadline.
                  It is recorded on the first client-acquisition failure before activation.
                format: date-time
                type: string
              activationStartTime:
                description: |-
                  ActivationStartTime is when the first activation mutation was durably
                  recorded. RebootTimeoutSeconds is measured from it.
                format: date-time
                type: string
              completionTime:
                description: CompletionTime is when the reconciler entered a terminal
                  phase.
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions surface granular state. Type "Ready" follows the
                  standard "True/False/Unknown" convention; intermediate
                  conditions (e.g. "ImageResolved", "Transferred", "Activated",
                  "DeviceReachable", "Verified") are set as the state machine
                  advances.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              executionModel:
                description: |-
                  ExecutionModel is persisted before this reconciler advances a new or
                  safely adoptable workflow. Its absence on a released in-flight phase is
                  treated as an unknown device outcome and is never replayed. Unknown
                  non-empty values are preserved and fenced for controller downgrade safety.
                type: string
              failureReason:
                description: |-
                  FailureReason holds a short machine-readable reason on Failed /
                  PreflightFailed / ValidationFailed / RolledBack / RebootTimeout.
                type: string
              individualSupervisorInstall:
                description: |-
                  IndividualSupervisorInstall reports that gNOI requires the package to
                  be installed separately on each supervisor.
                type: boolean
              installStartTime:
                description: |-
                  InstallStartTime is when the first image-install or device-file staging
                  mutation was durably recorded. InstallTimeoutSeconds is measured from it.
                format: date-time
                type: string
              inventoryState:
                description: |-
                  InventoryState is the normalized device install-inventory state most
                  recently observed for TargetVersion.
                enum:
                - Absent
                - Present
                - Installed
                - ProvisionedUncommitted
                - ProvisionedCommitted
                - InProgress
                - Invalid
                - Unknown
                type: string
              managedMutationClaims:
                description: |-
                  ManagedMutationClaims binds every durable at-most-once mutation marker to
                  the reservation/control revision it claimed. The worker adds an entry in
                  the same resourceVersion update as the corresponding existing marker.
                items:
                  description: |-
                    UpgradeManagedMutationClaimStatus binds a durable worker mutation claim to
                    the exact reservation and manager-control revision it won against.
                  properties:
                    claimedAt:
                      description: ClaimedAt is persisted before dispatch and never
                        rewritten on recovery.
                      format: date-time
                      type: string
                    controlRevision:
                      description: |-
                        ControlRevision is committed in the same resourceVersion update as the
                        existing durable stage-request marker.
                      format: int64
                      minimum: 0
                      type: integer
                    policyEpoch:
                      description: |-
                        PolicyEpoch must exactly match the granted manager admission won by this
                        durable claim.
                      format: int64
                      minimum: 1
                      type: integer
                    reservationID:
                      description: ReservationID must equal managerAdmission.reservationID.
                      maxLength: 64
                      minLength: 1
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
                      type: string
                    stage:
                      description: Stage is the list-map key and claimed device mutation.
                      enum:
                      - Staging
                      - PrimaryInstall
                      - StandbyInstall
                      - StandbyActivation
                      - PrimaryActivation
                      - RollbackActivation
                      type: string
                  required:
                  - claimedAt
                  - controlRevision
                  - policyEpoch
                  - reservationID
                  - stage
                  type: object
                  x-kubernetes-validations:
                  - message: managed mutation claim identity is immutable
                    rule: self.reservationID == oldSelf.reservationID && self.policyEpoch
                      == oldSelf.policyEpoch && self.controlRevision == oldSelf.controlRevision
                      && self.claimedAt == oldSelf.claimedAt
                maxItems: 6
                type: array
                x-kubernetes-list-map-keys:
                - stage
                x-kubernetes-list-type: map
              managerAdmission:
                description: |-
                  ManagerAdmission is the manager-owned, identity-bound mutation grant for
                  a campaign-created leaf. On a managed device, absence is denial. Native
                  admission must prevent workers and ordinary editors from changing it.
                properties:
                  campaignUID:
                    description: CampaignUID identifies the retained IOSXESoftwareRollout
                      incarnation.
                    maxLength: 128
                    minLength: 1
                    type: string
                  controlRevision:
                    description: |-
                      ControlRevision is the minimum manager control revision a worker must
                      observe before claiming a new mutation.
                    format: int64
                    minimum: 0
                    type: integer
                  deviceGeneration:
                    description: |-
                      DeviceGeneration is the planned CiscoDevice generation. The worker
                      re-reads the object immediately before every new mutation claim so an
                      address, driver, port, trust-reference, or other spec change cannot inherit
                      an older campaign grant.
                    format: int64
                    minimum: 1
                    type: integer
                  deviceUID:
                    description: DeviceUID is the planned CiscoDevice incarnation.
                    maxLength: 128
                    minLength: 1
                    type: string
                  leafUID:
                    description: LeafUID prevents adoption of a recreated same-name
                      child.
                    maxLength: 128
                    minLength: 1
                    type: string
                  ledgerUID:
                    description: |-
                      LedgerUID freezes the single authoritative reservation-ledger
                      incarnation. A missing or recreated ledger freezes, rather than resets,
                      admission.
                    maxLength: 128
                    minLength: 1
                    type: string
                  nodeUID:
                    description: NodeUID is the planned identity-bound Node incarnation.
                    maxLength: 128
                    minLength: 1
                    type: string
                  physicalIdentity:
                    description: |-
                      PhysicalIdentity is the verified stable serial or equivalent identity
                      deduplicated by the reservation ledger.
                    maxLength: 128
                    minLength: 1
                    type: string
                  planHash:
                    description: PlanHash binds this leaf to the approved frozen campaign
                      plan.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  policyEpoch:
                    description: |-
                      PolicyEpoch is the durable rollout safety epoch. A worker acknowledgement
                      and every mutation claim must match it exactly.
                    format: int64
                    minimum: 1
                    type: integer
                  policyResourceVersion:
                    description: |-
                      PolicyResourceVersion is the approved effective policy version. A newer
                      current policy may only tighten this grant before a claim.
                    maxLength: 128
                    minLength: 1
                    type: string
                  policyUID:
                    description: |-
                      PolicyUID binds the grant to the administrator policy incarnation covered
                      by PlanHash.
                    maxLength: 128
                    minLength: 1
                    type: string
                  protocolVersion:
                    description: ProtocolVersion must match the current manager/worker
                      handshake.
                    enum:
                    - rollout-v1
                    type: string
                  reservationID:
                    description: ReservationID identifies the atomic device and domain
                      reservation.
                    maxLength: 64
                    minLength: 1
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
                    type: string
                  revocationReason:
                    description: |-
                      RevocationReason determines whether an unclaimed retained leaf may ever be
                      rearmed. Only PolicyEpochTransition is reversible.
                    enum:
                    - PolicyEpochTransition
                    - AdministratorPolicyChanged
                    - SourceIdentityChanged
                    - CampaignCancelled
                    - TargetIdentityChanged
                    - CampaignTargetFailed
                    type: string
                  state:
                    description: |-
                      State is Pending until ledger identity is bound, Granted while new claims
                      are authorized, Revoked when future claims are fenced, and Settled only
                      after accepted work and health evidence are resolved.
                    enum:
                    - Pending
                    - Granted
                    - Revoked
                    - Settled
                    type: string
                  topologyLockID:
                    description: |-
                      TopologyLockID is the exact manager acquisition that backs this
                      reservation. Retaining it after ledger removal makes settlement and
                      cleanup replayable across a crash without allowing an older cleanup to
                      target a later acquisition that reuses ReservationID.
                    pattern: ^[a-f0-9]{32}$
                    type: string
                  updatedAt:
                    description: UpdatedAt is the manager admission transition time.
                    format: date-time
                    type: string
                required:
                - deviceGeneration
                - policyEpoch
                - state
                - updatedAt
                type: object
                x-kubernetes-validations:
                - message: a granted admission requires the complete protocol, policy
                    epoch, topology-lock acquisition, and identity binding
                  rule: self.state != 'Granted' || (has(self.protocolVersion) && has(self.campaignUID)
                    && has(self.planHash) && has(self.policyUID) && has(self.policyResourceVersion)
                    && self.policyEpoch >= 1 && has(self.ledgerUID) && has(self.reservationID)
                    && has(self.topologyLockID) && has(self.leafUID) && has(self.deviceUID)
                    && has(self.physicalIdentity) && has(self.nodeUID) && has(self.controlRevision))
                - message: a pending admission requires its topology-lock acquisition
                    identity
                  rule: self.state != 'Pending' || has(self.topologyLockID)
                - message: campaignUID is immutable once set
                  rule: '!has(oldSelf.campaignUID) || self.campaignUID == oldSelf.campaignUID'
                - message: planHash is immutable once set
                  rule: '!has(oldSelf.planHash) || self.planHash == oldSelf.planHash'
                - message: policyUID is immutable once set
                  rule: '!has(oldSelf.policyUID) || self.policyUID == oldSelf.policyUID'
                - message: policyResourceVersion changes only when a policy-epoch
                    revocation is rearmed
                  rule: '!has(oldSelf.policyResourceVersion) || self.policyResourceVersion
                    == oldSelf.policyResourceVersion || (oldSelf.state == ''Revoked''
                    && has(oldSelf.revocationReason) && oldSelf.revocationReason ==
                    ''PolicyEpochTransition'' && self.state == ''Pending'' && self.policyEpoch
                    > oldSelf.policyEpoch)'
                - message: ledgerUID is immutable once set
                  rule: '!has(oldSelf.ledgerUID) || self.ledgerUID == oldSelf.ledgerUID'
                - message: reservationID is immutable once set
                  rule: '!has(oldSelf.reservationID) || self.reservationID == oldSelf.reservationID'
                - message: topologyLockID changes only when a policy-epoch revocation
                    is rearmed
                  rule: '!has(oldSelf.topologyLockID) || self.topologyLockID == oldSelf.topologyLockID
                    || (oldSelf.state == ''Revoked'' && has(oldSelf.revocationReason)
                    && oldSelf.revocationReason == ''PolicyEpochTransition'' && self.state
                    == ''Pending'' && self.policyEpoch > oldSelf.policyEpoch)'
                - message: leafUID is immutable once set
                  rule: '!has(oldSelf.leafUID) || self.leafUID == oldSelf.leafUID'
                - message: deviceUID is immutable once set
                  rule: '!has(oldSelf.deviceUID) || self.deviceUID == oldSelf.deviceUID'
                - message: physicalIdentity is immutable once set
                  rule: '!has(oldSelf.physicalIdentity) || self.physicalIdentity ==
                    oldSelf.physicalIdentity'
                - message: nodeUID is immutable once set
                  rule: '!has(oldSelf.nodeUID) || self.nodeUID == oldSelf.nodeUID'
                - message: protocolVersion is immutable once set
                  rule: '!has(oldSelf.protocolVersion) || self.protocolVersion ==
                    oldSelf.protocolVersion'
                - message: admission controlRevision cannot decrease or be removed
                  rule: '!has(oldSelf.controlRevision) || (has(self.controlRevision)
                    && self.controlRevision >= oldSelf.controlRevision)'
                - message: policy epoch cannot decrease
                  rule: self.policyEpoch >= oldSelf.policyEpoch
                - message: manager admission state cannot regress except a newer policy
                    epoch may rearm a policy-transition revocation
                  rule: 'oldSelf.state == ''Pending'' ? self.state in [''Pending'',
                    ''Granted'', ''Revoked''] : (oldSelf.state == ''Granted'' ? self.state
                    in [''Granted'', ''Revoked'', ''Settled''] : (oldSelf.state ==
                    ''Revoked'' ? (self.state in [''Revoked'', ''Settled''] || (self.state
                    == ''Pending'' && has(oldSelf.revocationReason) && oldSelf.revocationReason
                    == ''PolicyEpochTransition'' && self.policyEpoch > oldSelf.policyEpoch))
                    : self.state == ''Settled''))'
                - message: revoked admission requires a reason and non-revoked admission
                    must not retain one
                  rule: 'self.state == ''Revoked'' ? has(self.revocationReason) :
                    !has(self.revocationReason)'
              managerControl:
                description: |-
                  ManagerControl is manager-owned pause/cancel intent. A claim and a
                  revocation compete through resourceVersion on this same leaf object.
                properties:
                  cancel:
                    description: Cancel permanently blocks future claims for this
                      leaf.
                    type: boolean
                  pause:
                    description: Pause blocks new unclaimed mutations but cannot abort
                      accepted work.
                    type: boolean
                  reason:
                    description: Reason is a bounded machine-readable control reason.
                    maxLength: 128
                    type: string
                  revision:
                    description: |-
                      Revision is copied from the campaign control revision whose effect this
                      leaf must observe.
                    format: int64
                    minimum: 0
                    type: integer
                  updatedAt:
                    description: UpdatedAt is the manager control transition time.
                    format: date-time
                    type: string
                required:
                - revision
                - updatedAt
                type: object
                x-kubernetes-validations:
                - message: manager control revision cannot decrease
                  rule: self.revision >= oldSelf.revision
                - message: a manager control change requires a larger revision
                  rule: self == oldSelf || self.revision > oldSelf.revision
                - message: managed leaf cancellation is terminal
                  rule: '!has(oldSelf.cancel) || !oldSelf.cancel || (has(self.cancel)
                    && self.cancel)'
              message:
                description: |-
                  Message is the human-readable status message. Mirrored on the
                  Ready condition.
                type: string
              noRebootActivationAccepted:
                description: |-
                  NoRebootActivationAccepted records an affirmative OS.Activate response
                  for a NoReboot request so follow-up reachability checks can be retried
                  without replaying the mutation.
                type: boolean
              observedGeneration:
                description: ObservedGeneration mirrors spec.generation that produced
                  this status.
                format: int64
                type: integer
              phase:
                description: Phase is the current state-machine position.
                type: string
              previousVersion:
                description: |-
                  PreviousVersion is the device-reported OS version captured before
                  image activation. It is used as the rollback target when
                  RollbackOnFailure is enabled.
                type: string
              primarySupervisorActivationRequested:
                description: |-
                  PrimarySupervisorActivationRequested is a durable at-most-once marker set
                  before OS.Activate targets the active/primary supervisor. It is also used
                  for single-supervisor devices.
                type: boolean
              primarySupervisorInstallRequested:
                description: |-
                  PrimarySupervisorInstallRequested is a durable at-most-once marker set
                  before opening OS.Install for the active/primary supervisor. It is also
                  used for single-supervisor devices.
                type: boolean
              primarySupervisorInstalled:
                description: |-
                  PrimarySupervisorInstalled records successful installation on the
                  primary supervisor for restart-safe dual-supervisor retries.
                type: boolean
              retryCount:
                description: |-
                  RetryCount is retained for status wire compatibility with earlier
                  controllers. It is not incremented or used by the current reconciler.
                  Deprecated: retained for storage compatibility; ignored by the reconciler.
                format: int32
                type: integer
              rollbackActivationRequested:
                description: |-
                  RollbackActivationRequested is a durable at-most-once marker set before
                  OS.Activate targets PreviousVersion.
                type: boolean
              rollbackStartTime:
                description: |-
                  RollbackStartTime is when rollback recovery began. RebootTimeoutSeconds is
                  measured independently from it and includes pre-activation reachability.
                format: date-time
                type: string
              runningVersion:
                description: |-
                  RunningVersion is the device-reported running OS version after
                  Verifying.
                type: string
              sourceDigest:
                description: |-
                  SourceDigest is the algorithm-qualified content address of the image used
                  by this operation (for example, "sha256:<64 lowercase hex characters>").
                  It is persisted before a transfer or device-file staging side effect.
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              sourceSize:
                description: |-
                  SourceSize is the verified byte count persisted with SourceDigest for URL
                  and ConfigMap transfers. It remains zero for device-resident sources.
                format: int64
                minimum: 0
                type: integer
              stagingOperationID:
                description: |-
                  StagingOperationID is the durable correlation key for a platform-native
                  device-file registration operation. It is persisted before submission;
                  after an ambiguous response the reconciler observes but never replays it.
                format: uuid
                type: string
              stagingRequested:
                description: |-
                  StagingRequested is a durable at-most-once marker set before the native
                  device-file registration RPC is submitted.
                type: boolean
              standbySupervisorActivated:
                description: |-
                  StandbySupervisorActivated records that OS.Verify subsequently reported
                  the standby supervisor ready on TargetVersion.
                type: boolean
              standbySupervisorActivationRequested:
                description: |-
                  StandbySupervisorActivationRequested is a durable at-most-once marker set
                  before OS.Activate targets the standby supervisor.
                type: boolean
              standbySupervisorInstallRequested:
                description: |-
                  StandbySupervisorInstallRequested is a durable at-most-once marker set
                  before opening OS.Install for the standby supervisor.
                type: boolean
              standbySupervisorInstalled:
                description: |-
                  StandbySupervisorInstalled records successful installation on the
                  standby supervisor for restart-safe dual-supervisor retries.
                type: boolean
              startTime:
                description: StartTime is when the reconciler first transitioned out
                  of Pending.
                format: date-time
                type: string
              transferProgress:
                description: |-
                  TransferProgress reports cumulative bytes uploaded during the
                  Transferring phase. Preserved and marked complete after validation.
                properties:
                  bytesTransferred:
                    format: int64
                    type: integer
                  percent:
                    description: |-
                      Percent is BytesTransferred/TotalBytes×100, rounded down. Zero
                      when TotalBytes is unknown.
                    format: int32
                    type: integer
                  totalBytes:
                    format: int64
                    type: integer
                required:
                - bytesTransferred
                type: object
              validatedVersion:
                description: |-
                  ValidatedVersion is the exact device-reported OS version returned by
                  gNOI OS.Install Validated or resolved from native install inventory.
                  IOS XE may require this exact value on OS.Activate even when the
                  requested TargetVersion is a shorter release prefix.
                type: string
              workerControl:
                description: |-
                  WorkerControl is the worker-owned effective acknowledgement of manager
                  admission and control. Native admission must keep its ownership disjoint
                  from ManagerAdmission and ManagerControl.
                properties:
                  effectiveState:
                    description: |-
                      EffectiveState exposes whether pause/cancellation is effective or an
                      earlier claim must still be observed.
                    enum:
                    - Denied
                    - Ready
                    - Paused
                    - Cancelled
                    - Claimed
                    - Settled
                    type: string
                  message:
                    description: Message is a bounded worker acknowledgement summary.
                    maxLength: 256
                    type: string
                  observedAdmissionState:
                    description: ObservedAdmissionState is the manager admission state
                      read by the worker.
                    enum:
                    - Pending
                    - Granted
                    - Revoked
                    - Settled
                    type: string
                  observedControlRevision:
                    description: |-
                      ObservedControlRevision is the manager revision incorporated into the
                      worker's effective claim fence.
                    format: int64
                    minimum: 0
                    type: integer
                  observedPolicyEpoch:
                    description: |-
                      ObservedPolicyEpoch is the exact manager admission epoch acknowledged by
                      this worker state.
                    format: int64
                    minimum: 1
                    type: integer
                  observedWorkerConfigRevision:
                    description: |-
                      ObservedWorkerConfigRevision is the running worker revision that
                      acknowledged this admission. The rollout manager compares it with the
                      CiscoDevice's current live worker proof before granting; it is deliberately
                      not frozen in managerAdmission so an in-place Secret rotation can converge.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  updatedAt:
                    description: UpdatedAt is the last effective-state observation
                      time.
                    format: date-time
                    type: string
                required:
                - effectiveState
                - observedAdmissionState
                - observedControlRevision
                - observedPolicyEpoch
                - observedWorkerConfigRevision
                - updatedAt
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
