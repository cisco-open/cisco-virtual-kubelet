theme:
  name: material
  font: false
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  features:
  - content.code.copy
  - search.share
  - navigation.footer
  - navigation.instant.progress
  - navigation.tabs
  - navigation.sections
  - content.code.annotate
extra_css:
- stylesheets/extra.css
extra:
  homepage: /cisco-virtual-kubelet/
plugins:
- search
docs_dir: docs
site_dir: site
exclude_docs: |
  website/
# Individual generated family pages are linked from the generated README index.
not_in_nav: |
  reference/families/*.md
  operations.md
use_directory_urls: true
