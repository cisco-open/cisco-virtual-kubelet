site_name: Cisco Virtual Kubelet
copyright: Copyright © 2025-2026 Cisco Open. All Rights Reserved.
site_url: https://cisco-open.github.io/cisco-virtual-kubelet/docs
site_description: 'A Virtual Kubelet provider that enables Kubernetes to schedule container workloads on Cisco Catalyst series switches and IOS-XE devices with App-Hosting capabilities.'

repo_name: cisco-open/cisco-virtual-kubelet
repo_url: https://github.com/cisco-open/cisco-virtual-kubelet
edit_uri: ""

markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- attr_list
- md_in_html
- footnotes
- pymdownx.critic
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format ""
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji ""
    emoji_generator: !!python/name:material.extensions.emoji.to_svg ""
nav:
- Welcome: 'index.md'
- Getting Started: 'getting-started.md'
- Architecture: 'ARCHITECTURE.md'
- Configuration:
  - Reference: 'CONFIGURATION.md'
  - CRD Reference: 'crds.md'
  - Family Reference: 'reference/families/README.md'
  - Catalyst 8000V: 'configuration-cat8000v.md'
  - Catalyst 9000: 'configuration-cat9000.md'
  - YANG Version Support: 'yang-version-support.md'
  - Environment Variables: 'environment-variables.md'
- 'gNOI & Software Lifecycle':
  - Overview: 'gnoi-software-lifecycle.md'
- Operations:
  - Operations Runbook: 'operations.md'
  - Lifecycle: 'lifecycle.md'
  - Telemetry: 'telemetry.md'
  - Telemetry Cardinality: 'telemetry-cardinality.md'
  - Observability: 'observability.md'
  - Troubleshooting: 'troubleshooting.md'
- Security: 'security.md'
- API Reference: 'API.md'
theme:
  name: material
  features:
  - content.code.copy
  - search.share
  - navigation.footer
  - navigation.instant.progress
  - content.code.annotate
extra:
  homepage: /cisco-virtual-kubelet/
plugins:
- search
docs_dir: docs
site_dir: site
exclude_docs: |
  website/
  cvk-unified-architecture-plan.md
  family-parity.md
  gnoi-pilot-c9k4-upgrade-evidence.md
  netascode-migration.md
  telemetry-branch-review.md
  telemetry-trace-convergence-roadmap.md
  yang-version-transition.md
use_directory_urls: true
