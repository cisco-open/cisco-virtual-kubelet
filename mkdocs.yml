site_name: Cisco Virtual Kubelet
copyright: >-
  Copyright © 2025-2026 Cisco Systems, Inc. All Rights Reserved. ·
  <a href="/cisco-virtual-kubelet/LICENSE">Project license</a> ·
  <a href="/cisco-virtual-kubelet/docs/MKDOCS_THIRD_PARTY_LICENSES.txt">MkDocs third-party licenses</a>
site_url: https://cisco-open.github.io/cisco-virtual-kubelet/docs/
site_description: 'A Virtual Kubelet provider for App-Hosting workloads on Cisco IOS-XE devices, with Beta support for Cisco Nexus NX-OS switches.'

repo_name: cisco-open/cisco-virtual-kubelet
repo_url: https://github.com/cisco-open/cisco-virtual-kubelet
edit_uri: ""
hooks:
- .github/scripts/mkdocs_hooks.py

markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- attr_list
- md_in_html
- footnotes
- pymdownx.critic
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format ""
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji ""
    emoji_generator: !!python/name:material.extensions.emoji.to_svg ""
