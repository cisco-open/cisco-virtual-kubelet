name: yang-drift

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  check-1718:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Vendor latest upstream 1718 YANG
        run: |
          latest="$(git ls-remote https://github.com/YangModels/yang.git HEAD | awk '{print $1}')"
          YANG_MODELS_COMMIT="${latest}" make vendor-yang RELEASE=1718

      - name: Diff checked-in YANG
        run: |
          git diff -- internal/drivers/iosxe/configdriver/schema/yang/1718 \
            ':(exclude)internal/drivers/iosxe/configdriver/schema/yang/1718/.provenance.yaml' \
            > yang-drift.diff || true
          if [ -s yang-drift.diff ]; then
            echo "YANG drift detected against latest YangModels/yang HEAD."
            git diff --stat -- internal/drivers/iosxe/configdriver/schema/yang/1718 \
              ':(exclude)internal/drivers/iosxe/configdriver/schema/yang/1718/.provenance.yaml'
            exit 1
          fi
          echo "No YANG drift detected."

      - name: Upload drift diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yang-drift-1718
          path: yang-drift.diff
          if-no-files-found: ignore
