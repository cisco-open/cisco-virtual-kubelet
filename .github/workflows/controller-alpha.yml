name: controller-alpha

on:
  pull_request:
    branches: [main, pr/moskrive/nd-support]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: controller-alpha-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-api:
    name: controller API (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        package: [catalystcenter, controllerconfiguration, runtime-identity]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.9'
          cache: true
      - name: Install pinned Helm for admission fixtures
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4
      - name: Install pinned Kubernetes API test runtime
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.0.0-20260305142021-f9589b9f2b9d
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.35.0 -p path)" >> "$GITHUB_ENV"
      - name: Select package
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          case "$PACKAGE" in
            catalystcenter) echo 'TEST_PACKAGE=./internal/controlleradapter/catalystcenter/' >> "$GITHUB_ENV" ;;
            controllerconfiguration) echo 'TEST_PACKAGE=./internal/controllerconfiguration/' >> "$GITHUB_ENV" ;;
            runtime-identity) echo 'TEST_PACKAGE=./cmd/cisco-vk/' >> "$GITHUB_ENV" ;;
            *) exit 1 ;;
          esac
      - name: Enforce controller configuration and actor admission
        run: |
          set -euo pipefail
          go test -tags envtest -count=1 -timeout=60m -json "$TEST_PACKAGE" \
            -run '^(TestEnvtest|TestMetadataHandoffActorAdmission|TestBootstrapFenceAdmission|TestReservationAdmission|TestConfigurationLeaseAdmission)' \
            | tee controller-api.jsonl
      - name: Preserve gate output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controller-api-${{ matrix.package }}
          path: controller-api.jsonl
          if-no-files-found: warn
          retention-days: 14
