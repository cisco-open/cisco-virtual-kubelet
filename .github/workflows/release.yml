# Release pipeline: build, scan, push, sign, attest.
#
# Triggers on tags v* so the smoke workflow doesn't have to do the
# heavy lifting on every push. The job produces:
#
#   - A multi-arch container image at
#     ghcr.io/${{ github.repository }}:<tag>
#   - A CycloneDX SBOM staged as a draft release asset
#   - A keyless cosign signature on the image (Sigstore Fulcio)
#   - A SLSA-style provenance attestation via cosign attest
#   - A Trivy vulnerability scan report for HIGH/CRITICAL findings
#   - Reproducible kubectl-ciscovk archives for Linux and macOS (amd64/arm64)
#   - Per-platform plugin SBOMs, keyless signatures, and GitHub provenance
#
# Why keyless signing instead of a long-lived signing key: cosign's
# OIDC flow with the GitHub Actions identity gives every signature a
# verifiable provenance trail (this workflow, this commit, this run)
# without any KMS or secret rotation overhead. Verification looks
# like:
#
#   cosign verify ghcr.io/<repo>:<tag> \
#     --certificate-identity-regexp "https://github.com/<repo>/.github/workflows/release.yml@refs/tags/v.*" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Fail before pushing mutable image/chart tags when this tag already has a
  # published release. An absent release is allowed because the curated draft
  # may be created while the build is running; final staging still requires it.
  release-preflight:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require release to be absent or draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[1-9][0-9]{3}\.([1-9]|1[0-2])\.(0|[1-9][0-9]{0,8})$ ]] || {
            echo "::error::Release tag must be strict SemVer-compatible CalVer (for example v2026.9.0)"
            exit 1
          }
          remote_commit="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_VERSION}" --jq .sha
          )"
          test "$remote_commit" = "$RELEASE_COMMIT"
          releases="$RUNNER_TEMP/releases.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$releases"
          jq -e --arg tag "$RELEASE_VERSION" '
            [ .[][] | select(.tag_name == $tag) ] as $matching
            | (($matching | length) <= 1)
              and (
                ($matching | length) == 0
                or (
                  $matching[0].draft == true
                  and $matching[0].published_at == null
                )
              )
          ' "$releases" > /dev/null || {
            echo "::error::Release ${RELEASE_VERSION} is already published or duplicated"
            exit 1
          }

  build-and-sign:
    needs: release-preflight
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Native cross-compilation (see Dockerfile) keeps this well under 30m, but
    # leave headroom for the Trivy scan, SBOM generation, and cosign round-trips.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write       # push the multi-arch image
      id-token: write       # cosign keyless signing
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign and attest BEFORE scanning. The image is already pushed by the
      # build step above, so the vulnerability scan is advisory, not a gate.
      # Running it ahead of signing only means a scanner outage can leave a
      # published image unsigned — which is exactly what happened on the first
      # v2026.06.1 build (setup-trivy failed on the binary download and skipped
      # the cosign steps). Signing first guarantees every published image
      # carries a signature + SBOM attestation regardless of the scanner.
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          # This workflow stages the exact SBOM explicitly below. Disable the
          # action defaults so a tag build cannot mutate the curated draft or
          # create a second workflow artefact outside the release allowlist.
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.4.1

      - name: Keyless sign image
        env:
          COSIGN_EXPERIMENTAL: 'true'
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Attach SBOM as cosign attestation
        env:
          COSIGN_EXPERIMENTAL: 'true'
        run: |
          cosign attest --yes \
            --type cyclonedx \
            --predicate sbom.cdx.json \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Upload SBOM as workflow artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom.cdx.json
          retention-days: 90

      # Advisory vulnerability scan, runs last and never blocks the signed
      # release (continue-on-error). trivy-action bundles install + scan +
      # SARIF output, replacing the setup-trivy@v0.2.6 binary download that
      # broke the release build. HIGH/CRITICAL findings still surface in the
      # code-scanning tab; hard gating belongs in pre-merge CI, not after the
      # image has already been pushed and signed.
      - name: Scan image for HIGH/CRITICAL CVEs
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true

      - name: Upload Trivy SARIF to code-scanning
        if: always() && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e60ea984bd3baa95954f2856bcf24f9eaba46637 # v3.37.5
        with:
          sarif_file: trivy.sarif

  # Build release archives in one pinned environment so every platform shares
  # the same source, Go toolchain, commit timestamp, and checksum manifest.
  # This job cannot mutate a GitHub Release.
  package-plugin:
    needs: release-preflight
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      source-date-epoch: ${{ steps.metadata.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pinned Python archive toolchain
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.14'

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.12'
          cache: true

      - name: Derive reproducible build metadata
        id: metadata
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "$RELEASE_COMMIT")"
          python3 .github/scripts/package_kubectl_ciscovk.py package --help > /dev/null
          echo "source_date_epoch=${source_date_epoch}" >> "$GITHUB_OUTPUT"

      - name: Build deterministic plugin archives
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ github.ref_name }}
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          python3 .github/scripts/package_kubectl_ciscovk.py package \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --dist-dir dist/kubectl-ciscovk \
            --build-dir build/kubectl-ciscovk

      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.50.0

      - name: Generate per-platform CycloneDX SBOMs
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            "$SYFT" "file:build/kubectl-ciscovk/${target}/kubectl-ciscovk" \
              -o "cyclonedx-json=dist/kubectl-ciscovk/kubectl-ciscovk_${RELEASE_VERSION}_${target}.sbom.cdx.json"
          done

      - name: Generate and verify checksums
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 .github/scripts/package_kubectl_ciscovk.py checksums \
            --version "$RELEASE_VERSION" \
            --dist-dir dist/kubectl-ciscovk \
            --require-sboms

      - name: Upload unsigned plugin artifacts for verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubectl-ciscovk-unsigned-${{ github.ref_name }}
          path: dist/kubectl-ciscovk
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  # Execute the exact downloadable archive on every platform/architecture we
  # publish, then install that same archive through Krew and execute the
  # Krew-created plugin alias. Windows stays intentionally absent until an
  # equivalent native gate is added.
  verify-plugin:
    needs: package-plugin
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target_os: linux
            target_arch: amd64
          - runner: ubuntu-24.04-arm
            target_os: linux
            target_arch: arm64
          - runner: macos-15-intel
            target_os: darwin
            target_arch: amd64
          - runner: macos-15
            target_os: darwin
            target_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pinned Python verifier
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.14'

      - name: Set up pinned Go for Krew
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.12'
          cache: false

      - name: Download exact plugin artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kubectl-ciscovk-unsigned-${{ github.ref_name }}
          path: dist/kubectl-ciscovk

      - name: Verify and execute packaged plugin
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ github.ref_name }}
          SOURCE_DATE_EPOCH: ${{ needs.package-plugin.outputs.source-date-epoch }}
          TARGET_ARCH: ${{ matrix.target_arch }}
          TARGET_OS: ${{ matrix.target_os }}
        run: |
          python3 .github/scripts/package_kubectl_ciscovk.py verify \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --target-os "$TARGET_OS" \
            --target-arch "$TARGET_ARCH" \
            --dist-dir dist/kubectl-ciscovk \
            --require-sboms \
            --execute

      - name: Krew-install and execute packaged plugin
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ github.ref_name }}
          TARGET_ARCH: ${{ matrix.target_arch }}
          TARGET_OS: ${{ matrix.target_os }}
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/krew-tools"
          manifest="$RUNNER_TEMP/krew-manifest/cisco-vk.yaml"
          krew_root="$RUNNER_TEMP/krew-root"
          archive="dist/kubectl-ciscovk/kubectl-ciscovk_${RELEASE_VERSION}_${TARGET_OS}_${TARGET_ARCH}.tar.gz"
          checksums="dist/kubectl-ciscovk/kubectl-ciscovk_${RELEASE_VERSION}_checksums.txt"
          mkdir -p "$tool_dir" "$(dirname "$manifest")"

          python3 .github/scripts/render_krew_manifest.py \
            --release-tag "$RELEASE_VERSION" \
            --checksums "$checksums" \
            --output "$manifest"
          env GOBIN="$tool_dir" \
            go install sigs.k8s.io/krew/cmd/krew@v0.4.5

          KREW_NO_UPGRADE_CHECK=1 \
            KREW_ROOT="$krew_root" \
            KREW_OS="$TARGET_OS" \
            KREW_ARCH="$TARGET_ARCH" \
            "$tool_dir/krew" install \
              --manifest "$manifest" \
              --archive "$archive"
          alias="$krew_root/bin/kubectl-cisco_vk"
          test -L "$alias"
          test -x "$alias"
          version_output="$("$alias" version)"
          grep -F \
            "kubectl-ciscovk ${RELEASE_VERSION} (commit=${RELEASE_COMMIT}," \
            <<< "$version_output"

  # Sign only after all four exact archives execute successfully. This job can
  # mint OIDC identities and attestations, but it cannot mutate a release.
  sign-plugin:
    needs: [package-plugin, verify-plugin]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pinned Python verifier
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.14'

      - name: Download verified plugin artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kubectl-ciscovk-unsigned-${{ github.ref_name }}
          path: dist/kubectl-ciscovk

      - name: Install pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Keyless sign archives and checksum manifest
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            archive="dist/kubectl-ciscovk/kubectl-ciscovk_${RELEASE_VERSION}_${target}.tar.gz"
            cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"
            cosign verify-blob \
              --bundle "${archive}.sigstore.json" \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$archive"
          done
          checksums="dist/kubectl-ciscovk/kubectl-ciscovk_${RELEASE_VERSION}_checksums.txt"
          cosign sign-blob --yes --bundle "${checksums}.sigstore.json" "$checksums"
          cosign verify-blob \
            --bundle "${checksums}.sigstore.json" \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$checksums"

      - name: Generate GitHub build provenance
        id: provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/kubectl-ciscovk/kubectl-ciscovk_${{ github.ref_name }}_checksums.txt
          create-storage-record: false

      - name: Add provenance bundle to release assets
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" \
            "dist/kubectl-ciscovk/kubectl-ciscovk_${RELEASE_VERSION}_provenance.sigstore.json"
          python3 .github/scripts/package_kubectl_ciscovk.py verify-assets \
            --version "$RELEASE_VERSION" \
            --dist-dir dist/kubectl-ciscovk

      - name: Upload signed plugin release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubectl-ciscovk-release-${{ github.ref_name }}
          path: dist/kubectl-ciscovk
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  # Package the Helm chart and push it to GHCR as an OCI artifact, so users can
  #   helm install cvk oci://ghcr.io/<owner>/charts/cisco-virtual-kubelet --version <ver>
  # Runs after the image is built and signed so the chart never ships ahead of
  # the image it deploys. Chart version is the tag normalised to SemVer
  # (2026.06.1 -> 2026.6.1, since leading zeros are invalid SemVer); appVersion
  # keeps the released image tag, which the chart uses as the default image tag.
  publish-chart:
    needs: build-and-sign
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless signing of the chart artifact
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.2

      - name: Log in to ghcr.io (Helm OCI registry)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      # cosign reads ~/.docker/config.json, which `helm registry login` does not
      # write — so the chart signature push needs a docker-style login too.
      # Without this the Keyless sign chart step fails with UNAUTHORIZED even
      # though the chart push above succeeds.
      - name: Log in to ghcr.io (Docker config for cosign)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive chart and app versions from the tag
        id: ver
        run: |
          raw="${GITHUB_REF_NAME#v}"
          chart="$(echo "$raw" | awk -F. '{printf "%d.%d.%d", $1, $2, $3}')"
          echo "chart=$chart" >> "$GITHUB_OUTPUT"
          echo "app=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          helm package charts/cisco-virtual-kubelet \
            --version "${{ steps.ver.outputs.chart }}" \
            --app-version "${{ steps.ver.outputs.app }}" \
            --destination dist

      - name: Push chart to GHCR (OCI)
        id: push
        run: |
          helm push "dist/cisco-virtual-kubelet-${{ steps.ver.outputs.chart }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts" 2>&1 | tee push.log
          echo "digest=$(awk '/Digest:/ {print $2}' push.log)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.4.1

      - name: Keyless sign chart
        env:
          COSIGN_EXPERIMENTAL: 'true'
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/cisco-virtual-kubelet@${{ steps.push.outputs.digest }}"

  # The sole GitHub Release-write boundary. It waits for the image pipeline,
  # signed chart, native plugin verification, and plugin attestations. It fails
  # closed unless a draft already exists and confirms that upload did not
  # publish it.
  stage-plugin-release:
    needs: [publish-chart, sign-plugin]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python verifier
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.14'

      - name: Download signed plugin release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kubectl-ciscovk-release-${{ github.ref_name }}
          path: dist/kubectl-ciscovk

      - name: Download exact image SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-${{ github.ref_name }}
          path: dist/image-sbom

      - name: Verify exact asset allowlist
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 .github/scripts/package_kubectl_ciscovk.py verify-assets \
            --version "$RELEASE_VERSION" \
            --dist-dir dist/kubectl-ciscovk

      - name: Attach release assets without publishing the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 "$RELEASE_VERSION")" = "$RELEASE_COMMIT"
          test "$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_VERSION}" --jq .sha
          )" = "$RELEASE_COMMIT"
          resolve_draft_release_id() {
            local release_pages="$RUNNER_TEMP/releases.json"
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              > "$release_pages"
            jq -er --arg tag "$RELEASE_VERSION" '
              [ .[][] | select(.tag_name == $tag) ] as $matching
              | select(($matching | length) == 1)
              | select(
                  $matching[0].draft == true
                  and $matching[0].prerelease == false
                  and $matching[0].published_at == null
                )
              | $matching[0].id
            ' "$release_pages"
          }
          release_id="$(resolve_draft_release_id)"
          assert_draft() {
            test "$(resolve_draft_release_id)" = "$release_id"
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              | jq -e --argjson id "$release_id" --arg tag "$RELEASE_VERSION" \
                '.id == $id
                 and .tag_name == $tag
                 and .draft == true
                 and .prerelease == false
                 and .published_at == null' \
                > /dev/null
          }
          assert_draft
          image_sbom="dist/image-sbom/sbom.cdx.json"
          mapfile -t image_assets < <(find dist/image-sbom -maxdepth 1 -type f -print | LC_ALL=C sort)
          test "${#image_assets[@]}" -eq 1
          test "${image_assets[0]}" = "$image_sbom"
          test -s "$image_sbom"
          jq -e '
            .bomFormat == "CycloneDX"
            and (.specVersion | type == "string")
            and (.metadata.component | type == "object")
            and (.metadata.component.name | type == "string")
            and (.metadata.component.name | length > 0)
          ' "$image_sbom" > /dev/null
          mapfile -t plugin_assets < <(find dist/kubectl-ciscovk -maxdepth 1 -type f -print | LC_ALL=C sort)
          test "${#plugin_assets[@]}" -eq 15
          assets=("${plugin_assets[@]}" "$image_sbom")
          test "${#assets[@]}" -eq 16
          expected_metadata="$RUNNER_TEMP/expected-release-assets.tsv"
          before_metadata="$RUNNER_TEMP/before-release-assets.tsv"
          remote_metadata="$RUNNER_TEMP/remote-release-assets.tsv"
          for asset in "${assets[@]}"; do
            printf '%s\t%s\tsha256:%s\tuploaded\n' \
              "$(basename "$asset")" \
              "$(stat -c %s "$asset")" \
              "$(sha256sum "$asset" | awk '{print $1}')"
          done | LC_ALL=C sort > "$expected_metadata"
          test "$(wc -l < "$expected_metadata")" -eq 16

          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --jq '.assets[] | [.name, (.size | tostring), .digest, .state] | @tsv' \
            | LC_ALL=C sort > "$before_metadata"
          test "$(wc -l < "$before_metadata")" -le 16
          test -z "$(comm -23 "$before_metadata" "$expected_metadata")"

          upload_url="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              --jq '.upload_url | sub("\\{.*$"; "")'
          )"
          test "$upload_url" = \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets"
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            metadata="$(
              printf '%s\t%s\tsha256:%s\tuploaded' \
                "$name" \
                "$(stat -c %s "$asset")" \
                "$(sha256sum "$asset" | awk '{print $1}')"
            )"
            if ! grep -Fqx -- "$metadata" "$before_metadata"; then
              assert_draft
              encoded_name="$(jq -nr --arg name "$name" '$name | @uri')"
              response="$RUNNER_TEMP/upload-${name}.json"
              curl --fail-with-body --silent --show-error \
                --request POST \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header 'X-GitHub-Api-Version: 2026-03-10' \
                --header 'Content-Type: application/octet-stream' \
                --data-binary "@${asset}" \
                "${upload_url}?name=${encoded_name}" > "$response"
              jq -e \
                --arg name "$name" \
                --arg digest "$(printf '%s' "$metadata" | cut -f3)" \
                --argjson size "$(stat -c %s "$asset")" '
                  .name == $name
                  and .digest == $digest
                  and .size == $size
                  and .state == "uploaded"
                ' "$response" > /dev/null
              assert_draft
            fi
          done

          assert_draft
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --jq '.assets[] | [.name, (.size | tostring), .digest, .state] | @tsv' \
            | LC_ALL=C sort > "$remote_metadata"
          test "$(wc -l < "$remote_metadata")" -eq 16
          diff -u "$expected_metadata" "$remote_metadata"
          assert_draft
