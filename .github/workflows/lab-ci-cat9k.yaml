# Trusted, cisco-open-native wrapper for the physical cat9k-pr-test Argo
# WorkflowTemplate. The workflow must be dispatched from main. GitHub-hosted
# jobs validate the PR and own all GitHub writes; the credentialed lab runner
# receives the verified prospective merge SHA and a read-only token for its
# final pre-submission revalidation.
name: Lab CI (Cat9k)
run-name: >-
  Lab CI Cat9k - ${{ inputs.cvk_lifecycle_id }} -
  ${{ inputs.dispatch_id }} - ${{ inputs.cvk_upstream_traceparent }}

on:
  workflow_dispatch:
    inputs:
      upstream_pr:
        description: "Open PR number to validate"
        required: true
        type: number
      expected_head_sha:
        description: "Approved PR head SHA pinned by the trusted dispatcher"
        required: true
        type: string
      expected_base_sha:
        description: "Current main SHA pinned by the trusted dispatcher"
        required: true
        type: string
      expected_merge_sha:
        description: "Prospective merge SHA pinned by the trusted dispatcher"
        required: true
        type: string
      dispatch_attempt:
        description: "Bounded automatic dispatch attempt"
        required: true
        type: number
      dispatch_id:
        description: "Deterministic dispatcher correlation ID"
        required: true
        type: string
      cvk_lifecycle_id:
        description: "Stable CVK PR lifecycle correlation ID"
        required: true
        type: string
      cvk_upstream_traceparent:
        description: "W3C parent for the trusted GitHub dispatcher step"
        required: true
        type: string

concurrency:
  # The physical switch is singular. The Argo template also holds the device
  # semaphore, but serializing here avoids unnecessary environment approvals.
  group: lab-ci-next-cat9k
  queue: max

permissions: {}

env:
  STATUS_CONTEXT: lab-ci-next / cat9k

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      merge_sha: ${{ steps.pr.outputs.merge_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      cvk_lifecycle_id: ${{ steps.pr.outputs.cvk_lifecycle_id }}
      cvk_upstream_traceparent: ${{ steps.pr.outputs.cvk_upstream_traceparent }}
    steps:
      - name: Checkout trusted gate from main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve and verify open PR
        id: pr
        env:
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_MERGE_SHA: ${{ inputs.expected_merge_sha }}
          DISPATCH_ATTEMPT: ${{ inputs.dispatch_attempt }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          CVK_LIFECYCLE_ID: ${{ inputs.cvk_lifecycle_id }}
          CVK_UPSTREAM_TRACEPARENT: ${{ inputs.cvk_upstream_traceparent }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.upstream_pr }}
          EXPECTED_REPO: ${{ github.repository }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$DISPATCH_ATTEMPT" =~ ^[1-3]$ ]]
          [[ "$DISPATCH_ID" =~ ^cat9k-pr[1-9][0-9]*-h[0-9a-f]{12}-b[0-9a-f]{12}-m[0-9a-f]{12}-a[1-3]$ ]]
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DISPATCH_ID" == "cat9k-pr${PR_NUMBER}-h${EXPECTED_HEAD_SHA:0:12}-b${EXPECTED_BASE_SHA:0:12}-m${EXPECTED_MERGE_SHA:0:12}-a${DISPATCH_ATTEMPT}" ]]
          [[ "$CVK_LIFECYCLE_ID" == "cvk-pr${PR_NUMBER}-h${EXPECTED_HEAD_SHA}" ]]
          [[ "$CVK_UPSTREAM_TRACEPARENT" =~ ^00-[0-9a-f]{32}-[0-9a-f]{16}-01$ ]]
          [[ "${CVK_UPSTREAM_TRACEPARENT:3:32}" != "00000000000000000000000000000000" ]]
          [[ "${CVK_UPSTREAM_TRACEPARENT:36:16}" != "0000000000000000" ]]
          {
            echo "base_sha=$EXPECTED_BASE_SHA"
            echo "head_sha=$EXPECTED_HEAD_SHA"
            echo "pr_number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

          VERIFY_JSON=$(python3 .github/scripts/dispatch-approved-lab-ci.py verify \
            --repository "$EXPECTED_REPO" \
            --pr-number "$PR_NUMBER" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-base-sha "$EXPECTED_BASE_SHA" \
            --expected-merge-sha "$EXPECTED_MERGE_SHA")
          HEAD_SHA=$(jq -r '.head_sha' <<<"$VERIFY_JSON")
          BASE_SHA=$(jq -r '.base_sha' <<<"$VERIFY_JSON")
          MERGE_SHA=$(jq -r '.merge_sha' <<<"$VERIFY_JSON")
          VERIFIED_PR=$(jq -r '.pr_number' <<<"$VERIFY_JSON")
          [[ "$GITHUB_SHA" == "$BASE_SHA" ]]

          {
            echo "base_sha=$BASE_SHA"
            echo "head_sha=$HEAD_SHA"
            echo "merge_sha=$MERGE_SHA"
            echo "pr_number=$VERIFIED_PR"
            echo "cvk_lifecycle_id=$CVK_LIFECYCLE_ID"
            echo "cvk_upstream_traceparent=$CVK_UPSTREAM_TRACEPARENT"
          } >> "$GITHUB_OUTPUT"

          gh api -X POST "repos/${EXPECTED_REPO}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f target_url="$TARGET_URL" \
            -f description="Cat9k testing; try=$DISPATCH_ATTEMPT; base=$BASE_SHA; merge=$MERGE_SHA" \
            -f context="$STATUS_CONTEXT" >/dev/null

  cat9k:
    if: github.ref == 'refs/heads/main' && needs.prepare.result == 'success'
    needs: prepare
    runs-on: [self-hosted, lab-cvk-upstream]
    environment: lab-ci
    # Argo's activeDeadlineSeconds is 3000 (50 minutes). Leave time for
    # evidence capture and runner-side termination before GitHub stops the job.
    timeout-minutes: 60
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      argo_phase: ${{ steps.argo.outputs.phase }}
      argo_workflow: ${{ steps.argo.outputs.workflow }}
      gate_outcome: ${{ steps.gate.outcome }}
    env:
      TEST_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      TEST_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
      UPSTREAM_REPO: ${{ github.repository }}
      UPSTREAM_PR: ${{ needs.prepare.outputs.pr_number }}
      TEST_MERGE_SHA: ${{ needs.prepare.outputs.merge_sha }}
      CVK_LIFECYCLE_ID: ${{ needs.prepare.outputs.cvk_lifecycle_id }}
      CVK_UPSTREAM_TRACEPARENT: ${{ needs.prepare.outputs.cvk_upstream_traceparent }}
      PATH: /home/cisco/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Checkout trusted gate at the verified base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false

      - name: Revalidate approval immediately before lab submission
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$UPSTREAM_REPO" == "$GITHUB_REPOSITORY" ]]
          [[ "$UPSTREAM_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$TEST_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TEST_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TEST_MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CVK_LIFECYCLE_ID" == "cvk-pr${UPSTREAM_PR}-h${TEST_HEAD_SHA}" ]]
          [[ "$CVK_UPSTREAM_TRACEPARENT" =~ ^00-[0-9a-f]{32}-[0-9a-f]{16}-01$ ]]
          [[ "${CVK_UPSTREAM_TRACEPARENT:3:32}" != "00000000000000000000000000000000" ]]
          [[ "${CVK_UPSTREAM_TRACEPARENT:36:16}" != "0000000000000000" ]]
          python3 .github/scripts/dispatch-approved-lab-ci.py verify \
            --repository "$UPSTREAM_REPO" \
            --pr-number "$UPSTREAM_PR" \
            --expected-head-sha "$TEST_HEAD_SHA" \
            --expected-base-sha "$TEST_BASE_SHA" \
            --expected-merge-sha "$TEST_MERGE_SHA" >/dev/null

      - name: Verify trusted lab tooling
        run: |
          set -euo pipefail
          command -v argo
          command -v jq
          argo version --short

      - name: Submit WorkflowTemplate and wait
        id: argo
        env:
          GH_TOKEN: ${{ github.token }}
          WRAPPER_JOB_NAME: cat9k
        run: |
          set -euo pipefail
          JOBS=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100")
          CHECK_RUN_ID=$(jq -er \
            --arg job "$WRAPPER_JOB_NAME" \
            --argjson run "$GITHUB_RUN_ID" '
              [.jobs[]
                | select(.name == $job and .run_id == $run)]
              | if length == 1 then .[0].id
                else error("current wrapper job is not uniquely identifiable") end
            ' <<<"$JOBS")
          [[ "$CHECK_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          ARGO_UPSTREAM_TRACEPARENT=$(PYTHONPATH=.github/scripts python3 -c '
          import sys
          from cicd_otel import github_step_traceparent
          print(github_step_traceparent(*sys.argv[1:]))
          ' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$CHECK_RUN_ID" \
            "Submit WorkflowTemplate and wait")
          [[ "$ARGO_UPSTREAM_TRACEPARENT" =~ ^00-[0-9a-f]{32}-[0-9a-f]{16}-01$ ]]
          echo "upstream_traceparent=$ARGO_UPSTREAM_TRACEPARENT" >> "$GITHUB_OUTPUT"

          NAME=""
          terminate_on_signal() {
            trap - INT TERM
            if [[ -n "$NAME" ]]; then
              echo "Terminating Argo workflow after runner cancellation: $NAME"
              argo terminate -n virtual-kubelet-ci "$NAME" || true
            fi
            exit 130
          }
          trap terminate_on_signal INT TERM

          NAME=$(argo submit -n virtual-kubelet-ci \
            --from WorkflowTemplate/cat9k-pr-test \
            -p upstream_repo="$UPSTREAM_REPO" \
            -p upstream_sha="$TEST_MERGE_SHA" \
            -p upstream_pr="$UPSTREAM_PR" \
            -p cvk_lifecycle_id="$CVK_LIFECYCLE_ID" \
            -p cvk_upstream_traceparent="$ARGO_UPSTREAM_TRACEPARENT" \
            --generate-name "cat9k-${TEST_MERGE_SHA:0:8}-" \
            -o name | sed 's|^workflow.argoproj.io/||')
          [[ "$NAME" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]
          echo "workflow=$NAME" >> "$GITHUB_OUTPUT"
          echo "Submitted: $NAME"

          # Do not stream template/node messages into this public Actions log.
          # argo wait returns non-zero for a failed workflow; query the phase
          # explicitly below so every terminal state is handled uniformly.
          argo wait -n virtual-kubelet-ci "$NAME" >/dev/null 2>&1 || true
          trap - INT TERM
          PHASE=$(argo get -n virtual-kubelet-ci "$NAME" -o json | jq -r '.status.phase')
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          [[ "$PHASE" == "Succeeded" ]]

      - name: Build sanitized Argo evidence
        id: evidence
        if: always() && steps.argo.outputs.workflow != ''
        env:
          WORKFLOW: ${{ steps.argo.outputs.workflow }}
          CVK_LIFECYCLE_ID: ${{ needs.prepare.outputs.cvk_lifecycle_id }}
          CVK_UPSTREAM_TRACEPARENT: ${{ steps.argo.outputs.upstream_traceparent }}
        run: |
          set -euo pipefail
          rm -f argo-evidence.json
          # Retain only status/timing and scenario labels. Do not persist raw
          # Argo JSON, pod logs, inputs, messages, or template source.
          argo get -n virtual-kubelet-ci "$WORKFLOW" -o json | jq \
            --arg lifecycle "$CVK_LIFECYCLE_ID" \
            --arg upstream_traceparent "$CVK_UPSTREAM_TRACEPARENT" '
            (.status.storedWorkflowTemplateSpec.templates // []
              | map({key: .name, value: (.metadata.labels // {})})
              | from_entries) as $labels
            | {
                schema: "cvk-lab-evidence/v1",
                cvk_lifecycle_id: $lifecycle,
                cvk_upstream_traceparent: $upstream_traceparent,
                workflow: .metadata.name,
                phase: (.status.phase // "Unknown"),
                started_at: (.status.startedAt // ""),
                finished_at: (.status.finishedAt // ""),
                scenarios: [
                  .status.nodes[]?
                  | select(.type == "Pod")
                  | ($labels[.templateName] // {}) as $meta
                  | select(
                      ($meta["cvk.cisco.io/scenario-name"] // "") != ""
                      or ((.templateName // "") | startswith("scenario-"))
                    )
                  | {
                      crd: ($meta["cvk.cisco.io/crd"] // "Lab"),
                      name: ($meta["cvk.cisco.io/scenario-name"] // .displayName // .templateName),
                      template: (.templateName // ""),
                      phase: (.phase // "Unknown"),
                      started_at: (.startedAt // ""),
                      finished_at: (.finishedAt // "")
                    }
                ]
              }
          ' > argo-evidence.json
          jq -e '
            .schema == "cvk-lab-evidence/v1"
            and (.cvk_lifecycle_id | test("^cvk-pr[1-9][0-9]*-h[0-9a-f]{40}$"))
            and (.cvk_upstream_traceparent | test("^00-[0-9a-f]{32}-[0-9a-f]{16}-01$"))
            and (.scenarios | type == "array")
          ' \
            argo-evidence.json >/dev/null
          jq -r '
            "## Cat9k Argo summary\n\n" +
            "Lifecycle: `" + .cvk_lifecycle_id + "`\n\n" +
            "Workflow: `" + .workflow + "`\n\n" +
            "Phase: `" + .phase + "`\n\n" +
            "Sanitized scenarios captured: " + ((.scenarios | length) | tostring)
          ' argo-evidence.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized evidence
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: argo-evidence-cat9k
          path: argo-evidence.json
          if-no-files-found: error
          retention-days: 7

  report:
    if: always() && github.ref == 'refs/heads/main'
    needs: [prepare, cat9k]
    concurrency:
      group: lab-ci-next-report-${{ needs.prepare.outputs.pr_number }}
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Post final status
        env:
          GH_TOKEN: ${{ github.token }}
          ARGO_PHASE: ${{ needs.cat9k.outputs.argo_phase }}
          ARGO_WORKFLOW: ${{ needs.cat9k.outputs.argo_workflow }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha || inputs.expected_base_sha }}
          DISPATCH_ATTEMPT: ${{ inputs.dispatch_attempt }}
          GATE_OUTCOME: ${{ needs.cat9k.outputs.gate_outcome }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha || inputs.expected_head_sha }}
          LAB_RESULT: ${{ needs.cat9k.result }}
          MERGE_SHA: ${{ needs.prepare.outputs.merge_sha || inputs.expected_merge_sha }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DISPATCH_ATTEMPT" =~ ^[1-3]$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$PREPARE_RESULT" != "success" || "$GATE_OUTCOME" == "failure" ]]; then
            STATE=error
            DESCRIPTION="Cat9k gate rejected; try=$DISPATCH_ATTEMPT; base=$BASE_SHA; merge=$MERGE_SHA"
          elif [[ "$LAB_RESULT" == "cancelled" ]]; then
            STATE=error
            DESCRIPTION="Cat9k cancelled; try=$DISPATCH_ATTEMPT; base=$BASE_SHA; merge=$MERGE_SHA"
          elif [[ -n "$ARGO_WORKFLOW" && "$ARGO_PHASE" == "Failed" ]]; then
            STATE=failure
            DESCRIPTION="Cat9k failed; try=$DISPATCH_ATTEMPT; base=$BASE_SHA; merge=$MERGE_SHA"
          elif [[ "$LAB_RESULT" == "success" && "$ARGO_PHASE" == "Succeeded" ]]; then
            STATE=success
            DESCRIPTION="Cat9k passed; try=$DISPATCH_ATTEMPT; base=$BASE_SHA; merge=$MERGE_SHA"
          else
            STATE=error
            DESCRIPTION="Cat9k incomplete; try=$DISPATCH_ATTEMPT; base=$BASE_SHA; merge=$MERGE_SHA"
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$STATE" \
            -f target_url="$TARGET_URL" \
            -f description="$DESCRIPTION" \
            -f context="$STATUS_CONTEXT" >/dev/null

      - name: Checkout trusted reporting code
        if: always() && needs.prepare.result == 'success'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Upsert native Lab CI report
        if: always() && needs.prepare.result == 'success'
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          MERGE_SHA: ${{ needs.prepare.outputs.merge_sha }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        run: python3 .github/scripts/post-pr-report.py

      - name: Dispatch trusted OpenTelemetry observer
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/cicd-otel-export.yaml/dispatches" \
            -f ref=main \
            -f "inputs[observed_run_id]=$GITHUB_RUN_ID" \
            -f "inputs[observed_run_attempt]=$GITHUB_RUN_ATTEMPT"
