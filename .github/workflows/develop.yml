name: CI build and deploy documentation
on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/configure-pages@v5
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: docs/website/package-lock.json
    - name: Install Zensical
      run: pip install zensical==0.0.32
    - name: Build React website
      working-directory: docs/website
      run: |
        npm ci
        npm run build
    - name: Build MkDocs documentation
      run: mzensical build --clean
    - name: Combine pages
      run: |
        mkdir -p deploy
        cp -r docs/website/out/* deploy/
        mkdir -p deploy/docs
        cp -r site/* deploy/docs/
    - uses: actions/upload-pages-artifact@v4
      with:
        path: deploy
    - uses: actions/deploy-pages@v4
      id: deployment
