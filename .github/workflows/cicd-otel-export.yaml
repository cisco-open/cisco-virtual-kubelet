# Trusted fallback for the private validation network. GitHub cannot deliver a
# signed webhook to svr-xl until a public TLS ingress exists, so this workflow
# observes completed runs from trusted main and sends deterministic OTLP JSON
# to the node-local Splunk Collector. It never checks out or executes the
# observed run's branch, commit, artifact, or logs.
name: CVK CI/CD OpenTelemetry export

on:
  workflow_run:
    workflows:
      - smoke
      - Lab CI approval signal
      - Lab CI approved dispatcher
      - lab-ci-static
      - release
      - CI build and deploy documentation
      - krew-index
      - ci-tiers
      - yang-drift
      - recover v2026.8.1 release assets
    types: [completed]
  # Auto-dispatched lab wrappers do not reliably emit another workflow_run
  # event. Their trusted report jobs dispatch this observer explicitly with
  # only the source run coordinates; the observer refetches and validates all
  # source metadata before export.
  workflow_dispatch:
    inputs:
      observed_run_id:
        description: "Cat8/Cat9 workflow run ID to observe"
        required: true
        type: string
      observed_run_attempt:
        description: "Cat8/Cat9 workflow run attempt to observe"
        required: true
        type: string
  release:
    types: [published]

permissions: {}

concurrency:
  group: >-
    cicd-otel-${{ github.event_name }}-${{ github.event.workflow_run.id || inputs.observed_run_id || github.event.release.id }}-${{ github.event.workflow_run.run_attempt || inputs.observed_run_attempt || 'published' }}
  cancel-in-progress: false

jobs:
  export-workflow:
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.status == 'completed' &&
        github.event.workflow_run.repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.actor == 'github-actions[bot]')
    runs-on: [self-hosted, lab-cvk-upstream]
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted observer from main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - name: Export completed workflow spans to the local Collector
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVED_REPOSITORY: ${{ github.repository }}
          OBSERVED_RUN_ID: ${{ github.event.workflow_run.id || inputs.observed_run_id }}
          OBSERVED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.observed_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$OBSERVED_REPOSITORY" == "$GITHUB_REPOSITORY" ]]
          [[ "$OBSERVED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$OBSERVED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          observer_mode=()
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            observer_mode+=(--trusted-lab-dispatch)
          fi
          python3 .github/scripts/export-cicd-otel.py \
            --repository "$OBSERVED_REPOSITORY" \
            --run-id "$OBSERVED_RUN_ID" \
            --run-attempt "$OBSERVED_RUN_ATTEMPT" \
            "${observer_mode[@]}"

  export-release-publication:
    if: >-
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      github.event.repository.full_name == github.repository &&
      github.event.release.draft == false &&
      github.event.release.prerelease == false
    runs-on: [self-hosted, lab-cvk-upstream]
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted observer from main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - name: Export immutable release publication span to the local Collector
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVED_REPOSITORY: ${{ github.repository }}
          OBSERVED_RELEASE_ID: ${{ github.event.release.id }}
          OBSERVED_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$OBSERVED_REPOSITORY" == "$GITHUB_REPOSITORY" ]]
          [[ "$OBSERVED_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$OBSERVED_RELEASE_TAG" =~ ^v[1-9][0-9]{3}\.([1-9]|1[0-2])\.(0|[1-9][0-9]{0,8})$ ]]
          python3 .github/scripts/export-cicd-otel.py \
            --repository "$OBSERVED_REPOSITORY" \
            --release-id "$OBSERVED_RELEASE_ID" \
            --release-tag "$OBSERVED_RELEASE_TAG"
