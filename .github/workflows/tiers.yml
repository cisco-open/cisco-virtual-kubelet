name: ci-tiers

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tier-map:
    runs-on: ubuntu-latest
    steps:
      - name: Gate model
        run: |
          # T0 blocks every merge:
          #   go build ./...
          #   go vet ./...
          #   go test -race -count=1 ./...
          #   make check-parity-matrix
          #
          # T1 blocks release branches and transport/version changes:
          #   live IOS-XE lab, real RESTCONF/NETCONF/gNMI paths.
          #
          # T2 blocks resilience/transactionality claims:
          #   failure injection, reconnects, lock contention, rollback.
          #
          # T3 blocks production enablement of broad new modes:
          #   scale, soak, metric-cardinality, cache pressure.
          echo "CI tier gate model is documented in this workflow and docs/yang-version-transition.md."
