# Smoke pipeline — runs on every push and PR. The point is not to
# verify the *device* side (which needs real IOS-XE and NX-OS devices
# reachable on their management transports and so cannot live in CI).
# It verifies the *cluster-side plumbing* of the controller: build, image side-load,
# Helm install, CRDs, RBAC, and that the cisco-vk pod actually
# reaches the device-call boundary. The connection-refused beyond
# that boundary is expected and is treated as a passing condition.
#
# When this workflow is green, the things that have been validated
# end-to-end in a clean environment are:
#   - Go module builds and tests pass with -race
#   - Container image builds
#   - Helm chart installs (values.schema.json catches typos)
#   - CRDs apply without conversion failures
#   - Controller pod reaches Ready
#   - Per-namespace VK SA + RoleBinding are auto-provisioned
#   - cisco-vk pod schedules in the device namespace
#   - The device-call path is reached (the failure mode beyond is
#     out of scope for CI).

name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build ./...

      - name: go vet
        # Static analysis gate per pre-pr-test-enrichment-plan §6.
        # A separate step from the test gate so a vet failure is
        # diagnosed without waiting for the test suite.
        run: go vet ./...

      - name: gofmt check
        # Formatting gate for first-party sources. Generated trees are
        # excluded: the ygot per-family schemas under configdriver/generated/
        # and internal/drivers/iosxe/models.go (ygot output — reformatting it
        # by hand would drift it from the generator; see the drift check
        # below, which asserts generated artefacts match their sources).
        run: |
          fmt_out="$(gofmt -l . | grep -v '/configdriver/generated/' | grep -v 'internal/drivers/iosxe/models.go' || true)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt violations in first-party files:"
            echo "$fmt_out"
            exit 1
          fi
          echo "gofmt clean."

      - name: kubectl-ciscovk release packaging gate
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s .github/scripts \
            -p 'test_package_kubectl_ciscovk.py' \
            -v
          release_commit="$(git rev-parse HEAD)"
          source_date_epoch="$(git show -s --format=%ct "$release_commit")"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          for attempt in first second; do
            python3 .github/scripts/package_kubectl_ciscovk.py package \
              --version v0.0.0-ci \
              --commit "$release_commit" \
              --source-date-epoch "$source_date_epoch" \
              --dist-dir "$work/$attempt/dist" \
              --build-dir "$work/$attempt/build"
            python3 .github/scripts/package_kubectl_ciscovk.py checksums \
              --version v0.0.0-ci \
              --dist-dir "$work/$attempt/dist"
          done
          diff -r "$work/first/dist" "$work/second/dist"
          python3 .github/scripts/package_kubectl_ciscovk.py verify \
            --version v0.0.0-ci \
            --commit "$release_commit" \
            --source-date-epoch "$source_date_epoch" \
            --target-os linux \
            --target-arch amd64 \
            --dist-dir "$work/first/dist" \
            --execute

      - name: Krew manifest generation gate
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s .github/scripts \
            -p 'test_render_krew_manifest.py' \
            -v
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          python3 .github/scripts/render_krew_manifest.py \
            --release-tag v2026.9.0 \
            --checksums krew/testdata/kubectl-ciscovk_v2026.9.0_checksums.txt \
            --output "$work/cisco-vk.yaml"
          env GOBIN="$work/bin" \
            go install sigs.k8s.io/krew/cmd/validate-krew-manifest@v0.4.5
          "$work/bin/validate-krew-manifest" \
            -manifest "$work/cisco-vk.yaml" \
            -skip-install

      - name: Unit tests
        run: go test -race -count=1 ./...

      - name: NX-OS pinned oracle conformance gate
        # Keep the offline NetAsCode contract visible inside the required
        # build-and-smoke check. This verifies fixture digests, semantic DME
        # parity, and deterministic recovery without network or credentials.
        run: make check-nxos-oracle

      - name: Family parity matrix drift check
        run: make check-parity-matrix

      - name: Kubernetes generated artefact drift check
        # Regenerate CRDs, DeepCopy, RBAC, and Helm CRDs, then assert no
        # drift. The ygot-validate job owns YANG schema regeneration because
        # it first downloads the pinned IOS-XE model releases.
        run: |
          make crd-gen deepcopy-gen rbac-gen helm-sync-crds
          if ! git diff --quiet -- api/ config/crd/ charts/cisco-virtual-kubelet/; then
            echo "Generated CRDs / DeepCopy / RBAC drifted from sources:"
            git diff --stat -- api/ config/crd/ charts/cisco-virtual-kubelet/
            git diff -- api/ config/crd/ charts/cisco-virtual-kubelet/ | head -200
            exit 1
          fi
          echo "Kubernetes generated artefacts are in sync with sources."

      - name: CRD / Helm chart sync check
        # Belt-and-suspenders for the diff above: explicitly enumerate
        # each CRD file and confirm config/crd/ matches charts/.../crds/.
        run: |
          for f in config/crd/*.yaml; do
            base="$(basename "$f")"
            if ! diff -q "$f" "charts/cisco-virtual-kubelet/crds/${base}" > /dev/null; then
              echo "CRD/chart sync drift on ${base}"
              diff -u "$f" "charts/cisco-virtual-kubelet/crds/${base}" | head -100
              exit 1
            fi
          done
          count=$(ls config/crd/*.yaml | wc -l)
          echo "CRD/chart sync clean (${count} of ${count})."

      - name: setup-envtest binaries
        # Pinned per pre-pr-test-enrichment-plan §6 — never @latest in
        # CI. The setup-envtest sub-module of controller-runtime is
        # not independently tagged; the canonical pin is a Go
        # pseudo-version from the same release branch as the
        # controller-runtime release used by go.mod. Bump them together and
        # re-run the suite before locking in.
        run: |
          # The setup-envtest submodule has no tags of its own. Keep this
          # pseudo-version on controller-runtime's release-0.23 branch so it
          # stays compatible with the v0.23 controller-runtime dependency.
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.0.0-20260305142021-f9589b9f2b9d
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Real-apiserver smoke (envtest)
        # Closes the recurring fake-client-doesn't-validate gap at
        # the apiserver-admission level (LeaseBlocked enum, DNS-1123
        # Lease names, future schema additions).
        run: make test-envtest

      - name: Install kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          # kind v0.32.0 defaults to Kubernetes 1.36; pin the node image by
          # digest so the smoke cluster's Kubernetes version only moves when
          # we choose to move it. Keep this within the client-go support
          # window of the k8s.io/* modules in go.mod.
          version: v0.32.0
          node_image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
          cluster_name: smoke
          wait: 60s

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Latest Helm 3 minor. Helm 3 minors out of the current line stop
          # receiving patches immediately, and the 3.x line as a whole is in
          # wind-down (final feature release 2026-09, security-only after),
          # so track the newest 3.x here; the helm4-compat job below covers
          # the Helm 4 side.
          version: v3.21.3

      - name: helm lint
        # Lint the chart with the regenerated CRDs in place. Runs
        # after Helm install (which is what brings the binary onto
        # the runner) but before the chart is templated against
        # the kind cluster — the lint is a static check.
        run: helm lint charts/cisco-virtual-kubelet

      - name: Build controller image
        run: docker build -t cisco-vk:smoke .

      - name: Side-load image into kind
        # Non-destructive — kind copies the image into the node.
        run: kind load docker-image cisco-vk:smoke --name smoke

      - name: Helm install
        run: |
          kubectl create namespace cisco-vk-system
          helm install cisco-vk ./charts/cisco-virtual-kubelet \
            --namespace cisco-vk-system \
            --set image.repository=cisco-vk \
            --set image.tag=smoke \
            --set image.pullPolicy=Never \
            --set controllerImage.repository=cisco-vk \
            --set controllerImage.tag=smoke \
            --set controllerImage.pullPolicy=Never \
            --set vkImage.repository=cisco-vk \
            --set vkImage.tag=smoke \
            --set vkImage.pullPolicy=Never \
            --wait --timeout 5m

      - name: Verify controller is Ready
        run: |
          kubectl -n cisco-vk-system rollout status \
            deploy/cisco-vk-cisco-virtual-kubelet-controller --timeout=180s
          kubectl -n cisco-vk-system get pods

      - name: Apply test CRs
        # The IOS-XE address is RFC 5737 documentation space. The NX-OS
        # address is the pod's own loopback on a deliberately closed port,
        # which makes the expected connection refusal deterministic instead
        # of waiting for the NX-API client's network timeout. In both cases,
        # reaching that transport error proves the platform-specific binary
        # path was constructed without asking public CI to reach a device.
        run: |
          kubectl create namespace cisco-vk-smoke
          kubectl create namespace cisco-vk-nxos-smoke
          cat <<'EOF' | kubectl apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: smoke-creds
            namespace: cisco-vk-smoke
          type: Opaque
          stringData:
            password: smoke
          ---
          apiVersion: cisco.vk/v1alpha1
          kind: CiscoDevice
          metadata:
            name: smoke
            namespace: cisco-vk-smoke
          spec:
            driver: XE
            address: 192.0.2.1
            port: 443
            username: smoke
            credentialSecretRef: { name: smoke-creds }
            tls: { enabled: true, insecureSkipVerify: true }
            maxPods: 1
            xe:
              networking:
                interface:
                  type: Management
                  management:
                    dhcp: true
          ---
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: smoke-data
            namespace: cisco-vk-smoke
          data:
            data.nac.yaml: |
              iosxe:
                devices:
                  - name: smoke
                    host: 192.0.2.1
                    configuration:
                      system:
                        hostname: smoke
          ---
          apiVersion: config.cisco.vk/v1alpha1
          kind: IOSXEConfig
          metadata:
            name: smoke
            namespace: cisco-vk-smoke
          spec:
            deviceRef: { name: smoke }
            managedFamilies: [system]
            transactional: false
            writeStartup: false
            driftDetectInterval: 5m
            driftPolicy: report
            source:
              configMapRef: { name: smoke-data, key: data.nac.yaml }
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: smoke-creds
            namespace: cisco-vk-nxos-smoke
          type: Opaque
          stringData:
            password: nxos-kind-credential-sentinel
          ---
          apiVersion: cisco.vk/v1alpha1
          kind: CiscoDevice
          metadata:
            name: nxos-smoke
            namespace: cisco-vk-nxos-smoke
          spec:
            driver: NXOS
            address: 127.0.0.1
            port: 1
            username: smoke
            credentialSecretRef: { name: smoke-creds }
            tls: { enabled: true, insecureSkipVerify: true }
            transport: rest
            maxPods: 1
            nxos:
              networking:
                interface:
                  type: Management
                  management:
                    guestInterface: 0
          ---
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: smoke-data
            namespace: cisco-vk-nxos-smoke
          data:
            data.nac.yaml: |
              system:
                hostname: nxos-smoke
          ---
          apiVersion: config.cisco.vk/v1alpha1
          kind: NXOSConfig
          metadata:
            name: nxos-smoke
            namespace: cisco-vk-nxos-smoke
          spec:
            deviceRef: { name: nxos-smoke }
            managedFamilies: [system]
            transactional: false
            writeStartup: false
            driftDetectInterval: 5m
            driftPolicy: report
            source:
              configMapRef: { name: smoke-data, key: data.nac.yaml }
          EOF

      - name: Verify VK SA and RoleBinding auto-provisioned
        # Assertion of the controller fix: a CiscoDevice in a tenant
        # namespace must cause the VK SA + RoleBinding to appear there.
        run: |
          for target in \
            cisco-vk-smoke:smoke \
            cisco-vk-nxos-smoke:nxos-smoke; do
            namespace="${target%%:*}"
            device="${target##*:}"
            for i in $(seq 1 30); do
              if kubectl -n "$namespace" get sa cisco-virtual-kubelet >/dev/null 2>&1 \
                 && kubectl -n "$namespace" get rolebinding cisco-virtual-kubelet >/dev/null 2>&1 \
                 && kubectl -n "$namespace" get cm "${device}-config" >/dev/null 2>&1 \
                 && kubectl -n "$namespace" get deploy "${device}-vk" >/dev/null 2>&1; then
                echo "VK access and deployment provisioned for ${namespace}/${device}"
                break
              fi
              sleep 2
            done
            kubectl -n "$namespace" get sa cisco-virtual-kubelet
            kubectl -n "$namespace" get rolebinding cisco-virtual-kubelet
            kubectl -n "$namespace" get cm "${device}-config"
            kubectl -n "$namespace" get deploy "${device}-vk"
          done
          kubectl -n cisco-vk-smoke get iosxeconfig smoke
          kubectl -n cisco-vk-nxos-smoke get nxosconfig nxos-smoke

      - name: Verify IOS-XE and NX-OS pods reach device-call boundary
        # The only expected blocker past this point is an unreachable device,
        # which CI does not provide. A transport-level connection refusal or
        # timeout proves the binary reached the device call.
        # Any RBAC, schema, or config-shape failure surfaces here as
        # a non-transport error and fails the job.
        run: |
          # Poll log content, not just pod phase — Phase=Running triggers
          # immediately on container start, before the binary has had a
          # chance to attempt the device call. We need to wait until the
          # logs actually surface a device-call boundary marker (success
          # path) or an upstream-defect marker (fail path).
          check_device_boundary() {
            namespace="$1"
            device="$2"
            platform="$3"
            ok_re='connect: connection refused|i/o timeout|context deadline exceeded|no route to host|failed to validate device connection'
            bad_re='requires (xe|nxos) config section|forbidden|cannot list|cannot get|driver .* not registered|unsupported device driver'
            if [ "$platform" = NX-OS ]; then
              ok_re='nxapi cli_show_ascii.*127\.0\.0\.1:1/ins.*connection refused'
              bad_re="${bad_re}|nxos-kind-credential-sentinel|nxapi cli_conf"
            fi
            # Concatenate current + previous container logs each cycle. If the
            # binary crashes within the poll window (observed: pod Restarts=1
            # with empty current-container logs), --previous keeps the markers
            # visible. `|| true` swallows the "previous terminated container
            # not found" message during normal startup.
            cur=""
            prev=""
            logs=""
            for i in $(seq 1 60); do
              cur=$(kubectl -n "$namespace" logs -l "app.kubernetes.io/instance=${device}" --tail=200 2>&1 || true)
              prev=$(kubectl -n "$namespace" logs -l "app.kubernetes.io/instance=${device}" --previous --tail=200 2>&1 || true)
              logs="${prev}"$'\n'"${cur}"
              if echo "$logs" | grep -qE "$bad_re"; then
                kubectl -n "$namespace" get pods
                echo "$logs"
                echo "${platform} failed upstream of the device call — surfaces a real defect"
                return 1
              fi
              if echo "$logs" | grep -qE "$ok_re"; then
                kubectl -n "$namespace" get pods
                echo "$logs"
                echo "${platform} reached the device-call boundary as expected"
                return 0
              fi
              sleep 3
            done
            # Timeout path: dump everything that helps explain WHY no marker
            # was seen — pod state, restart reason, and both log streams.
            kubectl -n "$namespace" get pods -o wide
            kubectl -n "$namespace" describe pods -l "app.kubernetes.io/instance=${device}"
            echo "--- current container logs ---"
            echo "$cur"
            echo "--- previous container logs (--previous) ---"
            echo "$prev"
            echo "${platform} cisco-vk did not reach a recognised state in time"
            return 1
          }

          check_device_boundary cisco-vk-smoke smoke IOS-XE
          check_device_boundary cisco-vk-nxos-smoke nxos-smoke NX-OS

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get nodes -o wide
          kubectl get pods -A
          kubectl -n cisco-vk-system describe deploy/cisco-vk-cisco-virtual-kubelet-controller || true
          kubectl -n cisco-vk-system logs deploy/cisco-vk-cisco-virtual-kubelet-controller --tail=200 || true
          kubectl -n cisco-vk-smoke describe ciscodevice smoke || true
          kubectl -n cisco-vk-smoke describe iosxeconfig smoke || true
          kubectl -n cisco-vk-smoke get events --sort-by=.lastTimestamp || true
          kubectl -n cisco-vk-nxos-smoke describe ciscodevice nxos-smoke || true
          kubectl -n cisco-vk-nxos-smoke describe nxosconfig nxos-smoke || true
          kubectl -n cisco-vk-nxos-smoke get events --sort-by=.lastTimestamp || true

  terraform-provider:
    name: terraform-provider
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/terraform-provider-iosxeconfig
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
          cache-dependency-path: tools/terraform-provider-iosxeconfig/go.sum

      - name: Module tidy drift check
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -count=1 ./...

  helm4-compat:
    # Helm 4 is the current stable major and what new users install by
    # default. The chart is a standard apiVersion v2 chart so it is expected
    # to work unmodified; this job turns that expectation into a gate
    # (static lint + template render only — the kind install above stays on
    # the Helm 3 line until the fleet guidance moves).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Helm 4
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: helm lint (Helm 4)
        run: helm lint charts/cisco-virtual-kubelet

      - name: helm template (Helm 4)
        run: |
          helm template cvk charts/cisco-virtual-kubelet \
            --namespace cisco-vk-system > /dev/null
          helm template cvk charts/cisco-virtual-kubelet \
            --namespace cisco-vk-system \
            --set collector.enabled=true > /dev/null
          echo "Helm 4 render clean (defaults and collector.enabled=true)."

  govulncheck:
    # Shift vulnerability scanning left: the release workflow runs Trivy on
    # the built image, but nothing scans the module graph at PR time.
    # govulncheck is symbol-aware, so it only fails on vulnerable code that
    # is actually reachable.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run controller govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: '1.25'
          check-latest: true
          go-package: ./...
          repo-checkout: false

      - name: Run Terraform provider govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: '1.26'
          check-latest: true
          # The controller scan above has already restored and populated the
          # job-level Go caches. A second setup-go cache restore into those
          # same paths fails with tar "File exists" errors before the provider
          # scan can run. Keep this setup cache-free; the module itself is
          # small and its dedicated build/test job still uses caching.
          cache: false
          cache-dependency-path: tools/terraform-provider-iosxeconfig/go.sum
          work-dir: tools/terraform-provider-iosxeconfig
          go-package: ./...
          repo-checkout: false

  ygot-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache: true

      - name: Download YANG modules
        run: |
          for release in 1715 1716 1718 1791 2601; do
            make vendor-yang RELEASE=$release
          done

      - name: Regenerate per-family YANG schemas
        # The Make target enforces the committed skip baseline and recreates
        # each release from a clean output directory, so stale packages and
        # newly skipped families cannot pass silently.
        run: |
          for release in 1715 1716 1718 1791 2601; do
            echo "--- generating release ${release} ---"
            make ygot-validate-gen RELEASE=${release}
          done

      - name: Compile and test regenerated schemas
        run: >-
          go test
          ./tools/cisco-vk-yang-sync
          ./internal/drivers/iosxe/configdriver/generated/...
          ./internal/drivers/iosxe/configdriver/writers/...

      - name: Generated YANG drift check
        run: |
          status="$(git status --porcelain=v1 --untracked-files=all -- \
            internal/drivers/iosxe/configdriver/generated \
            internal/drivers/iosxe/configdriver/writers)"
          if [ -n "$status" ]; then
            echo "Generated YANG schemas or validator registrations are stale:"
            printf '%s\n' "$status"
            git diff --stat -- \
              internal/drivers/iosxe/configdriver/generated \
              internal/drivers/iosxe/configdriver/writers
            git diff -- \
              internal/drivers/iosxe/configdriver/generated \
              internal/drivers/iosxe/configdriver/writers | sed -n '1,200p'
            exit 1
          fi
          echo "Generated YANG schemas and validator registrations are current."
