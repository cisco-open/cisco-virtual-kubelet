apiVersion: config.cisco.vk/v1alpha1
kind: IOSXETelemetry
metadata:
  name: c9300x-environmental
  namespace: network
spec:
  deviceRef:
    name: c9300x-01
  subscriptions:
    - name: environmental-sensors
      enabled: true
      paths:
        - /Cisco-IOS-XE-environment-oper:environment-sensors
      mode: STREAM
      streamMode: SAMPLE
      sampleInterval: 30s
      encoding: PROTO
  reconnect:
    initialBackoff: 1s
    maxBackoff: 30s
    maxRetries: 0
  cardinalityLimits:
    maxSeriesPerSubscription: 10000
    onExceeded: dropNewSeries
  timestamps:
    useCollectorTimestamp: true
  mapping:
    pathAliases:
      - prefix: /Cisco-IOS-XE-environment-oper:environment-sensors
        rename: iosxe.environment.sensors
      - prefix: /Cisco-IOS-XE-environment-oper:environment-sensors/environment-sensor
        rename: iosxe.environment.sensor
    resourceAttributes:
      - path: /Cisco-IOS-XE-environment-oper:environment-sensors/environment-sensor/name
        key: cisco.sensor.name
      - path: /Cisco-IOS-XE-environment-oper:environment-sensors/environment-sensor/location
        key: cisco.sensor.location
      - path: /Cisco-IOS-XE-environment-oper:environment-sensors/environment-sensor/state
        key: cisco.sensor.state
    metricTypeOverrides:
      - prefix: /Cisco-IOS-XE-environment-oper:environment-sensors
        type: gauge
    filter:
      metricName:
        allow:
          - iosxe.environment.*
  output:
    signal:
      - metrics
      - logs
