# Prepare an IOS-XE image without activating or rebooting the device. Replace
# every placeholder and submit as the exact identity in requestedBy. This
# example intentionally terminates at phase Prepared with an immutable receipt;
# the current release does not provide the separate activation API.
apiVersion: ops.cisco.vk/v1alpha1
kind: IOSXESoftwareRollout
metadata:
  name: cat9k-17-18-4-prepare
  namespace: network-devices
spec:
  plan:
    requestedBy: system:serviceaccount:network-devices:cvk-rollout-planner
    requestedAt: "2026-01-01T00:00:00Z"
    targets:
      selector:
        matchLabels:
          topology.cisco.vk/managed: "true"
          operations.cisco.vk/image-family: cat9k
      allowAll: false
      maxTargets: 3
    image:
      # Lowercase SHA-256 of the exact bytes served by every selected source.
      sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      imageFamily: cat9k
      sources:
        - name: trusted-repository
          priority: 100
          url: https://software.example.com/cat9k_iosxe.17.18.04.SPA.bin
    targetVersion: 17.18.4
    strategy: PrepareOnly
    # Rollback is not invoked because activation is never attempted.
    rollbackOnFailure: true
    installTimeoutSeconds: 7200
    rebootTimeoutSeconds: 3600
    canaries:
      - name: c9300
        devices: [c9k-a]
    pauseAfterCanary: true
    budgets:
      maxConcurrentTransfers: 1
      maxUnavailable: 1
    workloads:
      policy: BlockIfRunning
    health:
      maxObservationAgeSeconds: 300
      canarySoakSeconds: 600
      waveSoakSeconds: 300
  control:
    revision: 0
