# Strategic-merge patch for one completed PrepareOnly rollout. This is not a
# standalone object. Copy every value from the live frozen plan and retained
# Prepared leaves; do not invent, shorten, or reuse receipt identities.
#
# Preview, then apply with native Kubernetes commands:
#   kubectl -n network-devices patch iosxesoftwarerollout \
#     cat9k-17-18-4-prepare --type merge --dry-run=server -o yaml \
#     --patch-file examples/topology/iosxe-software-activate-patch.yaml
#   kubectl -n network-devices patch iosxesoftwarerollout \
#     cat9k-17-18-4-prepare --type merge \
#     --patch-file examples/topology/iosxe-software-activate-patch.yaml
#
# The authenticated caller must set approvedBy to its exact Kubernetes
# username and hold the custom `activate` verb. The manager accepts the patch
# only after every frozen target completed PrepareOnly successfully.
spec:
  activationApproval:
    planHash: sha256:REPLACE_WITH_STATUS_FROZEN_PLAN_HASH
    receipts:
      - deviceUID: REPLACE_WITH_FROZEN_DEVICE_UID
        upgradeUID: REPLACE_WITH_PREPARED_LEAF_METADATA_UID
        receiptHash: sha256:REPLACE_WITH_STATUS_PREPARED_RECEIPT_HASH
      # Add exactly one entry for every status.frozenPlan.targets item.
    notBefore: "2026-01-01T02:00:00Z"
    notAfter: "2026-01-01T03:00:00Z"
    approvedBy: system:serviceaccount:network-devices:cvk-rollout-activator
    approvedAt: "2026-01-01T01:55:00Z"
