# Requires group-reservation runtime, managed topology and readWrite workers.
# All fabric members must resolve to managed CiscoDevices and Kubernetes Nodes.
# The fabric, wireless-enabled DATA VLAN, fabric SSID/profile site association
# and successfully provisioned WLC must already exist. Embedded WLC is pending.
# Replace references below with existing lab resources. Use mode: report first.
# CVK preserves undeclared mappings and policy tags. It changes one binding per
# journaled PUT, and can move only bindings owned by verified receipts for this
# config UID. Omission/deletion does not remove retained native mappings.
# Public lifecycle is fixture-qualified; live appliance qualification is pending.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-fabric-vlan-ssid
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  scope: global
  managedSections: [fabric]
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-fabric-vlan-ssid-example-v1
  source:
    inline:
      catalyst_center:
        fabric:
          fabric_sites:
            - name: Global/Lab
              pub_sub_enabled: false
              authentication_template:
                name: No Authentication
              wireless_ssids:
                - name: Staff
                  vlan_name: Clients
