# Local fixture-qualified; lab qualification remains pending.
# Replace the schematic PDF with your own base64-encoded PDF/PNG/JPEG.
# Global/Lab/Building must already exist. Add planned_access_points to the
# floor to execute placement after image completion (see planned-ap-apply.yaml).
# image_path resolves only through this ConfigMap's explicit asset index.
# Removing image_path retains the remote image. Completion receipts cannot
# detect out-of-band image replacement. Report-mode images remain unsupported.
apiVersion: v1
kind: ConfigMap
metadata:
  name: catc-floor-assets
  namespace: cvk-live
data:
  cvk-floor-image-assets.json: '{"maps/floor.pdf":"floor-pdf"}'
  model.yaml: |
    catalyst_center:
      sites:
        floors:
          - name: Floor
            parent_name: Global/Lab/Building
            floor_number: 1
            rf_model: Free Space
            width: 10
            length: 15
            height: 3
            units_of_measure: meters
            image_path: maps/floor.pdf
binaryData:
  floor-pdf: 
---
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-floor-image
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  scope: global
  managedSections: [sites]
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-floor-image-example-v1
  source:
    configMapRef:
      name: catc-floor-assets
      key: model.yaml
