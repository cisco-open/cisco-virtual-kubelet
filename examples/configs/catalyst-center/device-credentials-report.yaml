# Metadata only; credential values are not compared.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-device-credential-metadata
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  managedSections:
  - network_settings
  scope: global
  mode: report
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-device-credentials-example-v1
  source:
    inline:
      catalyst_center:
        network_settings:
          device_credentials:
            cli_credentials:
            - name: CVK-Lab-CLI
              username: lab-user
            https_read_credentials:
            - name: CVK-Lab-HTTPS-Read
              username: lab-user
              port: 443
            https_write_credentials:
            - name: CVK-Lab-HTTPS-Write
              username: lab-user
              port: 443
            snmpv2_read_credentials:
            - name: CVK-Lab-SNMP-Read
            snmpv2_write_credentials:
            - name: CVK-Lab-SNMP-Write
            snmpv3_credentials:
            - name: CVK-Lab-SNMPv3
              username: lab-user
              snmp_mode: AUTHPRIV
              auth_type: SHA
              privacy_type: AES128
