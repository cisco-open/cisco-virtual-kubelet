# Optional offline non-secret defaults overlay, not a Kubernetes manifest.
# Explicit credential entry fields take precedence. Secret values and version
# counters belong in the existing model/projection contract, not this file.
defaults:
  catalyst_center:
    network_settings:
      device_credentials:
        https_read_credentials:
          port: 8443
        snmpv3_credentials:
          privacy_type: AES256
