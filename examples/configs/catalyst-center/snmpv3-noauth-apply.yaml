# Add this definition to the existing network_settings owner if one exists;
# competing section owners are refused. The definition is not assigned to a
# site or device by this example. No secret projection or version is needed.
# Metadata-only create/update and restarted no-op are native API qualified with
# simulated Kubernetes persistence. Installed actors and device SNMP access are
# not qualified by this example. Same-owner promotion is shown in
# snmpv3-promotion-apply.yaml; deletion and return to NOAUTH remain unsupported.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-snmpv3-noauth
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  scope: global
  managedSections: [network_settings]
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-snmpv3-noauth-example-v1
  source:
    inline:
      catalyst_center:
        network_settings:
          device_credentials:
            snmpv3_credentials:
              - name: CVK-Lab-SNMPv3-NoAuth
                username: cvkNoAuthUser
                snmp_mode: NOAUTHNOPRIV
