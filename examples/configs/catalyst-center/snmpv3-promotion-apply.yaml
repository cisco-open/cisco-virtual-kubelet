# Revision of snmpv3-noauth-apply.yaml: update the same config, preserving its UID
# and the credential name. If using another existing network_settings owner,
# edit that owner instead. Never create a competing owner or recreate the CR.
# Authorize this projection on NetworkController catc first:
# intentSecretSources:
# - alias: snmpv3-auth-password
#   name: catc-global-credentials
#   key: snmpv3-auth-password
# The Secret key must contain {"version":1,"value":"..."}; supply it separately.
# This does not assign the credential to a site or change switch authentication.
# For a later AUTHPRIV revision, add privacy_type: AES128 and
# privacy_password_version: 1 plus its separately authorized privacy-password
# projection/ref. Keep auth_password_version: 1 until the auth value is rotated;
# advance its version on rotation. Never drop already delivered version counters.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-snmpv3-noauth
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  scope: global
  managedSections: [network_settings]
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-snmpv3-promotion-example-v1
  secretRefs:
    - section: network_settings
      path: /device_credentials/snmpv3_credentials/0/auth_password
      source: snmpv3-auth-password
  source:
    inline:
      catalyst_center:
        network_settings:
          device_credentials:
            snmpv3_credentials:
              - name: CVK-Lab-SNMPv3-NoAuth
                username: cvkNoAuthUser
                snmp_mode: AUTHNOPRIV
                auth_type: SHA
                auth_password_version: 1
