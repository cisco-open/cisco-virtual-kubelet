# Offline input for controller-export-credentials, not a Kubernetes manifest.
# Already selected global credentials. Values remain in separately authorized
# version/value Secret envelopes; the exporter never reads them.
catalyst_center:
  network_settings:
    device_credentials:
      https_read_credentials:
        - name: CVK-Example-HTTPS-Read
          username: example-user
          password_version: 1
      https_write_credentials:
        - name: CVK-Example-HTTPS-Write
          username: example-user
          password_version: 1
      snmpv3_credentials:
        - name: CVK-Example-SNMPv3
          username: example-user
          snmp_mode: AUTHPRIV
          auth_password_version: 1
          privacy_password_version: 1
