# Stores and commits an opaque CommonSettings binding; no device deployment.
# Runtime lookup still requires applicable controller settings and target context.
apiVersion: v1
kind: ConfigMap
metadata:
  name: catc-template-binding
  namespace: cvk-live
data:
  model.yaml: |
    catalyst_center:
      templates:
        projects:
          - name: CVK-Binding-Examples
            dayn_templates:
              - name: sample
                language: JINJA
                software_type: IOS-XE
                device_types: [{product_family: Switches and Hubs}]
                variables:
                  - name: AAAEP
                    data_type: STRING
                    required: true
                    param_array: true
                    selection_type: SINGLE_SELECT
                    binding: >-
                      {"provider":"CommonSettings","source":"CommonSettings",
                      "entity":"aaa.endpoint.server","variableName":"__aaaendpointserver",
                      "attribute":"ipAddress","attributeToDisplay":"ipAddress",
                      "attributesAvailable":["ipAddress","protocol","encryptionScheme"],
                      "params":[{"type":"SITE_UUID","scope":"RUNTIME","value":null},
                      {"type":"MANAGED_DEVICE_UUID","scope":"RUNTIME","value":null}],
                      "value":null,"errorMessage":null,"sortAttribute":null,"sortValues":null,
                      "filterType":"contains","filterValue":"RADIUS",
                      "filterByAttribute":"protocol","filterSupported":true}
  cvk-template-assets.json: |
    {"CVK-Binding-Examples#sample.j2":"! {{ AAAEP }}\n"}
---
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-template-binding-apply
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  managedSections: [templates]
  scope: global
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-template-binding-example-v1
  source:
    configMapRef:
      name: catc-template-binding
      key: model.yaml
