# Controlled/API-server qualified; live inline credential qualification is pending.
# Use a new unique job name, an exclusive inventory owner and authorized lab input.
# Add this intentSecretSource to NetworkController catc:
# - alias: discovery-cli
#   name: catc-discovery-inputs
#   key: cli
# The selected key contains {"version":1,"value":"[\"device-password\"]"}.
# Supply actual credentials separately; do not put them in this file or Git.
# CLI password sets use a JSON string array inside the common versioned envelope.
# deletionPolicy must stay Retain. To rotate an owned job, advance password_list_version and
# the projected envelope counter together. Guarded Delete/absence/Create preserves
# predecessor evidence. Never change credential bytes under an applied counter.
# Opt-in source pruning uses prunePolicy: Delete; remove jobs and their secretRefs
# together. An empty discovery list with secretRefs: [] cleans up all owned jobs.
# Config deletion and native credential qualification remain pending.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-credential-discovery
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  scope: global
  managedSections: [inventory]
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-discovery-credentials-example-v1
  secretRefs:
    - section: inventory
      path: /discovery/0/password_list
      source: discovery-cli
  source:
    inline:
      catalyst_center:
        inventory:
          discovery:
            - name: CVK-Credential-Lab-101
              type: SINGLE
              ip_address_list: 198.51.100.101
              protocol_order: SSH
              user_name_list: [lab-user]
              password_list: null
              password_list_version: 1
