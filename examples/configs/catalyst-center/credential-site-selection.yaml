# Offline normalized source for controller-export-credentials with selection flags.
# Per-site mode validates but omits definitions; referenced credentials must
# already exist natively. Apply via the existing network_settings owner with
# no definition Secret references. This does not create site geometry.
catalyst_center:
  network_settings:
    device_credentials:
      https_read_credentials:
        - name: CVK-Lab-HTTPS-Read
          username: lab-user
          password_version: 1
  sites:
    areas:
      - name: Lab
        parent_name: Global
        https_read_credentials: CVK-Lab-HTTPS-Read
      - name: Other
        parent_name: Global
        https_read_credentials: Other-Existing-Credential
