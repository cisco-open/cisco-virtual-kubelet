# Policy revision of tags-owned-prune-apply.yaml: keep the same object UID.
# Source omission retains tags; deleting the CR requests owned unchanged tag cleanup.
# Consumers or uncertain original tasks retain the finalizer.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-owned-tags
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  scope: global
  managedSections: [inventory, templates]
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Delete
  taskTimeout: 15m
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-owned-tags-example-v1
  source:
    inline:
      catalyst_center:
        inventory:
          tags:
            - name: CVK-Managed-Demo
              description: Owned tag lifecycle demonstration
              system_tag: false
        templates:
          tags: []
