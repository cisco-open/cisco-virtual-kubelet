# Requires the existing group reservation runtime, ready managed device/Node
# identities for every affected fabric member, and converged native prerequisites.
# Global/Lab and the Services/Corp VNs must already exist with known memberships.
# Fixture-qualified lifecycle; accepted native fabric mutation is not lab-qualified.
# Retain preserves the original policy-creation receipt. Additive changes require
# that receipt; removals/replacement and omitted/global fabric scope are gated.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-extranet
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  scope: global
  managedSections: [fabric]
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-extranet-example-v1
  source:
    inline:
      catalyst_center:
        fabric:
          extranet_policies:
            - name: SharedServices
              provider_virtual_network: Services
              subscriber_virtual_networks: [Corp]
              fabric_sites: [Global/Lab]
