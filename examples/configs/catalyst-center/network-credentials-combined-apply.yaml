# Extend the existing network_settings owner; do not create a competing config.
# Create the empty CVK-Lab area first. Supply the projected Secret aliases and
# atomic version/value wrappers described in device-credentials-apply.yaml.
# Credential receipts must be verified before NTP or assignment writes begin.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-device-credentials
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  managedSections:
  - network_settings
  scope: global
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-combined-network-credential-example-v1
  secretRefs:
  - section: network_settings
    path: /device_credentials/cli_credentials/0/password
    source: cli-password
  - section: network_settings
    path: /device_credentials/cli_credentials/0/enable
    source: cli-enable
  - section: network_settings
    path: /device_credentials/https_read_credentials/0/password
    source: https-read-password
  - section: network_settings
    path: /device_credentials/https_write_credentials/0/password
    source: https-write-password
  - section: network_settings
    path: /device_credentials/snmpv2_read_credentials/0/read_community
    source: snmpv2-read-read-community
  - section: network_settings
    path: /device_credentials/snmpv2_write_credentials/0/write_community
    source: snmpv2-write-write-community
  - section: network_settings
    path: /device_credentials/snmpv3_credentials/0/auth_password
    source: snmpv3-auth-password
  - section: network_settings
    path: /device_credentials/snmpv3_credentials/0/privacy_password
    source: snmpv3-privacy-password
  source:
    inline:
      catalyst_center:
        network_settings:
          device_credentials:
            cli_credentials:
            - name: CVK-Lab-CLI
              username: lab-user
              password_version: 1
              enable_version: 1
            https_read_credentials:
            - name: CVK-Lab-HTTPS-Read
              username: lab-user
              port: 443
              password_version: 1
            https_write_credentials:
            - name: CVK-Lab-HTTPS-Write
              username: lab-user
              port: 443
              password_version: 1
            snmpv2_read_credentials:
            - name: CVK-Lab-SNMP-Read
              read_community_version: 1
            snmpv2_write_credentials:
            - name: CVK-Lab-SNMP-Write
              write_community_version: 1
            snmpv3_credentials:
            - name: CVK-Lab-SNMPv3
              username: lab-user
              snmp_mode: AUTHPRIV
              auth_type: SHA
              privacy_type: AES128
              auth_password_version: 1
              privacy_password_version: 1
          network:
          - name: lab
            ntp_servers:
            - 192.0.2.10
        sites:
          areas:
          - name: CVK-Lab
            parent_name: Global
            network_settings:
              network: lab
            cli_credentials: CVK-Lab-CLI
            https_read_credentials: CVK-Lab-HTTPS-Read
            https_write_credentials: CVK-Lab-HTTPS-Write
            snmpv2_read_credentials: CVK-Lab-SNMP-Read
            snmpv2_write_credentials: CVK-Lab-SNMP-Write
            snmpv3_credentials: CVK-Lab-SNMPv3
