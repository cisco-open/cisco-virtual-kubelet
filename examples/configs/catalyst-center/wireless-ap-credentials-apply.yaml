# Authorize alias ap-management-password on NetworkController catc using
# intentSecretSources; its selected Secret key must contain the atomic JSON
# {"version":1,"value":"..."}. Supply the password separately from Git.
# Global definition only; no fabric or device association is requested.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-wireless-ap-credentials
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  scope: global
  managedSections: [wireless]
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  taskTimeout: 15m
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-wireless-ap-example-v1
  secretRefs:
    - section: wireless
      path: /ap_profiles/0/management_password
      source: ap-management-password
  source:
    inline:
      catalyst_center:
        wireless:
          ap_profiles:
            - name: CVK_AP
              description: CVK isolated AP definition
              client_limit: 10
              management_password_version: 1
