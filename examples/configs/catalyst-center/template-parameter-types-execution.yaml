# Defines and commits inert comment content; does not deploy it to any device.
# SECTIONDIVIDER is omitted: this lab drops/retypes it, so native support remains open.
apiVersion: v1
kind: ConfigMap
metadata:
  name: catc-template-parameter-types
  namespace: cvk-live
data:
  model.yaml: |
    catalyst_center:
      templates:
        projects:
          - name: CVK-Parameter-Examples
            dayn_templates:
              - name: sample
                language: JINJA
                software_type: IOS-XE
                device_types: [{product_family: Switches and Hubs}]
                variables:
                  - name: counter
                    data_type: INTEGER
                    default_value: 7
                    required: true
                  - name: address
                    data_type: IPADDRESS
                    default_value: 198.51.100.1
                    binding: ""
                    additional_info: Example address parameter
                    field_name: Address
                    hint_text: Supply an IPv4 or IPv6 address
                    param_array: true
                  - name: mac
                    data_type: MACADDRESS
                    default_value: "00:11:22:33:44:55"
                  - name: label
                    data_type: STRING
                    default_value: qualification
                    not_param: true
  cvk-template-assets.json: |
    {"CVK-Parameter-Examples#sample.j2":"! {{ counter }} {{ address }} {{ mac }} {{ label }}\n"}
---
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-template-parameter-types-apply
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  managedSections: [templates]
  scope: global
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-template-parameter-types-example-v1
  source:
    configMapRef:
      name: catc-template-parameter-types
      key: model.yaml
