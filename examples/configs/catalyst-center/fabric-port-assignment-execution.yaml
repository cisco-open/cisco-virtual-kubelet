# Public create flow tested with fixtures; installed actors and lab tests pending.
# Requires explicit group-reservation runtime, managed topology and readWrite
# workers. Every affected fabric member needs a matching CiscoDevice/Node identity.
# Site, provisioning and fabric membership must already match.
# Replace selectors and ports before applying. Existing conflicts are not updated.
# Optional VLAN/group references must resolve in the existing native inventory.
# Use mode: report for read-only drift without managed-device authority.
# Updates/deletes and mixed handoff/channel models remain pending.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-fabric-port-assignment
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  scope: global
  managedSections: [fabric]
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-fabric-port-assignment-example-v1
  source:
    inline:
      catalyst_center:
        inventory:
          devices:
            - name: edge
              serial_number: FOC12345678
              site: Global/Lab/Building
              state: PROVISION
              fabric_site: Global/Lab
              fabric_roles: [EDGE_NODE]
              port_assignments:
                - interface_name: GigabitEthernet1/0/1
                  connected_device_type: USER_DEVICE
