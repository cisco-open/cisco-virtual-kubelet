# Requires the existing physical-configuration admission/runtime setup and a
# managed CiscoDevice with matching serial, address and Node identity.
# Replace the example selectors; Global/Lab/Building must already exist.
# Fixture-qualified only. REPROVISION is an explicit revision-bound action:
# a completed revision is not submitted again merely because reconciliation runs.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-wired-provision
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  scope: global
  managedSections: [inventory]
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-wired-provision-example-v1
  source:
    inline:
      catalyst_center:
        inventory:
          devices:
            - name: edge
              serial_number: FOC12345678
              device_ip: 192.0.2.100
              site: Global/Lab/Building
              state: PROVISION
