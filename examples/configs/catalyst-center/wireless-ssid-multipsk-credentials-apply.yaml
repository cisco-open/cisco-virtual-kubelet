# Authorize aliases ssid-passphrase, multi-4 and multi-0 on NetworkController catc using
# intentSecretSources; its selected Secret key must contain the atomic JSON
# {"version":1,"value":"..."}. Supply the values separately from Git.
# Rotate one key by changing its projected JSON version/value and matching model counter.
# Priority is the semantic key identity; update secretRefs paths when reordering rows.
# This example remains disabled; it does not test actual client authentication.
# Global definition only; no fabric or device association is requested.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-wireless-ssid-multipsk-credentials
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  scope: global
  managedSections: [wireless]
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  taskTimeout: 15m
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-wireless-ssid-multipsk-example-v1
  secretRefs:
    - section: wireless
      path: /ssids/0/passphrase
      source: ssid-passphrase
    - section: wireless
      path: /ssids/0/multi_psk_settings/0/passphrase_wo
      source: multi-4
    - section: wireless
      path: /ssids/0/multi_psk_settings/1/passphrase_wo
      source: multi-0
  source:
    inline:
      catalyst_center:
        wireless:
          ssids:
            - name: CVK_MULTI_PSK_SSID
              auth_type: WPA2_PERSONAL
              wlan_type: Enterprise
              ssid_radio_type: 5GHz
              enabled: false
              auth_key_psk: true
              rsn_cipher_suite_ccmp128: true
              passphrase_version: 1
              multi_psk_settings:
                - priority: 4
                  passphrase_type: ASCII
                  passphrase_wo_version: 1
                - priority: 0
                  passphrase_type: ASCII
                  passphrase_wo_version: 1
