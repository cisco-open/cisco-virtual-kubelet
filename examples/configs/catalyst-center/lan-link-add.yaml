# Replace these documentation addresses, interfaces and pool with actual
# recorded LAN discovery members and a same-site IPv4 LAN reservation.
# Requires managed topology, group-reservation admission and readWrite workers.
# Every link is preflighted before one is journaled. ADD_LINK and owned
# DELETE_LINK may share a model on disjoint ports; see lan-link-mixed.yaml.
# Discovery remains pending.
# The existing DeviceOperation workers verify both endpoints after native task
# completion. Member/manager settlement must finish before the next link.
# Public lifecycle is fixture-qualified; installed/lab execution is pending.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-lan-links
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  scope: global
  managedSections: [lan_automation]
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-lan-link-example-v1
  source:
    inline:
      catalyst_center:
        lan_automation:
          links:
            - name: access-link
              action: ADD_LINK
              primary_device_management_ip_address: 198.51.100.10
              primary_device_interface_name: TenGigabitEthernet1/0/1
              secondary_device_management_ip_address: 198.51.100.11
              secondary_device_interface_name: TenGigabitEthernet1/0/2
              ip_pool_name: LAN-ACCESS
