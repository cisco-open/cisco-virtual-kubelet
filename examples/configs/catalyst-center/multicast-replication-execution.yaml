# Fixture-qualified create and additive update through public group reconciliation.
# Requires the explicit group reservation runtime and matching managed identities
# for every fabric member. Fabric site/authentication, L3 VN membership, IP pool
# reservation and RP roles must already exist and match the resolved model.
# Replace names and sites with qualified lab inventory. Range/RP removal,
# wireless composition and installed-actor/live qualification pending.
# Declared VNs converge before the replication mode is changed.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-multicast-replication
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  scope: global
  managedSections: [fabric]
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-multicast-replication-example-v1
  source:
    inline:
      catalyst_center:
        fabric:
          fabric_sites:
            - name: Global/Lab
              pub_sub_enabled: false
              authentication_template:
                name: No Authentication
              multicast:
                replication_mode: NATIVE_MULTICAST
                virtual_networks:
                  - name: Corp
                    ip_pool_name: access
                    ipv4_ssm_ranges: [232.0.0.0/8]
                    multicast_rps:
                      - rp_location: FABRIC
                        fabric_rps: [border-a]
