# Use one owner for templates; combine tags and template definitions in that manifest.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-tags-apply
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  managedSections: [templates]
  scope: global
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-tag-example-v1
  source:
    inline:
      catalyst_center:
        templates:
          tags:
            - name: CVK-Lab-Tag
              description: CVK lab tag
              system_tag: false
