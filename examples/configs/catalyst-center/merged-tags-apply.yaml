# Inventory overrides the same tag name in templates; one config owns both sections.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-merged-tags-apply
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  managedSections: [templates, inventory]
  scope: global
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-tag-example-v1
  source:
    inline:
      catalyst_center:
        templates:
          tags:
            - name: CVK-Lab-Tag
              description: Template fallback
              system_tag: false
        inventory:
          tags:
            - name: CVK-Lab-Tag
              description: Inventory takes precedence
              system_tag: false
