# Offline snapshot input for controller-export-sites --source-configmap.
# The image is a generated 640x480 test grid. Only this explicit snapshot is read;
# image_path is a logical name resolved by its index, not a local file or URL.
# The floor's missing geometry/RF fields use pinned defaults. Floor units are
# explicitly meters; planned-AP coordinates are feet, as the native API requires.
apiVersion: v1
kind: ConfigMap
metadata:
  name: catc-site-defaults-design
  namespace: cvk-live
data:
  cvk-floor-image-assets.json: '{"maps/demo.png":"demo-png"}'
  model.yaml: |
    catalyst_center:
      sites:
        areas:
          - name: CVK-Default-Design
            parent_name: Global
        buildings:
          - name: Building
            parent_name: Global/CVK-Default-Design
            country: United States
            latitude: 37.33812
            longitude: -121.88612
        floors:
          - name: Floor
            parent_name: Global/CVK-Default-Design/Building
            floor_number: 1
            units_of_measure: meters
            image_path: maps/demo.png
            planned_access_points:
              - name: CVK-Design-AP
                ap_type: AP9130I
                position_x: 4.5
                position_y: 6
                position_z: 4
                mac_address: 02:00:00:00:00:01
                radios:
                  - band: 5
                    channel: 36
                    tx_power: 12
                    antenna_name: Internal-9130-5GHz
                    antenna_azimuth: 90
                    antenna_elevation: -10
binaryData:
  demo-png: 
