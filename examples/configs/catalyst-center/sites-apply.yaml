# Requires the matching journal CRD, manager and worker. Uses global site ownership.
# Retains sites on intent removal/deletion; does not upload maps or place APs.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-sites-apply
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  scope: global
  managedSections: [sites]
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  driftDetectInterval: 5m
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-site-apply-example-v1
  source:
    inline:
      catalyst_center:
        sites:
          areas:
            - name: CVK-Lab
              parent_name: Global
