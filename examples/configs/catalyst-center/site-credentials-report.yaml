# Use the existing network_settings owner. The area and named global credential
# definitions must already exist. This example contains references, not secrets.
# Omit a slot to retain it. Inheritance removal is report-only until the
# appliance supports verified restoration; apply rejects explicit null.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-site-credentials-report
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  scope: global
  managedSections: [network_settings]
  mode: report
  prunePolicy: Retain
  deletionPolicy: Retain
  driftDetectInterval: 5m
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-site-credential-example-v1
  source:
    inline:
      catalyst_center:
        network_settings: {}
        sites:
          areas:
            - name: CVK-Lab
              parent_name: Global
              cli_credentials: CVK-Lab-CLI
              https_read_credentials: CVK-Lab-HTTPS-Read
              https_write_credentials: CVK-Lab-HTTPS-Write
              snmpv2_read_credentials: CVK-Lab-SNMP-Read
              snmpv2_write_credentials: CVK-Lab-SNMP-Write
              snmpv3_credentials: CVK-Lab-SNMPv3
