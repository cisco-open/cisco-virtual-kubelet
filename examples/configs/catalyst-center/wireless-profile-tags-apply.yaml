# Prerequisites: Global/CVK-Lab, an existing CVK-Lab-Disabled SSID, and
# the existing default-ap-profile AP profile. Verify identities before use.
# This defines profile metadata; it does not provision a WLC or an AP.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-wireless-profile-tags
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  managedSections: [network_profiles]
  scope: global
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-wireless-profile-tags-example-v1
  source:
    inline:
      catalyst_center:
        network_profiles:
          wireless:
            - name: CVK-Lab-Wireless
              ssid_details:
                - name: CVK-Lab-Disabled
                  wlan_profile_name: CVK-Lab-WLAN
              sites: [Global/CVK-Lab]
              site_tags:
                - name: CVK-Lab-Site
                  sites: [Global/CVK-Lab]
                  ap_profile_name: default-ap-profile
              policy_tags:
                - name: CVK-Lab-Policy
                  sites: [Global/CVK-Lab]
