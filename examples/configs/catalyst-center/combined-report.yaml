# A single resolved model can report multiple supported sections together.
# No site, network setting or authentication policy is changed by this manifest.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-combined-report
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  managedSections: [sites, network_settings, authentication_templates]
  scope: global
  mode: report
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-combined-report-example-v1
  source:
    inline:
      catalyst_center:
        sites:
          areas:
            - name: CVK-Lab
              parent_name: Global
              network_settings:
                network: lab-settings
        network_settings:
          network:
            - name: lab-settings
              timezone: Europe/Berlin
              ntp_servers: [192.0.2.10]
        authentication_templates:
          - name: Closed Authentication
            authentication_order: dot1x
            dot1x_to_mab_fallback_timeout: 10
            wake_on_lan: false
            number_of_hosts: Single
