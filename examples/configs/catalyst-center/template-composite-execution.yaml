# Applies regular and composite definitions and matching commits. No device deployment.
# Use one owner for the templates section; do not apply alongside another templates owner.
# Composite writes wait for regular commit settling; waiting survives worker restart.
# Requires matching journal CRDs (including preparedAt), manager and worker. Retain policies preserve objects.
apiVersion: v1
kind: ConfigMap
metadata:
  name: catc-template-composite
  namespace: cvk-live
data:
  model.yaml: |
    catalyst_center:
      templates:
        projects:
          - name: CVK-Lab-Templates
            dayn_templates:
              - name: sample
                description: CVK example
                language: JINJA
                software_type: IOS-XE
                device_types:
                  - product_family: Switches and Hubs
                variables: []
              - name: combined
                composite: true
                containing_templates: [sample]
                language: JINJA
                software_type: IOS-XE
                device_types:
                  - product_family: Switches and Hubs
  cvk-template-assets.json: |
    {"CVK-Lab-Templates#sample.j2":"! CVK template example\n"}
---
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-template-composite-apply
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  managedSections: [templates]
  scope: global
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-template-content-example-v1
  source:
    configMapRef:
      name: catc-template-composite
      key: model.yaml
