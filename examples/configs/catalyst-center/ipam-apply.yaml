# Requires matching journal CRDs, manager and worker, and the empty CVK-Lab area.
# Allocates example address space; use an unallocated lab range. Retain only.
# network_settings has one owner: combine with other settings in that owner manifest.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-ipam-apply
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  managedSections: [network_settings]
  scope: global
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-ipam-apply-example-v1
  source:
    inline:
      catalyst_center:
        sites:
          areas:
            - name: CVK-Lab
              parent_name: Global
              ip_pools_reservations: [access]
        network_settings:
          ip_pools:
            - name: cvk-global-v4
              type: Generic
              ip_address_space: IPv4
              ip_pool_cidr: 192.0.2.0/24
              dhcp_servers: []
              dns_servers: [192.0.2.53]
              ip_pools_reservations:
                - name: access
                  type: LAN
                  subnet: 192.0.2.128
                  prefix_length: 25
                  gateway: 192.0.2.129
