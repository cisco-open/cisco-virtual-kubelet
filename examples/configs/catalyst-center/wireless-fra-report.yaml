# Global definition only; no fabric or device association is requested.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-wireless-fra-report
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  scope: global
  managedSections: [feature_templates]
  mode: report
  prunePolicy: Retain
  deletionPolicy: Retain
  taskTimeout: 15m
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-wireless-fra-example-v1
  source:
    inline:
      catalyst_center:
        feature_templates:
          wireless:
            rrm_fra:
              - name: CVK_FRA
                radio_band: 2.4GHz_5GHz
                fra_freeze: false
                fra_status: false
                fra_interval: 3
                fra_sensitivity: MEDIUM
