# Fixture-qualified public create lifecycle; installed actors and lab tests pending.
# Requires explicit group-reservation runtime, managed topology and readWrite
# network workers. Every affected fabric member must have a matching managed
# CiscoDevice/Node identity. Existing site, provisioning and fabric membership
# must already match. Replace the example selector and ports before applying.
# The id is a local model key, not the channel number assigned by Catalyst Center.
# Protocol is explicit because the qualified API requires it on creation.
# Change mode to Report for read-only native drift without managed-node authority.
# Base native provisioning/membership must still converge in Report mode.
# VLAN options and channel updates/deletion remain pending.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-fabric-port-channel
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  scope: global
  managedSections: [fabric]
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-fabric-port-channel-example-v1
  source:
    inline:
      catalyst_center:
        inventory:
          devices:
            - name: edge
              serial_number: FOC12345678
              site: Global/Lab/Building
              state: PROVISION
              fabric_site: Global/Lab
              fabric_roles: [EDGE_NODE]
              port_channels:
                - id: 7
                  connected_device_type: TRUNK
                  protocol: LACP
                  interface_names:
                    - GigabitEthernet1/0/1
                    - GigabitEthernet1/0/2
