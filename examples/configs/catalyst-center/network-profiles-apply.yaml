# Apply only after the referenced templates and site exist.
# Profile membership does not deploy a template to a device.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-network-profiles
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  managedSections: [network_profiles]
  scope: global
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-profile-example-v1
  source:
    inline:
      catalyst_center:
        network_profiles:
          switching:
            - name: CVK-Lab-Switching
              dayn_templates: [CVK-Lab#Baseline]
              onboarding_templates: []
              sites: [Global/CVK-Lab]
