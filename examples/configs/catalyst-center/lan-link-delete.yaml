# Update the SAME NetworkControllerConfig used for the verified ADD_LINK.
# Use the same link name, management addresses and exact interfaces. This does
# not adopt a pre-existing unowned link. Original ADD reservations must retire.
# All DELETE_LINK declarations are checked before any one is prepared.
# The pool is optional for DELETE_LINK; when omitted CVK resolves verified ADD
# ownership without adding ipPoolName to the native request. Mixed actions on
# disjoint ports are supported; see lan-link-mixed.yaml. Unused stale snapshots
# cancel and settle before fresh preparation, only with unchanged source/ownership
# and physical scope. Discovery is pending. Retain policies protect other resources.
# Existing DeviceOperation workers must verify the bounded deconfiguration CLI
# profile before completion. A successful CC task alone cannot release claims.
# Public lifecycle is fixture-qualified; hardware/installed actors are pending.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-lan-links
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  scope: global
  managedSections: [lan_automation]
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-lan-link-delete-example-v1
  source:
    inline:
      catalyst_center:
        lan_automation:
          links:
            - name: access-link
              action: DELETE_LINK
              primary_device_management_ip_address: 198.51.100.10
              primary_device_interface_name: TenGigabitEthernet1/0/1
              secondary_device_management_ip_address: 198.51.100.11
              secondary_device_interface_name: TenGigabitEthernet1/0/2
              # ip_pool_name: LAN-ACCESS  # Optional for DELETE_LINK
