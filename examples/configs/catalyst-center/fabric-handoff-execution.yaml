# Fixture-qualified mixed handoffs; installed actors and lab qualification pending.
# Requires topology.configurationReservationProtocol=controller-configuration-group-v1,
# managed topology, readWrite network workers and matching managed CiscoDevice/Node
# identities for EVERY affected local/transit fabric member and transit control plane.
# Base device provisioning, fabric membership, VN/gateway and both transits must
# already converge. Replace all example names, interface and addresses before use.
# Runs one handoff at a time; each group must settle before the next action starts.
# Set mode: report to inspect native drift without managed reservations or writes.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-fabric-handoffs
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  scope: global
  managedSections: [fabric]
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-fabric-handoff-example-v1
  source:
    inline:
      catalyst_center:
        inventory:
          devices:
            - name: border
              site: Global/Lab/Building
              state: PROVISION
              fabric_site: Global/Lab
              fabric_roles: [BORDER_NODE]
        fabric:
          border_devices:
            - name: border
              border_types: [LAYER_2, LAYER_3]
              local_autonomous_system_number: 65000
              default_exit: true
              import_external_routes: true
              sda_transit: SDA
              l2_handoffs:
                l2_with_anycast_gateway:
                  - l3_virtual_network: Campus
                    ip_pool_name: Users
                    external_vlan: 400
                    interfaces: [GigabitEthernet1/0/1]
              l3_handoffs:
                - name: Transit
                  interfaces:
                    - name: GigabitEthernet1/0/1
                      virtual_networks:
                        - name: Users
                          vlan: 300
                          local_ip_address: 192.0.2.1/30
                          peer_ip_address: 192.0.2.2/30
