# Local fixture-qualified; lab qualification remains pending.
# The hierarchy site Global/Lab must already exist.
# Apply supports creation and unchanged sites. Authentication/pub-sub changes,
# nested fabric resources, pending-event application and deletion remain pending.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-fabric-sites-apply
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  scope: global
  managedSections: [fabric]
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-fabric-sites-example-v1
  source:
    inline:
      catalyst_center:
        fabric:
          fabric_sites:
            - name: Global/Lab
              authentication_template:
                name: Closed Authentication
              pub_sub_enabled: false
