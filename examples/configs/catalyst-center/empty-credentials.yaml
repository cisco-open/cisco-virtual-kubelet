# Resolved model input, not a Kubernetes manifest.
# With prunePolicy: Retain, this selects no credential writes. Existing native
# credentials and ownership receipts remain retained. This is not deletion.
# Remove unused secretRefs only after outstanding operations have settled.
catalyst_center:
  network_settings:
    device_credentials:
      cli_credentials: []
      https_read_credentials: []
      https_write_credentials: []
      snmpv2_read_credentials: []
      snmpv2_write_credentials: []
      snmpv3_credentials: []
