# Inventory and template tag writes require the same config identity.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-inventory-tags-apply
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  managedSections: [inventory]
  scope: global
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-tag-example-v1
  source:
    inline:
      catalyst_center:
        inventory:
          tags:
            - name: CVK-Lab-Tag
              description: CVK lab tag
              system_tag: false
