# Requires an existing fabric with managed CiscoDevice/Node identities for every
# root/descendant-zone member and the existing group reservation runtime. Native
# accepted update/device behavior remain unqualified; test before production use.
# Resolved NetAsCode 0.5.0 fabric-specific override. The hierarchy area must
# already exist. Report works for missing fabrics and observed profile drift.
# Apply requires the existing group runtime and all-member device admission.
# The public lifecycle is fixture-qualified; accepted live fabric updates remain
# unqualified because the current lab has no fabric sites.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-fabric-authentication-apply
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  scope: global
  managedSections: [fabric]
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-fabric-authentication-example-v1
  source:
    inline:
      catalyst_center:
        fabric:
          fabric_sites:
            - name: Global/Lab
              pub_sub_enabled: false
              authentication_template:
                name: Closed Authentication
                authentication_order: dot1x
                dot1x_to_mab_fallback_timeout: 10
                wake_on_lan: false
                number_of_hosts: Single
                bpdu_guard: false
