# Creates unassigned global credential definitions; no device or site assignment.
# Add these intentSecretSources to NetworkController catc:
# intentSecretSources:
# - alias: cli-password
#   name: catc-global-credentials
#   key: cli-password
# - alias: cli-enable
#   name: catc-global-credentials
#   key: cli-enable
# - alias: https-read-password
#   name: catc-global-credentials
#   key: https-read-password
# - alias: https-write-password
#   name: catc-global-credentials
#   key: https-write-password
# - alias: snmpv2-read-read-community
#   name: catc-global-credentials
#   key: snmpv2-read-read-community
# - alias: snmpv2-write-write-community
#   name: catc-global-credentials
#   key: snmpv2-write-write-community
# - alias: snmpv3-auth-password
#   name: catc-global-credentials
#   key: snmpv3-auth-password
# - alias: snmpv3-privacy-password
#   name: catc-global-credentials
#   key: snmpv3-privacy-password
# Each selected Secret key must contain an atomic JSON object with exactly
# {"version":1,"value":"..."}. Supply values separately; never store them in Git.
apiVersion: config.cisco.vk/v1alpha1
kind: NetworkControllerConfig
metadata:
  name: catc-device-credentials
  namespace: cvk-live
spec:
  controllerRef:
    name: catc
  managedSections:
  - network_settings
  scope: global
  mode: apply
  prunePolicy: Retain
  deletionPolicy: Retain
  modelSource:
    format: netascode-catalyst-center
    modelVersion: 0.5.0
    resolved: true
    exporter: cvk-device-credentials-example-v1
  secretRefs:
  - section: network_settings
    path: /device_credentials/cli_credentials/0/password
    source: cli-password
  - section: network_settings
    path: /device_credentials/cli_credentials/0/enable
    source: cli-enable
  - section: network_settings
    path: /device_credentials/https_read_credentials/0/password
    source: https-read-password
  - section: network_settings
    path: /device_credentials/https_write_credentials/0/password
    source: https-write-password
  - section: network_settings
    path: /device_credentials/snmpv2_read_credentials/0/read_community
    source: snmpv2-read-read-community
  - section: network_settings
    path: /device_credentials/snmpv2_write_credentials/0/write_community
    source: snmpv2-write-write-community
  - section: network_settings
    path: /device_credentials/snmpv3_credentials/0/auth_password
    source: snmpv3-auth-password
  - section: network_settings
    path: /device_credentials/snmpv3_credentials/0/privacy_password
    source: snmpv3-privacy-password
  source:
    inline:
      catalyst_center:
        network_settings:
          device_credentials:
            cli_credentials:
            - name: CVK-Lab-CLI
              username: lab-user
              password_version: 1
              enable_version: 1
            https_read_credentials:
            - name: CVK-Lab-HTTPS-Read
              username: lab-user
              port: 443
              password_version: 1
            https_write_credentials:
            - name: CVK-Lab-HTTPS-Write
              username: lab-user
              port: 443
              password_version: 1
            snmpv2_read_credentials:
            - name: CVK-Lab-SNMP-Read
              read_community_version: 1
            snmpv2_write_credentials:
            - name: CVK-Lab-SNMP-Write
              write_community_version: 1
            snmpv3_credentials:
            - name: CVK-Lab-SNMPv3
              username: lab-user
              snmp_mode: AUTHPRIV
              auth_type: SHA
              privacy_type: AES128
              auth_password_version: 1
              privacy_password_version: 1
