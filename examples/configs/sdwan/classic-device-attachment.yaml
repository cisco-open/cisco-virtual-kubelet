sdwan:
  edge_feature_templates:
    banner_templates:
      - name: CVK-DEVICE-BANNER
        description: CVK isolated banner
        device_types: [C8000V]
        login: CVK lab fixture
    system_templates:
      - name: CVK-DEVICE-SYSTEM
        description: CVK isolated system
        device_types: [C8000V]
        hostname_variable: cvkHostname
        system_ip_variable: cvkSystemIP
        site_id_variable: cvkSiteID
  edge_device_templates:
    - name: CVK-DEVICE-TEMPLATE
      description: CVK isolated device template
      device_model: C8000V
      system_template: CVK-DEVICE-SYSTEM
      banner_template: CVK-DEVICE-BANNER
  sites:
    - id: 101
      routers:
        - chassis_id: cvk-lab-router-1
          device_template: CVK-DEVICE-TEMPLATE
          device_variables:
            cvkHostname: cvk-router-1
            cvkSystemIP: 192.0.2.101
            cvkSiteID: "101"
