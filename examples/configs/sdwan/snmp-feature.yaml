sdwan:
  feature_profiles:
    system_profiles:
      - name: CVK-SNMP-FEATURES
        snmp:
          shutdown: true
          contact_person: ops@example.invalid
          location: CVK lab
          views:
            - name: CVK-SNMP-VIEW
              oids:
                - id: 1.3.6.1
                  exclude: false
          communities:
            - user_label: CVK-SNMP-RO
              name_variable: snmp_community
              authorization: read-only
              view: CVK-SNMP-VIEW
          groups:
            - name: CVK-SNMP-GROUP
              security_level: auth-priv
              view: CVK-SNMP-VIEW
          users:
            - name: CVK-SNMP-USER
              group: CVK-SNMP-GROUP
              authentication_protocol: sha
              authentication_password_variable: snmp_auth_password
              privacy_protocol: aes-cfb-128
              privacy_password_variable: snmp_privacy_password
          trap_target_servers:
            - user_label: CVK-SNMP-TARGET
              ip: 192.0.2.162
              port: 162
              vpn_id: 0
              user: CVK-SNMP-USER
              source_interface: GigabitEthernet1
