sdwan:
  policy_objects:
    site_lists:
      - name: CVK-CENTRAL-SITES
        site_ids: [101]
      - name: CVK-CENTRAL-SPOKES
        site_ids: [102]
    vpn_lists:
      - name: CVK-CENTRAL-VPNS
        vpn_ids: [10]
  centralized_policies:
    activated_policy: CVK-CENTRAL-POLICY
    feature_policies:
      - name: CVK-CENTRAL-POLICY
        description: Managed by CVK
        mesh_topology:
          - policy_definition: CVK-CENTRAL-MESH
        hub_and_spoke_topology:
          - policy_definition: CVK-CENTRAL-HUBSPOKE
        vpn_membership:
          - policy_definition: CVK-CENTRAL-MEMBERSHIP
    definitions:
      control_policy:
        vpn_membership:
          - name: CVK-CENTRAL-MEMBERSHIP
            description: Managed by CVK
            groups:
              - site_list: CVK-CENTRAL-SITES
                vpn_lists: [CVK-CENTRAL-VPNS]
        mesh_topology:
          - name: CVK-CENTRAL-MESH
            description: Managed by CVK
            vpn_list: CVK-CENTRAL-VPNS
            mesh_groups:
              - name: CVK-MESH-GROUP
                site_lists: [CVK-CENTRAL-SITES]
        hub_and_spoke_topology:
          - name: CVK-CENTRAL-HUBSPOKE
            description: Managed by CVK
            vpn_list: CVK-CENTRAL-VPNS
            hub_and_spoke_sites:
              - name: CVK-HUBSPOKE-GROUP
                equal_preference: true
                advertise_tloc: false
                spokes:
                  - site_list: CVK-CENTRAL-SPOKES
                    hubs:
                      - site_list: CVK-CENTRAL-SITES
