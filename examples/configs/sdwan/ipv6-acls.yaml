sdwan:
  feature_profiles:
    service_profiles:
      - name: CVK-SERVICE-IPV6-ACL-PROFILE
        ipv6_acls:
          - name: CVK-SERVICE-IPV6-ACL
            default_action: drop
            sequences:
              - id: 10
                name: SSH6-ACCEPT
                base_action: accept
                match_entries:
                  source_data_prefix: 2001:db8::/32
                  destination_ports: [22]
                  next_header: 6
                actions:
                  counter_name: CVK-SSH6-ACCEPT
                  log: true
                  traffic_class: 32
    transport_profiles:
      - name: CVK-TRANSPORT-IPV6-ACL-PROFILE
        ipv6_acls:
          - name: CVK-TRANSPORT-IPV6-ACL
            default_action: drop
            sequences:
              - id: 10
                name: SSH6-DROP
                base_action: drop
                match_entries:
                  destination_data_prefix: 2001:db8:1::/48
                  destination_ports: [22]
                actions:
                  counter_name: CVK-SSH6-DROP
                  log: true
