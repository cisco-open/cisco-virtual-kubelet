sdwan:
  feature_profiles:
    transport_profiles:
      - name: CVK-TRANSPORT-MGMT-VPN-PROFILE
        management_vpn:
          name: CVK-TRANSPORT-MGMT-VPN
          vpn_description: CVK management VPN
          ipv4_primary_dns_address: 192.0.2.53
          ipv6_primary_dns_address: 2001:db8::53
          host_mappings:
            - hostname: cvk.example.test
              ips: [192.0.2.10]
          ipv4_static_routes:
            - network_address: 192.0.2.0
              subnet_mask: 255.255.255.0
              gateway: nexthop
              next_hops:
                - address: 192.0.2.1
                  administrative_distance: 1
          ipv6_static_routes:
            - prefix: 2001:db8:1::/64
              gateway: nexthop
              next_hops:
                - address: 2001:db8::1
                  administrative_distance: 1
