# Cisco-IOS-XE YANG releases the config driver currently supports.
#
# A release listed here has a directory at schema/yang/<version>/ containing
# the authoritative YANG modules; the schema-sync tool (tools/cisco-vk-yang-sync)
# generates Go types, CRD OpenAPI fragments, and per-family writer skeletons
# from those modules. Do not hand-edit the generated files.
#
# status values:
#   - supported:   the driver ships writers for this release
#   - experimental: the driver compiles for this release but its writers
#                   have not been integration-tested
#   - deprecated:  supported for one more CVK release, then removed

releases:
  - version: "1791"      # IOS-XE 17.9.1 — Phase-1 target
    status: supported
    default: true
    notes: >
      Phase-1 scaffold runs against the 17.9.1 YANG modules.
      Device software versions 17.9.x are expected to be
      functionally compatible for the Phase-1 family set.

  - version: "1715"      # IOS-XE 17.15 — C9KV legacy
    status: experimental
    notes: >
      Custom-writer divergences are encoded in the writers package
      version override table; per-release YANG modules and ygot
      types are not yet vendored under schema/yang/1715/. Treat as
      an integration target until Phase 3 of the YANG-version
      action plan completes.

  - version: "1716"      # IOS-XE 17.16 — C8000V
    status: experimental
    notes: >
      Same status as 1715: writer support for the BGP / prefix-list /
      ip-community-list legacy YANG shapes is in place, but the
      per-release YANG bundle and ygot-generated types remain to be
      vendored under schema/yang/1716/.

  - version: "1718"      # IOS-XE 17.18 — C9300-24P baseline
    status: supported
    notes: >
      Baseline release the writers are authored against. Override
      table entries do not apply at this release; writers run
      their unconditional shape.

  - version: "2601"      # IOS-XE 26.01 — C9300-24P major-release profile
    status: experimental
    notes: >
      Compatibility profile for IOS-XE 26.01. The NetAsCode model
      remains canonical; version-specific YANG deltas are handled in
      writer overrides. Initial live-device coverage identified the
      ip_domain name leaf moving under name-container/name-no-vrf.
