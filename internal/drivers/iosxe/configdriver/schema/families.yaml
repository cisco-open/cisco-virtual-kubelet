  depends_on: []
  portal: https://netascode.cisco.com/docs/data_models/iosxe/device/snmp_server/

aaa:
  yang_paths:
    - /Cisco-IOS-XE-native:native/aaa
  shape: singleton
  depends_on: []
  portal: https://netascode.cisco.com/docs/data_models/iosxe/device/aaa/

banner:
  yang_paths:
    - /Cisco-IOS-XE-native:native/banner
  shape: singleton
  depends_on: []
  portal: https://netascode.cisco.com/docs/data_models/iosxe/device/banner/

line:
  yang_paths:
    - /Cisco-IOS-XE-native:native/line
  shape: singleton
  depends_on: [aaa]
  portal: https://netascode.cisco.com/docs/data_models/iosxe/device/line/

cdp:
  yang_paths:
    - /Cisco-IOS-XE-native:native/cdp
  shape: singleton
  depends_on: []
  portal: https://netascode.cisco.com/docs/data_models/iosxe/device/cdp/

lldp:
  yang_paths:
    - /Cisco-IOS-XE-native:native/lldp
  shape: singleton
  depends_on: []
  portal: https://netascode.cisco.com/docs/data_models/iosxe/device/lldp/

prefix_list:
  yang_paths:
    - /Cisco-IOS-XE-native:native/ip/prefix-list
  shape: keyed_list
  key_fields: [name]
  depends_on: []
  portal: https://netascode.cisco.com/docs/data_models/iosxe/device/prefix_list/

route_map:
  yang_paths:
    - /Cisco-IOS-XE-native:native/route-map
  shape: keyed_list
  key_fields: [name]
  depends_on: [prefix_list, access_list_standard, access_list_extended]
  portal: https://netascode.cisco.com/docs/data_models/iosxe/device/route_map/

interface_switchport:
  # Layer-2 switchport configuration overlays onto existing ethernet
  # interfaces; it does not own its own YANG list but modifies the
  # switchport container within each interface entry.
  yang_paths:
    - /Cisco-IOS-XE-native:native/interface/GigabitEthernet/switchport
  shape: keyed_list
  key_fields: [type, name]
  depends_on: [interface_ethernet, vlan]
  portal: https://netascode.cisco.com/docs/data_models/iosxe/interface/switchport/

