# Test 03 — configPrereqs deletion-driven cleanup
#
# Creates a synthetic CiscoDevice that points at the same physical
# device, carrying spec.configPrereqs. The CiscoDeviceReconciler
# materialises those prereqs into a synthetic IOSXEConfig that
# day-0 reconciles. Deleting this CiscoDevice triggers the cleanup
# path under test.
#
# Override the address / username / credentialSecretRef for your lab:
#
#   sed -e "s/10\.1\.1\.1/<your-ip>/" \
#       -e "s/cat9k-creds/<your-secret>/" \
#       -e "s/username: cisco/username: <your-user>/" \
#       00-apply-device.yaml | kubectl apply -f -
#
# IMPORTANT — Wave-9 API simplification: configPrereqs.managedFamilies
# + configPrereqs.source.inline (the original Phase-3 shape) was
# replaced by configPrereqs.configuration in the Wave-9 CRD bump.
# The reconciler now scopes configPrereqs to the apphosting-prereq
# family set (interface_virtual_port_group, dhcp,
# access_list_extended); for arbitrary families use a regular
# IOSXEConfig with pruneOnRelinquish=true.

---
apiVersion: cisco.vk/v1alpha1
kind: CiscoDevice
metadata:
  name: test-03-prereq-device
  namespace: cisco-vk-smoke
  labels:
    cisco.vk/release-blocker-test: "03-configprereqs-cleanup"
spec:
  driver: XE
  address: "10.1.1.1"
  port: 443
  username: cisco
  credentialSecretRef:
    name: cat9k-creds
  tls:
    enabled: true
    insecureSkipVerify: true
  transport: restconf
  xe:
    networking:
      interface:
        type: Management
        management:
          dhcp: true
  # configPrereqs is the test's payload. The reconciler creates a
  # synthetic IOSXEConfig from this template; on CiscoDevice delete,
  # the finalizer empties the source + flips pruneOnRelinquish=true
  # to drive the cleanup path under test.
  configPrereqs:
    configuration:
      iosxe:
        devices:
          - name: test-03-prereq-device
            configuration:
              interface_virtual_port_group:
                interfaces:
                  - id: 9
                    description: "cisco-vk release-blocker test 03"
                    ipv4_address: 10.255.255.98
                    ipv4_address_mask: 255.255.255.255
