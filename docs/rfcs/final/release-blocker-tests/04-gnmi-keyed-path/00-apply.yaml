# Test 04 — gNMI keyed-path PathSpec
#
# Sets a description on a single ethernet interface to prove that
# structured PathSpec survives the gNMI Set wire encoding intact (the
# slashes in the keyed-list `name` value must not be interpreted as
# additional path segments).
#
# Defaults to GigabitEthernet1/0/24 (the operator-approved interface
# the preflight gate enforces). For non-default lab fixtures, sed the
# manifest before apply, e.g.:
#
#   sed -e "s/GigabitEthernet/${INTF_TYPE}/" \
#       -e 's/"1\/0\/24"/"<your-port>"/' 00-apply.yaml | kubectl apply -f -
#
# Pre-flight CONFIRMS the chosen port is unused via --intf-approved=
# so this is a deliberate, reviewer-approved port pick.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-04-data
  namespace: cisco-vk-smoke
data:
  data.nac.yaml: |
    iosxe:
      devices:
        - name: cat9k-smoke
          configuration:
            interface_ethernet:
              interfaces:
                - type: GigabitEthernet
                  name: "1/0/24"
                  description: "cisco-vk release-blocker test 04 — wave 5A-fu/7B"

---
apiVersion: config.cisco.vk/v1alpha1
kind: IOSXEConfig
metadata:
  name: test-04-gnmi-keyed-path
  namespace: cisco-vk-smoke
  labels:
    cisco.vk/release-blocker-test: "04-gnmi-keyed-path"
spec:
  deviceRef:
    name: cat9k-smoke
  managedFamilies:
    - interface_ethernet
  transactional: false   # gNMI / RESTCONF non-transactional path
  writeStartup: false
  driftPolicy: revert    # the test wants the description to be applied
  driftDetectInterval: 30s
  source:
    configMapRef:
      name: test-04-data
      key: data.nac.yaml
