# Test 3 — IOSXEDiagnostic with allowSecrets=true (evidence)
#
# SANITISED 2026-04-28: the original capture file at this path
# contained four real `username … privilege 15 secret 9 …` hashes
# from the lab device. Even though Cisco type-9 hashes (Scrypt-based,
# salt-prefixed) are not directly reversible, they are credential
# material and must not be merged into a public branch. The four
# affected lab accounts have been rotated on the device.
#
# This file is replaced with a structurally-equivalent but
# CREDENTIAL-FREE example so the diagnostics evidence bundle still
# documents the test 3 outcome (Captured + allowSecrets=true honoured)
# without leaking real hashes.
#
# Lessons captured for the doc-only closure in
# release-readiness-evaluation.md §"Tracked deferrals":
#  - Reconciler now enforces a server-side allowlist
#    (internal/provider/diagnostic/command_validation.go) so
#    `show running-config | include username` only runs when the CR
#    has explicit allowSecrets=true; default redaction strips the
#    secret material in any case.
#  - Evidence-bundle review: every YAML committed under
#    docs/rfcs/final/evidence/ must be sanitised before commit.
#    Operators capturing live evidence pass the file through
#    diagnostic.Redact before review.

apiVersion: config.cisco.vk/v1alpha1
kind: IOSXEDiagnostic
metadata:
  name: t3-allow-secrets
  namespace: cisco-vk-smoke
spec:
  allowSecrets: true
  commands:
    - show running-config | include username
  deviceRef:
    name: cat9k-smoke
status:
  conditions:
    - lastTransitionTime: "2026-04-28T06:48:23Z"
      message: 1 command(s) captured
      observedGeneration: 1
      reason: Captured
      status: "True"
      type: Ready
  lastCapture: "2026-04-28T06:48:22Z"
  observedGeneration: 1
  phase: Completed
  results:
    - capturedAt: "2026-04-28T06:48:22Z"
      commands:
        - command: show running-config | include username
          # CREDENTIAL-FREE EXAMPLE — original hashes redacted post-capture.
          # Real captures with allowSecrets=true contain device-specific
          # `secret 9 $14$…$…` hashes here; never commit those.
          output: |-
            username operator privilege 15 secret 9 ***REDACTED***
            username readonly privilege 15 secret 9 ***REDACTED***
            ip ftp username operator
