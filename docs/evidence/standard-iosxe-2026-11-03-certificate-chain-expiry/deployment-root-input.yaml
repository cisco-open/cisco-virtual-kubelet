apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    qualification: 20261103-stdchain
  name: cvk-stdchain-fixture
  namespace: cvk-stdchain-apps-20261103
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cvk-stdchain-fixture
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: cvk-stdchain-fixture
        cert-case: root
        qualification: 20261103-stdchain
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchFields:
              - key: metadata.name
                operator: In
                values:
                - c9k-stdchain-20261103
      containers:
      - image: https://192.168.129.111:18457/root-agent-a.tar
        imagePullPolicy: Always
        name: agent
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: 128Mi
          requests:
            memory: 128Mi
      tolerations:
      - effect: NoSchedule
        key: cisco.vk/device
        operator: Exists
